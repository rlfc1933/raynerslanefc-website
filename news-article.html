<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>News | Rayners Lane FC</title>
  <meta name="description" content="The latest news, match reports and announcements from Rayners Lane FC — Harrow's club since 1933, Combined Counties Premier Division North.">
  <link rel="icon" type="image/png" href="img/badge.png">
  <!-- Self-hosted type: Bebas Neue (display) + Manrope (everything else). No Google Fonts request. -->
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .article-hero{background:var(--dark);padding:64px 0 48px;border-bottom:1px solid var(--border)}
    .article-body{max-width:720px;margin:0 auto;padding:48px 24px}
    .article-body p{font-family:var(--font-b);font-size:17px;color:var(--lgrey);line-height:1.9;margin-bottom:20px}
    .article-img{width:100%;aspect-ratio:16/9;object-fit:cover;margin-bottom:32px}
  </style>
  <!-- lane-schema:start -->
  <!-- The club entity, baked in rather than injected by JS.
       js/components.js also builds this, but at runtime — which Googlebot sees
       (it renders JS) and the AI crawlers mostly do not. Since being cited by
       those is the entire point, it ships in the HTML. injectJSONLD() skips any
       id that already exists, so the runtime copy stands down and there is
       still exactly ONE club entity per page.
       ⛔ Regenerate with scratchpad/bake-schema.js — don't hand-edit, and never
       add a fact that isn't on the club's own pages. -->
  <script type="application/ld+json" id="lane-org">{"@context":"https://schema.org","@type":["SportsTeam","SportsOrganization","LocalBusiness"],"@id":"https://raynerslanefc.co.uk/#team","name":"Rayners Lane FC","legalName":"Rayners Lane Football Club","alternateName":["The Lane","Rayners Lane","Rayners Lane Football Club"],"sport":"Soccer","foundingDate":"1933","foundingLocation":{"@type":"Place","name":"Harrow, Middlesex, England"},"award":["Hellenic League Division One Champions (1982)","FA Cup Second Qualifying Round (1992-93)"],"url":"https://raynerslanefc.co.uk/","logo":"https://raynerslanefc.co.uk/img/badge.png","image":"https://raynerslanefc.co.uk/img/og-card.jpg","email":"info@raynerslanefc.co.uk","description":"Rayners Lane FC ('The Lane') — a community football club founded in 1933, playing non-league football at Tithe Farm, Harrow, in the Combined Counties Premier Division North at Step 5 of the English football pyramid.","memberOf":{"@type":"SportsOrganization","name":"Combined Counties Football League","url":"https://www.combinedcountiesleague.co.uk"},"address":{"@type":"PostalAddress","streetAddress":"151 Rayners Lane","addressLocality":"Harrow","addressRegion":"Middlesex","postalCode":"HA2 0XH","addressCountry":"GB"},"geo":{"@type":"GeoCoordinates","latitude":51.570435,"longitude":-0.365073},"areaServed":[{"@type":"Place","name":"Harrow"},{"@type":"Place","name":"Rayners Lane"},{"@type":"Place","name":"Pinner"},{"@type":"Place","name":"South Harrow"},{"@type":"Place","name":"Ruislip"},{"@type":"Place","name":"Northwood"},{"@type":"Place","name":"Wembley"},{"@type":"AdministrativeArea","name":"London Borough of Harrow"}],"openingHoursSpecification":[{"@type":"OpeningHoursSpecification","dayOfWeek":"Saturday","opens":"14:00","closes":"17:00","description":"Matchday"}],"knowsAbout":["Community football","Non-league football","Football in Harrow","Digital and technology in grassroots football"],"sameAs":["https://twitter.com/RaynersLaneFC","https://instagram.com/raynerslanefc","https://www.youtube.com/channel/UCN6SkwSIRK86x9Wk0AFoydA"]}</script>
  <script type="application/ld+json" id="lane-site">{"@context":"https://schema.org","@type":"WebSite","@id":"https://raynerslanefc.co.uk/#website","url":"https://raynerslanefc.co.uk/","name":"Rayners Lane FC","publisher":{"@id":"https://raynerslanefc.co.uk/#team"},"inLanguage":"en-GB"}</script>
  <script type="application/ld+json" id="lane-breadcrumb">{"@context":"https://schema.org","@type":"BreadcrumbList","@id":"https://raynerslanefc.co.uk/news-article.html#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://raynerslanefc.co.uk/"},{"@type":"ListItem","position":2,"name":"Newsroom","item":"https://raynerslanefc.co.uk/news.html"},{"@type":"ListItem","position":3,"name":"News Article","item":"https://raynerslanefc.co.uk/news-article.html"}]}</script>
  <!-- lane-schema:end -->
</head>
<body>
<div id="nav-placeholder"></div>

<div class="article-hero">
  <div class="container">
    <a href="index.html" style="font-family:var(--font-c);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)">← Back to News</a>
    <div style="height:20px"></div>
    <div id="art-cat" style="font-family:var(--font-c);font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--yellow);margin-bottom:12px"></div>
    <h1 id="art-title" style="font-family:var(--font-d);font-size:clamp(36px,6vw,72px);letter-spacing:.03em;line-height:.95;color:var(--white);margin-bottom:16px"></h1>
    <div style="display:flex;align-items:center;gap:16px;flex-wrap:wrap">
      <span id="art-date" style="font-family:var(--font-c);font-size:13px;color:var(--grey);letter-spacing:.06em"></span>
      <span id="art-author" style="font-family:var(--font-c);font-size:13px;color:var(--grey);letter-spacing:.06em"></span>
      <!-- PUBLIC share. Taps out a branded card for THIS story and hands it to
           the phone's share sheet — WhatsApp, Messages, Instagram. No login,
           nothing to design. Every share carries the card and the link back. -->
      <button id="art-share" type="button" style="display:none;align-items:center;gap:8px;background:var(--yellow);color:var(--black);border:none;border-radius:8px;font-family:var(--font-c);font-size:12.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;padding:11px 18px;min-height:44px;cursor:pointer;-webkit-tap-highlight-color:transparent">
        <i class="ico ico-smartphone"></i> Share
      </button>
    </div>
  </div>
</div>

<div class="article-body">
  <img id="art-img" src="" alt="" class="article-img" style="display:none">
  <div id="art-body"></div>
  <div style="margin-top:40px;padding-top:24px;border-top:1px solid var(--border)">
    <a href="index.html" style="font-family:var(--font-c);font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--yellow)">← All News</a>
  </div>
</div>

<div id="twitter-placeholder"></div>
<div id="footer-placeholder"></div>
<script src="js/components.js"></script>
<script src="js/sponsor-rail.js"></script>
<script src="js/share-news.js"></script>
<script>
document.addEventListener('DOMContentLoaded', async () => {
  initComponents('news-article.html');
  const id = new URLSearchParams(window.location.search).get('id');
  if (!id) { window.location.href='index.html'; return; }
  try {
    const r = await fetch('data/news.json?t='+Date.now());
    const d = await r.json();
    const art = d.articles.find(a => a.id === id);
    if (!art) { window.location.href='index.html'; return; }
    var _aImg = art.image ? (/^https?:/.test(art.image) ? art.image : 'https://raynerslanefc.co.uk/' + art.image.replace(/^\//, '')) : 'https://raynerslanefc.co.uk/img/og-card.jpg';
    var _aCanon = 'https://raynerslanefc.co.uk/news-article.html?id=' + encodeURIComponent(art.id);
    setPageSEO({
      title: art.title + ' | Rayners Lane FC',
      description: (art.excerpt || (art.body || '').replace(/\s+/g, ' ').trim().slice(0, 155)),
      canonical: _aCanon, image: _aImg, ogType: 'article',
      jsonld: {
        '@context': 'https://schema.org', '@type': 'NewsArticle',
        headline: art.title, image: [_aImg],
        datePublished: art.date || undefined, dateModified: art.date || undefined,
        author: { '@type': art.author ? 'Person' : 'Organization', name: art.author || 'Rayners Lane FC' },
        publisher: { '@type': 'Organization', name: 'Rayners Lane FC', logo: { '@type': 'ImageObject', url: 'https://raynerslanefc.co.uk/img/badge.png' } },
        mainEntityOfPage: _aCanon, articleSection: art.category || 'News'
      }
    });
    document.getElementById('art-title').textContent = art.title;
    document.getElementById('art-cat').textContent = art.category || 'Club News';
    document.getElementById('art-date').textContent = art.date || '';
    document.getElementById('art-author').textContent = art.author ? 'By '+art.author : '';
    if (art.image) {
      const img = document.getElementById('art-img');
      img.src = art.image; img.alt = art.title || 'Article image'; img.style.display='block';
    }
    document.getElementById('art-body').innerHTML = (art.body||'')
      .split('\n').filter(l=>l.trim())
      .map(l=>`<p>${l}</p>`).join('');

    // Only show Share once we actually have an article to share.
    const sb = document.getElementById('art-share');
    if (sb && window.rlShareArticle) {
      // shareHeadline is the dramatic hook staff signed off at publish time.
      // Absent (older articles) -> the card falls back to the real title.
      const payload = { id: art.id, title: art.title, image: art.image,
                        category: art.category, shareHeadline: art.shareHeadline || '' };
      sb.style.display = 'inline-flex';
      sb.addEventListener('click', () => window.rlShareArticle(payload, sb));
      // Build the card now, quietly, while they're reading. navigator.share()
      // has to fire on the tap itself — a 1.1s render in between spends the
      // user gesture and iOS refuses to open the share sheet at all.
      const warm = () => window.rlPrebuildCard && window.rlPrebuildCard(payload);
      if (window.requestIdleCallback) requestIdleCallback(warm, { timeout: 2500 });
      else setTimeout(warm, 1200);
    }
  } catch(e) {
    document.getElementById('art-body').innerHTML = '<p style="color:var(--grey)">Article not found.</p>';
  }
});
</script>
</body>
</html>
