  <link rel="preload" href="fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/style.css">

<body>
<div id="nav-placeholder"></div>

<section class="kl-ph kl-ph--yellow e4" aria-labelledby="ph-title">
  <div class="kl-wrap kl-ph__inner e4__in">
    <p class="e4__num" aria-hidden="true">404</p>
    <h1 class="kl-ph__title e4__title" id="ph-title"><span class="kl-line"><span>Ball&rsquo;s gone</span></span><span class="kl-line"><span>over the fence.</span></span></h1>
    <p class="kl-ph__line e4__line" id="e404-line">That page doesn't exist — let's get you back to Tithe Farm.</p>
    <nav class="e4__routes" aria-label="Routes back">
      <a class="kl-btn kl-btn--ink" href="index.html">Back to the homepage</a>
      <a class="kl-btn kl-btn--inkline" href="fixtures.html">View fixtures</a>

    </nav>
  </div>
</section>

<div id="footer-placeholder"></div>
<script src="js/consent.js?v=1"></script>
<script src="js/components.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", function(){
    initComponents("404.html");
    // Rotating, on-brand one-liners
    var lines = [
      "That page doesn't exist — let's get you back to Tithe Farm.",
      "Even VAR couldn't find this one.",
      "This page got relegated. Sorry about that.",
      "Offside. Take it again from the homepage.",
      "Whatever you're after, it's not on this pitch.",
      "404: doing a lap of the car park."
    ];
    // One line per visit, picked once. It used to rotate every 3.2s, which is
    // motion that explains nothing and moving text nobody can pause (WCAG 2.2.2).
    var el = document.getElementById('e404-line');
    if (el) el.textContent = lines[Math.floor(Math.random() * lines.length)];
  });
</script>
