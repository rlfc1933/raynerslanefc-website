<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Lane App — Interactive Prototype v2</title>
<style>
  :root{
    --y:#FFD100; --g:#1A5C32; --bk:#080808; --dk:#0F0F0F; --c:#161616; --c2:#1E1E1E;
    --br:#2A2A2A; --w:#F5F3ED; --gr:#8A8A82; --re:#EF4444; --su:#22C55E; --am:#F59E0B; --bl:#3B82F6;
    --fd:var(--font-display); --fc:var(--font-body); --fb:var(--font-body);
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  body{background:#2b2b2b;font-family:var(--fb);color:var(--w);min-height:100vh;padding:20px 14px 60px;
    background-image:radial-gradient(120% 70% at 50% 0%,#1e2418 0%,#202020 60%)}

  .demo-hdr{max-width:1240px;margin:0 auto 14px;text-align:center}
  .demo-hdr h1{font-family:var(--fd);font-size:34px;letter-spacing:2px}
  .demo-hdr h1 span{color:var(--y)}
  .demo-hdr p{font-family:var(--fc);font-size:13px;color:#b9b9b0;margin-top:2px}
  .badges{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:9px}
  .bdg{font-family:var(--fc);font-weight:700;font-size:10px;letter-spacing:.12em;text-transform:uppercase;padding:5px 11px;border-radius:20px}
  .bdg.r{background:rgba(239,68,68,.13);border:1px solid rgba(239,68,68,.4);color:#ff9d9d}
  .bdg.g{background:rgba(34,197,94,.13);border:1px solid rgba(34,197,94,.4);color:#8ff0b4}

  .switch{max-width:1240px;margin:16px auto;display:flex;gap:7px;justify-content:center;flex-wrap:wrap}
  .switch button{background:var(--c);border:1px solid var(--br);color:#c9c9c1;font-family:var(--fc);font-weight:800;
    font-size:11px;letter-spacing:.08em;text-transform:uppercase;padding:9px 13px;border-radius:9px;cursor:pointer}
  .switch button.on{background:var(--y);color:#0d0d0d;border-color:var(--y)}
  .switch .lbl{font-family:var(--fc);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gr);align-self:center}
  .reset{background:none!important;border:1px dashed #555!important;color:#888!important}

  .stage{display:flex;gap:24px;justify-content:center;align-items:flex-start;flex-wrap:wrap;max-width:1240px;margin:0 auto}
  .phone{width:378px;height:812px;background:#000;border-radius:44px;padding:11px;
    box-shadow:0 30px 70px -20px rgba(0,0,0,.85),0 0 0 2px #333;position:relative;flex-shrink:0}
  .phone::after{content:'';position:absolute;top:20px;left:50%;transform:translateX(-50%);width:108px;height:23px;background:#000;border-radius:14px;z-index:20}
  .screen{width:100%;height:100%;background:var(--bk);border-radius:34px;overflow:hidden;position:relative;display:flex;flex-direction:column}
  .screen::before{content:'';position:absolute;inset:0;background:radial-gradient(110% 55% at 78% -8%,rgba(255,209,0,.10) 0%,transparent 55%);pointer-events:none;z-index:0}

  .abar{display:flex;align-items:center;gap:9px;padding:34px 15px 11px;border-bottom:1px solid var(--br);position:relative;z-index:2;background:rgba(8,8,8,.72)}
  .abar img{width:29px;height:29px;object-fit:contain}
  .abar .t{font-family:var(--fd);font-size:18px;letter-spacing:.06em;flex:1;background:linear-gradient(90deg,#fff,var(--y));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
  .abar .role{font-family:var(--fc);font-weight:800;font-size:9px;letter-spacing:.1em;text-transform:uppercase;padding:4px 8px;border-radius:20px;background:rgba(255,209,0,.15);color:var(--y)}
  .abar .role.mgr{background:rgba(26,92,50,.35);color:#7fe0a3}
  .abar .role.chair{background:rgba(59,130,246,.2);color:#93c5fd}

  .body{flex:1;overflow-y:auto;padding:13px 15px 92px;position:relative;z-index:1}
  .body::-webkit-scrollbar{width:0}
  .tabs{position:absolute;bottom:0;left:0;right:0;display:flex;background:#0A0A0A;border-top:2px solid var(--y);z-index:5}
  .tabs button{flex:1;background:none;border:none;color:#7a7a72;padding:10px 3px 15px;cursor:pointer;font-family:var(--fc);font-weight:700;font-size:8.5px;letter-spacing:.06em;text-transform:uppercase}
  .tabs button .ic{display:block;font-size:18px;margin-bottom:2px}
  .tabs button.on{color:var(--y)}

  .eyebrow{font-family:var(--fc);font-weight:700;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--y);margin:2px 0 8px}
  .card{background:var(--c);border:1px solid var(--br);border-radius:13px;padding:13px;margin-bottom:10px}
  .card.hero{background:linear-gradient(150deg,#16200f,#0b0b0b 65%);border-color:rgba(255,209,0,.3)}
  h2.big{font-family:var(--fd);font-size:26px;letter-spacing:1px;line-height:.95}
  .muted{font-family:var(--fc);font-size:11.5px;color:var(--gr)}

  .vs{display:flex;align-items:center;justify-content:center;gap:13px;margin:10px 0 6px}
  .vs img{width:50px;height:50px;object-fit:contain}
  .vs .sep{font-family:var(--fd);font-size:20px;color:var(--y)}
  .vs .opp{width:50px;height:50px;border-radius:50%;background:var(--c2);border:1px solid var(--br);display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:16px;color:#bbb}
  .ha{display:inline-block;font-family:var(--fc);font-weight:800;font-size:9px;letter-spacing:.12em;text-transform:uppercase;padding:3px 8px;border-radius:20px;margin-bottom:6px}
  .ha.h{background:rgba(255,209,0,.18);color:var(--y)} .ha.a{background:rgba(59,130,246,.2);color:#93c5fd}

  .meta{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:10px}
  .meta div{background:rgba(255,255,255,.04);border-radius:8px;padding:7px 9px}
  .meta .k{font-family:var(--fc);font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--gr)}
  .meta .v{font-family:var(--fc);font-weight:700;font-size:13px;margin-top:1px}

  .btn{display:block;width:100%;border:none;border-radius:11px;padding:13px;cursor:pointer;
    font-family:var(--fc);font-weight:800;font-size:13px;letter-spacing:.07em;text-transform:uppercase}
  .btn:active{transform:scale(.98)}
  .btn-y{background:linear-gradient(135deg,#fff3bf,var(--y));color:#0d0d0d}
  .btn-g{background:var(--g);color:#fff}
  .btn-o{background:transparent;border:1px solid var(--br);color:#c9c9c1}
  .btn-wa{background:#25D366;color:#0b2e18}
  .btn-sm{padding:9px;font-size:11px;border-radius:8px}
  .split{display:grid;grid-template-columns:1fr 1fr;gap:8px}

  .avail-btn{border:2px solid var(--br);background:var(--c2);color:#c9c9c1;border-radius:12px;padding:15px 8px;cursor:pointer;
    font-family:var(--fc);font-weight:800;font-size:12.5px;letter-spacing:.05em;text-transform:uppercase}
  .avail-btn .ic{display:block;font-size:22px;margin-bottom:3px}
  .avail-btn.yes.on{border-color:var(--su);background:rgba(34,197,94,.18);color:#8ff0b4}
  .avail-btn.no.on{border-color:var(--re);background:rgba(239,68,68,.16);color:#ffa3a3}

  .status-banner{border-radius:12px;padding:13px;text-align:center;margin-bottom:10px}
  .status-banner .s{font-family:var(--fd);font-size:24px;letter-spacing:1px;line-height:1}
  .status-banner .d{font-family:var(--fc);font-size:11.5px;margin-top:3px}
  .sb-start{background:linear-gradient(135deg,rgba(255,209,0,.22),rgba(255,209,0,.06));border:1px solid rgba(255,209,0,.5)}
  .sb-start .s{color:var(--y)}
  .sb-sub{background:rgba(26,92,50,.28);border:1px solid rgba(26,92,50,.7)} .sb-sub .s{color:#7fe0a3}
  .sb-non{background:rgba(255,255,255,.05);border:1px solid var(--br)} .sb-non .s{color:#9a9a92}
  .sb-wait{background:rgba(245,158,11,.14);border:1px solid rgba(245,158,11,.45)} .sb-wait .s{color:#ffca6b}

  .prow{display:flex;align-items:center;gap:9px;background:var(--c);border:1px solid var(--br);border-radius:10px;padding:8px 10px;margin-bottom:5px}
  .prow .num{font-family:var(--fd);font-size:18px;color:rgba(255,209,0,.5);width:22px;text-align:center;flex-shrink:0}
  .prow .ph{width:30px;height:30px;border-radius:50%;background:linear-gradient(160deg,#242424,#0d0d0d);border:1px solid var(--br);
    display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:12px;color:var(--y);flex-shrink:0}
  .prow .nm{flex:1;font-family:var(--fc);font-weight:700;font-size:13.5px;line-height:1.1}
  .prow .nm small{display:block;font-weight:600;font-size:9.5px;color:var(--gr);text-transform:uppercase;letter-spacing:.08em}
  .pill{font-family:var(--fc);font-weight:800;font-size:8.5px;letter-spacing:.09em;text-transform:uppercase;padding:4px 7px;border-radius:20px;flex-shrink:0}
  .pill.yes{background:rgba(34,197,94,.18);color:#8ff0b4}
  .pill.no{background:rgba(239,68,68,.16);color:#ffa3a3}
  .pill.wait{background:rgba(245,158,11,.14);color:#ffca6b}
  .pill.xi{background:var(--y);color:#0d0d0d}
  .pill.sub{background:rgba(26,92,50,.5);color:#9ff0c0}
  .pill.in{background:rgba(59,130,246,.22);color:#93c5fd}
  .selrow{cursor:pointer}

  .tally{display:flex;gap:6px;margin-bottom:9px}
  .tally div{flex:1;background:var(--c);border:1px solid var(--br);border-radius:9px;padding:7px;text-align:center}
  .tally .n{font-family:var(--fd);font-size:22px;line-height:1}
  .tally .l{font-family:var(--fc);font-size:8.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--gr);margin-top:2px}
  .tally .yes .n{color:var(--su)} .tally .no .n{color:var(--re)} .tally .wait .n{color:var(--am)} .tally .in .n{color:var(--bl)}

  .ann{background:var(--c);border-left:3px solid var(--y);border-radius:0 10px 10px 0;padding:10px 12px;margin-bottom:8px}
  .ann .t{font-family:var(--fc);font-weight:800;font-size:12.5px}
  .ann .m{font-family:var(--fb);font-size:12px;color:#b5b5ad;line-height:1.5;margin-top:3px}
  .ann .w{font-family:var(--fc);font-size:8.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--gr);margin-top:5px}
  .ann.chair{border-left-color:var(--bl)}
  .ann.fb{border-left-color:var(--g);background:rgba(26,92,50,.12)}

  .prof{text-align:center;padding:4px 0 2px}
  .prof .av{width:84px;height:84px;border-radius:50%;margin:0 auto 9px;background:linear-gradient(160deg,#242424,#0d0d0d);border:3px solid var(--y);
    display:flex;align-items:center;justify-content:center;font-family:var(--fd);font-size:30px;color:var(--y);position:relative}
  .prof .av .cam{position:absolute;bottom:-2px;right:-2px;width:26px;height:26px;border-radius:50%;background:var(--y);color:#111;
    display:flex;align-items:center;justify-content:center;font-size:12px;border:2px solid var(--bk)}
  .prof .nm{font-family:var(--fd);font-size:27px;letter-spacing:1px;line-height:1}
  .prof .po{font-family:var(--fc);font-weight:700;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--y);margin-top:3px}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:12px 0}
  .stats div{background:var(--c);border:1px solid var(--br);border-radius:10px;padding:10px 3px;text-align:center}
  .stats .n{font-family:var(--fd);font-size:22px;color:var(--y);line-height:1}
  .stats .l{font-family:var(--fc);font-size:8px;letter-spacing:.06em;text-transform:uppercase;color:var(--gr);margin-top:2px}

  .spon{background:linear-gradient(135deg,rgba(26,92,50,.35),rgba(11,11,11,.6));border:1px solid rgba(26,92,50,.6);border-radius:12px;padding:11px;text-align:center;margin-bottom:10px}
  .spon .k{font-family:var(--fc);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#7fe0a3}
  .spon .v{font-family:var(--fd);font-size:20px;letter-spacing:.5px;margin-top:2px}
  .honest{background:rgba(255,209,0,.07);border:1px solid rgba(255,209,0,.25);border-radius:10px;padding:9px 11px;
    font-family:var(--fb);font-size:11px;color:#cfcfc6;line-height:1.5}

  .fld{margin-bottom:9px;text-align:left}
  .fld label{font-family:var(--fc);font-weight:700;font-size:8.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--y);display:block;margin-bottom:4px}
  .fld input,.fld textarea,.fld select{width:100%;background:var(--c2);border:1px solid var(--br);border-radius:9px;padding:10px;color:#fff;font-family:var(--fb);font-size:13px}
  .fld textarea{resize:vertical;min-height:60px}
  .fld input:focus,.fld textarea:focus{outline:none;border-color:var(--y)}

  .login{height:100%;display:flex;flex-direction:column;justify-content:center;padding:28px 24px;text-align:center;position:relative;z-index:1}
  .login img{width:70px;height:70px;object-fit:contain;margin:0 auto 14px;filter:drop-shadow(0 6px 20px rgba(255,209,0,.4))}
  .login h1{font-family:var(--fd);font-size:36px;letter-spacing:1.5px;line-height:.92}
  .login h1 .y{color:var(--y)}
  .login p{font-family:var(--fc);font-size:12.5px;color:var(--gr);margin:7px 0 18px}
  .loginnote{font-family:var(--fb);font-size:10.5px;color:var(--gr);line-height:1.5;margin-top:12px}

  .push{position:absolute;top:12px;left:12px;right:12px;background:rgba(28,28,28,.97);border:1px solid var(--br);border-left:3px solid var(--y);
    border-radius:12px;padding:10px 12px;z-index:40;box-shadow:0 14px 40px rgba(0,0,0,.7);transform:translateY(-180%);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
  .push.on{transform:translateY(0)}
  .push .h{display:flex;align-items:center;gap:6px;margin-bottom:2px}
  .push .h img{width:14px;height:14px}
  .push .h b{font-family:var(--fc);font-weight:800;font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--y)}
  .push .b{font-family:var(--fb);font-size:12px;color:#e8e8e0;line-height:1.4}

  .notes{width:340px;flex-shrink:0}
  .notes h3{font-family:var(--fd);font-size:21px;letter-spacing:1px;color:var(--y);margin-bottom:9px}
  .note{background:rgba(255,255,255,.05);border:1px solid #3a3a3a;border-left:3px solid var(--y);border-radius:0 10px 10px 0;padding:11px 13px;margin-bottom:9px}
  .note b{font-family:var(--fc);font-weight:800;font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:#fff;display:block;margin-bottom:3px}
  .note p{font-family:var(--fb);font-size:12px;color:#c2c2ba;line-height:1.55}
  .note.g{border-left-color:var(--g)} .note.r{border-left-color:var(--re)} .note.b{border-left-color:var(--bl)}
  @media(max-width:830px){.notes{width:378px}}
</style>
  <!-- Self-hosted type: Bebas Neue (display) + Manrope (everything else). No Google Fonts request. -->
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
</head>
<body>

<div class="demo-hdr">
  <h1>THE LANE <span>APP</span></h1>
  <p>Interactive prototype v2 · roles · check-in · feedback · sponsors</p>
  <div class="badges">
    <span class="bdg g">✔ Data really saves (survives refresh)</span>
    <span class="bdg r">Demo players — not real</span>
  </div>
</div>

<div class="switch">
  <span class="lbl">Sign in as</span>
  <button id="sw-login" onclick="setRole('login')">🔑 Sign-up</button>
  <button id="sw-chair" onclick="setRole('chair')">🎩 Pete · Chairman</button>
  <button id="sw-mgr" class="on" onclick="setRole('mgr')">👔 Gary · Manager</button>
  <button id="sw-coach" onclick="setRole('coach')">🧢 Coach</button>
  <button id="sw-p1" onclick="setRole('p1')">⚽ Michael</button>
  <button id="sw-p2" onclick="setRole('p2')">⚽ Danny</button>
  <button class="reset" onclick="resetAll()">↺ Reset data</button>
</div>

<div class="stage">
  <div class="phone"><div class="screen">
    <div class="push" id="push"><div class="h"><img src="img/badge.png" alt=""><b>Rayners Lane FC</b></div><div class="b" id="push-body"></div></div>
    <div id="app"></div>
  </div></div>
  <div class="notes" id="notes"></div>
</div>

<script>
/* ═══════ PERSISTENCE — real, survives refresh (localStorage stands in for Supabase) ═══════ */
var KEY='laneapp_v2';
function save(){ localStorage.setItem(KEY, JSON.stringify(DB)); }
function load(){ try{ return JSON.parse(localStorage.getItem(KEY)); }catch(e){ return null; } }
function resetAll(){ localStorage.removeItem(KEY); DB=seed(); save(); render(); }

/* ═══════ SEED DATA ═══════ */
function seed(){ return {
  /* VENUES — away grounds are NOT Tithe Farm. Built once per opponent, reused forever. */
  /* VENUES — lat/lng matter: postcodes at sports grounds often drop you in a housing estate.
     One-time job per opponent (~20 clubs), then correct forever. Powers the map deep-links. */
  venues:{
    'Rayners Lane':         {ground:'Tithe Farm Sports & Social Club', addr:'151 Rayners Lane, Harrow HA2 0XH', ll:'51.5754,-0.3705'},
    'Harefield United':     {ground:'Preston Park',                    addr:'Breakspear Rd N, Harefield UB9 6NB', ll:'51.6045,-0.4795'},
    'Hanwell Town':         {ground:'Reynolds Field',                  addr:'Perivale Ln, Greenford UB6 8TL',    ll:'51.5405,-0.3300'},
    'Metropolitan Police':  {ground:'Imber Court',                     addr:'Ember Ln, East Molesey KT8 0BT',    ll:'51.3907,-0.3492'},
    'Harrow Police FC':     {ground:'Tithe Farm Sports & Social Club', addr:'151 Rayners Lane, Harrow HA2 0XH', ll:'51.5754,-0.3705'}
  },
  /* EVENTS — not just fixtures. Everything the squad is asked to turn up to. */
  fixtures:[
    {id:'f1', type:'cup',      opponent:'Harefield United', isHome:true,  comp:'FA Cup · Extra Prelim', date:'Sat 8 Aug',  ko:'3:00 PM', meet:'1:45 PM', kit:'Yellow / Green', published:false, src:'FWP'},
    {id:'f2', type:'league',   opponent:'Hanwell Town',     isHome:false, comp:'Combined Counties Prem North', date:'Sat 15 Aug', ko:'3:00 PM', meet:'1:15 PM (coach)', kit:'Away — White', published:false, src:'FWP'},
    {id:'f3', type:'charity',  opponent:'Harrow Police FC', isHome:true,  comp:'Charity Match · Air Ambulance', date:'Sun 24 Aug', ko:'2:00 PM', meet:'12:45 PM', kit:'Yellow / Green', published:false, src:'Added by staff'},
    {id:'f4', type:'friendly', opponent:'Metropolitan Police', isHome:false, comp:'Pre-Season Friendly', date:'Sat 25 Jul', ko:'3:00 PM', meet:'1:00 PM', kit:'Away — White', published:false, src:'Added by staff'},
    {id:'f5', type:'photo',    opponent:'', isHome:true, comp:'Squad Photoshoot & Media Day', date:'Thu 31 Jul', ko:'6:30 PM', meet:'6:15 PM', kit:'Full home kit — clean boots', published:false, src:'Added by staff'},
    {id:'f6', type:'event',    opponent:'', isHome:true, comp:'Sponsors’ Evening', date:'Fri 5 Sep', ko:'7:30 PM', meet:'7:15 PM', kit:'Club polo / smart', published:false, src:'Added by staff'}
  ],
  activeFixture:'f1',
  training:{id:'t1', when:'Thursday · 7:30 PM', where:'Tithe Farm — 3G'},
  players:[
    {id:'p1', no:9,  name:'Michael Adefolami', pos:'Forward',    status:'active',   sponsor:"McCafferty's Bar", photo:true,  bio:'Striker. Loves a back post header.'},
    {id:'p2', no:7,  name:'Danny Whitfield',   pos:'Midfielder', status:'active',   sponsor:'',                 photo:true,  bio:''},
    {id:'p3', no:1,  name:'Sam Okoro',         pos:'Goalkeeper', status:'active',   sponsor:'Hanlon Dry Lining',photo:true,  bio:''},
    {id:'p4', no:4,  name:'Jack Rennie',       pos:'Defender',   status:'active',   sponsor:'',                 photo:true,  bio:''},
    {id:'p5', no:6,  name:'Tom Beckford',      pos:'Defender',   status:'injured',  sponsor:'',                 photo:false, bio:''},
    {id:'p6', no:8,  name:'Ollie Grant',       pos:'Midfielder', status:'active',   sponsor:'',                 photo:true,  bio:''},
    {id:'p7', no:11, name:'Reece Nolan',       pos:'Forward',    status:'active',   sponsor:'',                 photo:false, bio:''},
    {id:'p8', no:5,  name:'Aaron Clarke',      pos:'Defender',   status:'active',   sponsor:'',                 photo:false, bio:''},
    {id:'p9', no:14, name:'Craig Dunne',       pos:'Midfielder', status:'released', sponsor:'',                 photo:false, bio:''}
  ],
  /* keyed by fixtureId -> playerId */
  avail:{ f1:{p1:'yes',p2:'yes',p3:'yes',p4:'yes',p6:'yes',p7:'wait',p8:'wait'} , f2:{} },
  sel:{ f1:{p1:'starting',p3:'starting',p4:'starting',p6:'sub'}, f2:{} },
  checkin:{ f1:{}, t1:{} },
  anns:[
    {t:'FA Cup — let’s pack the ground', m:'First cup tie of the season. Get your families down, get the noise up. Up The Lane.', w:'Pete Singh · Chairman', chair:true},
    {t:'Meet 1:45 sharp', m:'Cup game. Bring both kits. Anyone late is on the bench.', w:'Gary · Manager', chair:false}
  ],
  /* private notes ABOUT a player (staff only) */
  staffNotes:{ p2:'Great engine but switches off defensively. Work on tracking runners.' },
  /* feedback TO a player (player sees, can acknowledge — NOT a chat) */
  feedback:{ p1:[{m:'Outstanding hold-up play at Hayes. That’s the standard now. Keep the runs across the front post.', w:'Gary · after Hayes & Yeading', ack:false}] }
};}

var DB = load() || seed();
var role='mgr', tab='home', selPlayer=null;

/* ═══════ HELPERS ═══════ */
function fx(){ return DB.fixtures.filter(function(f){return f.id===DB.activeFixture;})[0]; }
function P(id){ return DB.players.filter(function(p){return p.id===id;})[0]; }
function squad(){ return DB.players.filter(function(p){return p.status==='active'||p.status==='injured';}); }
function me(){ return P(role); }
function av(pid){ return (DB.avail[fx().id]||{})[pid] || 'wait'; }
function sl(pid){ return (DB.sel[fx().id]||{})[pid] || 'none'; }
function ci(evt,pid){ return (DB.checkin[evt]||{})[pid] ? true : false; }
function cAv(k){ return squad().filter(function(p){return av(p.id)===k;}).length; }
function cSel(k){ return squad().filter(function(p){return sl(p.id)===k;}).length; }
function cCi(evt){ return Object.keys(DB.checkin[evt]||{}).length; }
function ini(n){ return n.split(' ').map(function(x){return x[0];}).join('').slice(0,2); }
function venue(){ var f=fx(); return DB.venues[f.isHome?'Rayners Lane':f.opponent] || {ground:'TBC',addr:''}; }
function isStaff(){ return role==='mgr'||role==='chair'||role==='coach'; }

/* EVENT TYPES — a match is only ONE kind of event. All of them need availability,
   notification and check-in. Only MATCHES need a squad selection. */
var TYPES={
  league:  {lbl:'League',    ic:'🏆', col:'var(--y)',  match:true},
  cup:     {lbl:'Cup',       ic:'🥇', col:'#ffca6b',   match:true},
  charity: {lbl:'Charity',   ic:'❤️', col:'#ff9d9d',   match:true},
  friendly:{lbl:'Friendly',  ic:'🤝', col:'#93c5fd',   match:true},
  photo:   {lbl:'Photoshoot',ic:'📸', col:'#7fe0a3',   match:false},
  event:   {lbl:'Club Event',ic:'🎟️', col:'#c4b5fd',   match:false}
};
function ty(f){ return TYPES[(f||fx()).type] || TYPES.league; }
function isMatch(f){ return ty(f).match; }

function push(msg){ document.getElementById('push-body').textContent=msg;
  var el=document.getElementById('push'); el.classList.add('on'); setTimeout(function(){el.classList.remove('on');},3800); }
function setRole(r){ role=r; tab='home'; selPlayer=null;
  ['login','chair','mgr','coach','p1','p2'].forEach(function(k){var b=document.getElementById('sw-'+k); if(b)b.classList.toggle('on',k===r);});
  render(); }
function setTab(t){ tab=t; selPlayer=null; render(); }
function setFixture(id){ DB.activeFixture=id; save(); render(); }

/* ═══════ ACTIONS (all persist) ═══════ */
function setAvail(v){ var f=fx(); DB.avail[f.id]=DB.avail[f.id]||{}; DB.avail[f.id][role]=v; save();
  push(v==='yes' ? 'Saved — you’re AVAILABLE vs '+f.opponent+'. Gary sees it instantly.' : 'Saved — you’re out. Gary has been told.'); render(); }
function cycleSel(id){ var f=fx(), p=P(id);
  if(av(id)!=='yes'){ push('Can’t pick '+p.name.split(' ')[0]+' — not available.'); return; }
  DB.sel[f.id]=DB.sel[f.id]||{};
  var cur=sl(id); DB.sel[f.id][id] = cur==='none'?'starting': cur==='starting'?'sub':'none';
  save(); render(); }
function publish(){ var f=fx(); f.published=true; save();
  push('Squad published — '+cSel('starting')+' starting, '+cSel('sub')+' subs. Every player notified.'); render(); }
function chase(){ push('Reminder pushed to '+cAv('wait')+' players who haven’t replied.'); }
function checkIn(evt){ DB.checkin[evt]=DB.checkin[evt]||{}; DB.checkin[evt][role]=Date.now(); save();
  push('✅ Checked in. Gary can see you’re here.'); render(); }
function mgrToggleCi(evt,pid){ DB.checkin[evt]=DB.checkin[evt]||{};
  if(DB.checkin[evt][pid]) delete DB.checkin[evt][pid]; else DB.checkin[evt][pid]=Date.now();
  save(); render(); }
function sendAnn(){ var t=document.getElementById('an-t').value.trim(), m=document.getElementById('an-m').value.trim();
  if(!t||!m){ push('Add a title and a message.'); return; }
  DB.anns.unshift({t:t,m:m,w:(role==='chair'?'Pete Singh · Chairman':'Gary · Manager'),chair:role==='chair'}); save();
  push('Broadcast sent to all '+squad().length+' players.'); render(); }
function saveNote(pid){ var v=document.getElementById('nt-'+pid).value.trim();
  DB.staffNotes[pid]=v; save(); push('Private note saved. The player cannot see this.'); render(); }
function sendFb(pid){ var v=document.getElementById('fb-'+pid).value.trim(); if(!v){push('Write some feedback first.');return;}
  DB.feedback[pid]=DB.feedback[pid]||[];
  DB.feedback[pid].unshift({m:v,w:(role==='mgr'?'Gary':'Coach')+' · after '+fx().opponent, ack:false});
  save(); push('Feedback sent to '+P(pid).name.split(' ')[0]+'. One-way — he can acknowledge, not reply.'); render(); }
function ackFb(i){ DB.feedback[role][i].ack=true; save(); push('Acknowledged 👍'); render(); }
function release(pid){ var p=P(pid); p.status = p.status==='released' ? 'active' : 'released'; save();
  push(p.status==='released' ? p.name+' released — app access revoked, stats kept in club history.' : p.name+' reinstated.'); render(); }
function toWhatsApp(){ var f=fx(), xi=squad().filter(function(p){return sl(p.id)==='starting';}).map(function(p){return p.name;});
  push('Opening WhatsApp — squad for '+f.opponent+' ready to paste into the group.'); }
function editProfile(){ var b=document.getElementById('bio-in');
  if(b){ me().bio=b.value; save(); push('Profile updated — this photo & bio also feed the website, programme and your goal graphics.'); render(); } }

/* ═══════ SHARED VIEWS ═══════ */
function fixturePicker(){
  return '<div style="display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px">' + DB.fixtures.map(function(f){
    var t=ty(f), on=f.id===DB.activeFixture;
    return '<button onclick="setFixture(\''+f.id+'\')" style="flex:0 0 auto;min-width:96px;background:'+(on?'var(--y)':'var(--c)')+';color:'+(on?'#0d0d0d':'#c9c9c1')+
      ';border:1px solid '+(on?'var(--y)':'var(--br)')+';border-radius:10px;padding:8px 10px;cursor:pointer;font-family:var(--fc);text-align:left">' +
      '<div style="font-size:9px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;opacity:'+(on?'.75':'1')+';color:'+(on?'#0d0d0d':t.col)+'">'+t.ic+' '+t.lbl+'</div>' +
      '<div style="font-weight:800;font-size:13px;margin-top:2px">'+f.date+'</div>' +
      '<div style="font-size:9.5px;opacity:.75">'+(f.opponent ? (f.isHome?'H · ':'A · ')+f.opponent.split(' ')[0] : 'Club')+'</div></button>';
  }).join('') + '</div>';
}
function fixtureCard(){
  var f=fx(), v=venue(), t=ty(f);
  var head;
  if(isMatch(f)){
    head = '<div style="text-align:center"><span class="ha '+(f.isHome?'h':'a')+'">'+(f.isHome?'🏠 Home':'🚌 Away')+'</span></div>' +
      '<div class="vs"><img src="img/badge.png" alt="RLFC"><span class="sep">VS</span><div class="opp">'+ini(f.opponent)+'</div></div>' +
      '<h2 class="big" style="text-align:center">'+(f.isHome?'RAYNERS LANE':f.opponent.toUpperCase())+'<br><span style="color:var(--y);font-size:16px">vs</span><br>'+(f.isHome?f.opponent.toUpperCase():'RAYNERS LANE')+'</h2>';
  } else {
    head = '<div style="text-align:center;font-size:38px;margin:6px 0 2px">'+t.ic+'</div>' +
      '<h2 class="big" style="text-align:center">'+f.comp.toUpperCase()+'</h2>' +
      '<div class="muted" style="text-align:center;margin-top:4px">No squad selection — but everyone still gets asked, notified and checked in.</div>';
  }
  return '<div class="card hero">' +
    '<div class="eyebrow" style="text-align:center;color:'+t.col+'">'+t.ic+' '+t.lbl+(isMatch(f)?' · '+f.comp:'')+'</div>' +
    head +
    '<div class="meta">' +
      '<div><div class="k">Date</div><div class="v">'+f.date+'</div></div>' +
      '<div><div class="k">'+(isMatch(f)?'Kick-off':'Starts')+'</div><div class="v">'+f.ko+'</div></div>' +
      '<div><div class="k">Meet</div><div class="v">'+f.meet+'</div></div>' +
      '<div><div class="k">'+(isMatch(f)?'Kit':'Wear')+'</div><div class="v">'+f.kit+'</div></div>' +
    '</div>' +
    '<div style="margin-top:9px;background:rgba(255,255,255,.04);border-radius:9px;padding:9px">' +
      '<div style="font-family:var(--fc);font-weight:800;font-size:12px">📍 '+v.ground+'</div>' +
      '<div class="muted" style="font-size:10.5px;margin-bottom:8px">'+v.addr+'</div>' +
      '<div style="display:flex;gap:5px">' +
        '<button class="btn btn-o btn-sm" style="flex:1;padding:8px 4px;font-size:9.5px" onclick="nav(\'drive\')">🚗 Drive</button>' +
        '<button class="btn btn-o btn-sm" style="flex:1;padding:8px 4px;font-size:9.5px" onclick="nav(\'waze\')">🛣️ Waze</button>' +
        '<button class="btn btn-o btn-sm" style="flex:1;padding:8px 4px;font-size:9.5px" onclick="nav(\'transit\')">🚇 Transport</button>' +
      '</div>' +
      '<div class="muted" style="font-size:9px;margin-top:6px;text-align:center">Opens the map app on your phone — free, no API key, live traffic</div>' +
    '</div>' +
    '<div class="muted" style="text-align:center;margin-top:7px;font-size:9.5px">Source: '+(f.src==='FWP'?'🔄 auto-imported from Football Web Pages':'✍️ added by staff')+'</div>' +
  '</div>';
}
/* Map DEEP LINKS — no API, no key, no billing, no scraping. The phone's own map app routes it. */
function nav(mode){
  var v=venue();
  var url = mode==='waze'   ? 'https://waze.com/ul?ll='+v.ll+'&navigate=yes'
          : mode==='transit'? 'https://www.google.com/maps/dir/?api=1&destination='+v.ll+'&travelmode=transit'
                            : 'https://www.google.com/maps/dir/?api=1&destination='+v.ll+'&travelmode=driving';
  push((mode==='waze'?'Waze':mode==='transit'?'Google Maps (public transport)':'Google Maps (driving)')+' → '+v.ground);
  window.open(url,'_blank');
}
function annFeed(){
  var out='<div class="eyebrow">From the club</div>';
  out += DB.anns.map(function(a){ return '<div class="ann '+(a.chair?'chair':'')+'"><div class="t">'+a.t+'</div><div class="m">'+a.m+'</div><div class="w">'+a.w+'</div></div>'; }).join('');
  return out;
}

/* ═══════ PLAYER ═══════ */
function playerHome(){
  var p=me(), f=fx(), s=sl(role), a=av(role), banner;
  if(!f.published) banner='<div class="status-banner sb-wait"><div class="s">SQUAD NOT PICKED YET</div><div class="d">Gary announces it Thursday night</div></div>';
  else if(s==='starting') banner='<div class="status-banner sb-start"><div class="s">YOU’RE STARTING</div><div class="d">Shirt '+p.no+' · meet '+f.meet+'</div></div>';
  else if(s==='sub') banner='<div class="status-banner sb-sub"><div class="s">YOU’RE ON THE BENCH</div><div class="d">Be ready · meet '+f.meet+'</div></div>';
  else banner='<div class="status-banner sb-non"><div class="s">NOT IN THE SQUAD</div><div class="d">Not this week — come down and back the lads</div></div>';

  var out = fixturePicker() + banner + fixtureCard();

  out += '<div class="card"><div class="eyebrow">Are you available?</div><div class="split">' +
    '<button class="avail-btn yes '+(a==='yes'?'on':'')+'" onclick="setAvail(\'yes\')"><span class="ic">✅</span>Available</button>' +
    '<button class="avail-btn no '+(a==='no'?'on':'')+'" onclick="setAvail(\'no\')"><span class="ic">❌</span>Can’t Play</button>' +
    '</div><div class="muted" style="text-align:center;margin-top:8px">Two taps. Gary sees it instantly.</div></div>';

  /* match-day check-in */
  out += '<div class="card"><div class="eyebrow">Match-day check-in</div>' +
    (ci(f.id,role)
      ? '<div class="status-banner sb-sub" style="margin:0"><div class="s">✅ CHECKED IN</div><div class="d">Gary knows you’re here</div></div>'
      : '<button class="btn btn-g" onclick="checkIn(\''+f.id+'\')">📍 I’m here — check in</button>') +
    '</div>';

  /* training check-in */
  out += '<div class="card"><div class="eyebrow">Training · '+DB.training.when+'</div>' +
    '<div class="muted" style="margin-bottom:8px">'+DB.training.where+'</div>' +
    (ci('t1',role)
      ? '<div class="muted" style="color:#8ff0b4">✅ Checked in at training</div>'
      : '<button class="btn btn-o btn-sm" onclick="checkIn(\'t1\')">✅ Check in at training</button>') +
    '</div>';

  return out;
}
function playerNews(){
  var out='';
  var fbs = DB.feedback[role]||[];
  if(fbs.length){
    out += '<div class="eyebrow">Your feedback from the gaffer</div>';
    out += fbs.map(function(f,i){
      return '<div class="ann fb"><div class="t">💬 Feedback</div><div class="m">'+f.m+'</div><div class="w">'+f.w+'</div>' +
        (f.ack ? '<div class="w" style="color:#8ff0b4">✔ You acknowledged this</div>'

}

/* ── ADD AN EVENT — friendlies, charity games, photoshoots will NEVER come from a feed ── */
var adding=false;
function toggleAdd(){ adding=!adding; render(); }
function addEvent(){
  var g=function(i){ return (document.getElementById(i)||{}).value||''; };
  var type=g('ae-type'), opp=g('ae-opp').trim(), date=g('ae-date').trim(), ko=g('ae-ko').trim(),
      meet=g('ae-meet').trim(), kit=g('ae-kit').trim(), ha=g('ae-ha'), comp=g('ae-comp').trim();
  if(!date||!ko){ push('Add a date and a time.'); return; }
  if(TYPES[type].match && !opp){ push('Who are we playing?'); return; }
  var id='f'+(DB.fixtures.length+1);
  DB.fixtures.push({id:id, type:type, opponent:opp, isHome:(ha==='home'),
    comp: comp || TYPES[type].lbl, date:date, ko:ko, meet:meet||'TBC', kit:kit||'TBC',
    published:false, src:'Added by staff'});
  if(opp && !DB.venues[opp]) DB.venues[opp] = {ground:'TBC — add the ground', addr:'Add address + coordinates once; correct forever', ll:'51.5754,-0.3705'};
  DB.activeFixture=id; adding=false; save();
  push('✅ Event added — every player has been asked if they’re available.');
  render();
}

function staffSquad(){

      '<h2 class="big" style="margin-top:6px">'+f.comp.toUpperCase()+'</h2>' +
      '<div class="muted" style="margin-top:8px">This isn’t a match — there’s no XI to pick.</div></div>' +
      '<div class="honest">A <b>photoshoot</b> or <b>sponsors’ evening</b> still needs availability, a push and a check-in — it just doesn’t need a squad. That’s why the model is <b style="color:var(--y)">events</b>, not fixtures. League, cup, charity, friendly, training, photoshoot, club night — all the same shape; only <i>matches</i> get a selection.</div>' +
      '<button class="btn btn-o btn-sm" style="margin-top:10px" onclick="setTab(\'home\')">← See who’s coming</button>';
  }
  var out = '<div class="eyebrow">Pick the squad · '+ty(f).ic+' '+f.comp+'</div>' +
  '<div class="tally"><div><div class="n" style="color:var(--y)">'+cSel('starting')+'<span style="font-size:13px;color:var(--gr)">/11</span></div><div class="l">Starting XI</div></div>' +
  '<div><div class="n" style="color:#7fe0a3">'+cSel('sub')+'</div><div class="l">Subs</div></div></div>';
  out += squad().map(function(p){
    var s=sl(p.id), a=av(p.id);
    var pill = s==='starting' ? '<span class="pill xi">Starting</span>' : s==='sub' ? '<span class="pill sub">Sub</span>'
             : a!=='yes' ? '<span class="pill no">Unavailable</span>' : '<span class="pill wait">Tap to pick</span>';
    return '<div class="prow selrow" onclick="cycleSel(\''+p.id+'\')" style="'+(a!=='yes'?'opacity:.42':'')+'">' +
      '<span class="num">'+p.no+'</span><div class="ph">'+(p.photo?ini(p.name):'?')+'</div><div class="nm">'+p.name+'<small>'+p.pos+'</small></div>'+pill+'</div>';
  }).join('');
  out += '<button class="btn btn-y" style="margin-top:9px" onclick="publish()">📣 Publish squad &amp; notify everyone</button>';
  out += '<div class="honest" style="margin-top:9px">Publishing pushes every player their status — <b>and can auto-build the Starting XI graphic and the programme team sheet</b> from this exact selection. Pick once; the content makes itself.</div>';
  return out;
}
function staffPlayers(){
  if(selPlayer){
    var p=P(selPlayer);
    return '<button class="btn btn-o btn-sm" style="margin-bottom:10px" onclick="selPlayer=null;render()">← All players</button>' +
    '<div class="card"><div class="prof"><div class="av">'+(p.photo?ini(p.name):'📷')+'</div>' +
      '<div class="nm">'+p.name.toUpperCase()+'</div><div class="po">'+p.pos+' · No. '+p.no+' · '+p.status.toUpperCase()+'</div></div></div>' +
    '<div class="card"><div class="eyebrow">🔒 Private note (player never sees this)</div>' +
      '<div class="fld"><textarea id="nt-'+p.id+'" placeholder="Coaching notes, attitude, development…">'+(DB.staffNotes[p.id]||'')+'</textarea></div>' +
      '<button class="btn btn-o btn-sm" onclick="saveNote(\''+p.id+'\')">Save private note</button></div>' +
    '<div class="card"><div class="eyebrow">💬 Send feedback (the player DOES see this)</div>' +
      '<div class="fld"><textarea id="fb-'+p.id+'" placeholder="Feedback after the last game…"></textarea></div>' +
      '<button class="btn btn-g btn-sm" onclick="sendFb(\''+p.id+'\')">Send feedback to '+p.name.split(' ')[0]+'</button>' +
      '<div class="honest" style="margin-top:9px">One-way. He can tap <b>👍 Got it</b> — he cannot reply. Feedback, not a chat. That’s the safeguarding line.</div></div>' +
    '<div class="card"><div class="eyebrow">Player sponsor</div>' +
      '<div class="muted">'+(p.sponsor || 'No sponsor — sellable at £150/season')+'</div></div>' +
    '<button class="btn '+(p.status==='released'?'btn-g':'btn-o')+' btn-sm" onclick="release(\''+p.id+'\')">' +
      (p.status==='released'?'↩︎ Reinstate '+p.name.split(' ')[0]:'🚪 Release '+p.name.split(' ')[0])+'</button>' +
    '<div class="honest" style="margin-top:9px">Releasing revokes app access and takes him out of selection — but <b>his appearances and goals stay in club history forever</b>. He moves to Former Players. Nothing is ever deleted.</div>';
  }
  var out = '<div class="eyebrow">Squad · tap a player</div>';
  out += DB.players.map(function(p){
    var st = p.status==='released' ? '<span class="pill no">Released</span>' : p.status==='injured' ? '<span class="pill wait">Injured</span>' : '<span class="pill yes">Active</span>';
    var sp = p.sponsor ? '<span class="pill sub">💼</span>' : '';
    return '<div class="prow selrow" onclick="selPlayer=\''+p.id+'\';render()" style="'+(p.status==='released'?'opacity:.45':'')+'">' +
      '<span class="num">'+p.no+'</span><div class="ph">'+(p.photo?ini(p.name):'?')+'</div>' +
      '<div class="nm">'+p.name+'<small>'+p.pos+'</small></div>'+sp+st+'</div>';
  }).join('');
  out += '<div class="honest" style="margin-top:9px">📸 Photoshoot headshots upload once here and flow to <b>the app, the website squad page, the programme team sheet and every graphic</b>.</div>';
  return out;
}
function staffTraining(){
  var out = '<div class="eyebrow">Training register · '+DB.training.when+'</div>' +
    '<div class="muted" style="margin-bottom:9px">'+DB.training.where+' · <b style="color:var(--y)">'+cCi('t1')+' checked in</b></div>';
  out += squad().map(function(p){
    var here = ci('t1',p.id);
    return '<div class="prow selrow" onclick="mgrToggleCi(\'t1\',\''+p.id+'\')">' +
      '<span class="num">'+p.no+'</span><div class="ph">'+(p.photo?ini(p.name):'?')+'</div><div class="nm">'+p.name+'<small>'+p.pos+'</small></div>' +
      (here?'<span class="pill in">✓ Here</span>':'<span class="pill wait">Tap</span>')+'</div>';
  }).join('');
  out += '<div class="honest" style="margin-top:9px">Players check themselves in, <b>or</b> Gary taps the register — whichever is quicker on the night. This builds attendance %, streaks, and feeds appearances.</div>';
  return out;
}
function staffPost(){
  return '<div class="eyebrow">Broadcast to the squad</div>' +
  '<div class="card">' +
    '<div class="fld"><label>Title</label><input id="an-t" placeholder="e.g. Meet time moved"></div>' +
    '<div class="fld"><label>Message</label><textarea id="an-m" placeholder="Goes to every player…"></textarea></div>' +
    '<button class="btn btn-g" onclick="sendAnn()">📣 Send to all '+squad().length+' players</button>' +
  '</div>' + annFeed();
}

/* ═══════ LOGIN / SIGN-UP ═══════ */
var authMode='choose';
function setAuth(m){ authMode=m; render(); }
function doSignup(){
  var g=function(i){ return (document.getElementById(i)||{}).value||''; };
  var name=g('su-name').trim(), em=g('su-em').trim(), ph=g('su-ph').trim(), pos=g('su-pos'), un=g('su-un').trim(), pw=g('su-pw').trim();
  if(!name||!em||!ph||!un||!pw){ push('Fill in every field.'); return; }
  if(!/^\d{6}$/.test(pw)){ push('Your code must be exactly 6 numbers.'); return; }
  if(DB.players.some(function(p){return (p.username||'').toLowerCase()===un.toLowerCase();})){ push('That username is taken — pick another.'); return; }
  var id='p'+(DB.players.length+1);
  DB.players.push({id:id,no:0,name:name,pos:pos,status:'pending',sponsor:'',photo:false,bio:'',email:em,phone:ph,username:un});
  save();
  push('✅ Signed up! Gary has been notified — he’ll approve you and you’re in the squad.');
  authMode='done'; render();
}
function approve(pid){ var p=P(pid); p.status='active'; save(); push('✅ '+p.name+' approved — now in the squad, and can be picked.'); render(); }
function reject(pid){ DB.players=DB.players.filter(function(p){return p.id!==pid;}); save(); push('Rejected and deleted.'); render(); }
function pending(){ return DB.players.filter(function(p){return p.status==='pending';}); }

function loginView(){
  if(authMode==='done'){
    return '<div class="login"><img src="img/badge.png" alt="RLFC">' +
      '<h1>YOU’RE<br><span class="y">IN THE QUEUE</span></h1>' +
      '<p style="margin-top:10px">Gary has been notified. He taps <b style="color:#fff">Approve</b> and you’re in the squad.</p>' +
      '<div class="honest" style="margin-top:14px;text-align:left">Switch to <b style="color:var(--y)">👔 Gary</b> at the top — you’ll see the pending approval waiting on his home screen.</div>' +
      '<button class="btn btn-o btn-sm" style="margin-top:14px" onclick="setAuth(\'choose\')">← Back</button></div>';
  }
  if(authMode==='staff'){
    return '<div class="login"><img src="img/badge.png" alt="RLFC">' +
      '<h1>STAFF<br><span class="y">SIGN IN</span></h1><p>Manager · Coach · Committee</p>' +
      '<div class="fld"><label>Username</label><input placeholder="gary.pitt" value="gary.pitt"></div>' +
      '<div class="fld"><label>Your 6-digit code</label><input type="password" placeholder="••••••" value="******"></div>' +
      '<button class="btn btn-y" onclick="setRole(\'mgr\')">Sign in</button>' +
      '<div class="loginnote" style="text-align:left"><b style="color:#fff">Each staff member has their OWN login</b> — not one shared PIN. That gives you an audit trail (who released a player, who wrote which note) and lets you revoke one person without changing everyone\'s code. You already built this: <code style="color:var(--y)">staff-login.js</code>.</div>' +
      '<button class="btn btn-o btn-sm" style="margin-top:12px" onclick="setAuth(\'choose\')">← Back</button></div>';
  }
  if(authMode==='signup'){
    return '<div class="login" style="justify-content:flex-start;padding-top:44px">' +
      '<h1 style="font-size:30px">PLAYER<br><span class="y">SIGN-UP</span></h1><p>Join the Rayners Lane squad</p>' +
      '<div class="fld"><label>Full name</label><input id="su-name" placeholder="Danny Whitfield"></div>' +
      '<div class="fld"><label>Email</label><input id="su-em" placeholder="you@email.com"></div>' +
      '<div class="fld"><label>Phone number</label><input id="su-ph" placeholder="07…"></div>' +
      '<div class="fld"><label>Position</label><select id="su-pos"><option>Goalkeeper</option><option>Defender</option><option selected>Midfielder</option><option>Forward</option></select></div>' +
      '<div class="fld"><label>Choose a username</label><input id="su-un" placeholder="dannyw"></div>' +
      '<div class="fld"><label>Choose a 6-digit code</label><input id="su-pw" type="password" inputmode="numeric" maxlength="6" placeholder="6 numbers"></div>' +
      '<button class="btn btn-y" onclick="doSignup()">Sign up</button>' +
      '<div class="loginnote" style="text-align:left">🔒 Your code is <b>hashed</b> and locked after 5 wrong tries — otherwise 6 digits is guessable in seconds. You go into a <b style="color:var(--y)">pending</b> queue until Gary approves you, so nobody can join the squad off the street.</div>' +
      '<button class="btn btn-o btn-sm" style="margin-top:10px" onclick="setAuth(\'choose\')">← Back</button></div>';
  }
  return '<div class="login">' +
    '<img src="img/badge.png" alt="RLFC">' +
    '<h1>THE LANE<br><span class="y">APP</span></h1>' +
    '<p>Players · Manager · Coaches · Committee</p>' +
    '<button class="btn btn-y" style="margin-bottom:9px" onclick="setAuth(\'signup\')">⚽ I’m a player — sign up</button>' +
    '<button class="btn btn-o" onclick="setAuth(\'staff\')">👔 Staff sign in</button>' +
    '<div class="loginnote" style="text-align:left;margin-top:16px"><b style="color:#fff">Players sign themselves up</b> — name, email, phone, position, a username and a 6-digit code. They land in a <b style="color:var(--y)">pending queue</b>; Gary gets a notification and approves with one tap. Same speed — but nobody joins your club by accident.</div>' +
  '</div>';
}

/* ═══════ RENDER ═══════ */
function render(){
  var app=document.getElementById('app');
  if(role==='login'){ app.innerHTML=loginView(); sideNotes(); return; }

  var body, tabs, badge, cls;
  if(isStaff()){
    var canSelect = (role!=='coach'); /* permission, not role */
    body = tab==='home'?staffHome() : tab==='squad'?(canSelect?staffSquad():'<div class="honest">🔒 Squad selection is a <b>permission</b>, not a role. The coach hasn’t been granted it — Pete can switch it on without any code change.</div>')
         : tab==='players'?staffPlayers() : tab==='train'?staffTraining() : staffPost();
    tabs=[['home','🏠','Avail'],['squad','📋','Squad'],['players','👥','Players'],['train','🏃','Training'],['post','📣','Post']];
    badge = role==='chair'?'Chairman':role==='coach'?'Coach':'Manager';
    cls = role==='chair'?'chair':'mgr';
  } else {
    body = tab==='home'?playerHome() : tab==='news'?playerNews() : playerMe();
    tabs=[['home','⚽','Match'],['news','📣','Club'],['me','👤','My Card']];
    badge = me().name.split(' ')[0]; cls='';
  }

  app.innerHTML =
    '<div class="abar"><img src="img/badge.png" alt=""><span class="t">THE LANE</span><span class="role '+cls+'">'+badge+'</span></div>' +
    '<div class="body">'+body+'</div>' +
    '<div class="tabs">'+tabs.map(function(t){
      return '<button class="'+(tab===t[0]?'on':'')+'" onclick="setTab(\''+t[0]+'\')"><span class="ic">'+t[1]+'</span>'+t[2]+'</button>';
    }).join('')+'</div>';
  sideNotes();
}

function sideNotes(){
  var n=document.getElementById('notes'), h='<h3>HOW IT WORKS</h3>';
  if(role==='login'){
    h+='<div class="note"><b>Try it: sign up as a player</b><p>Name, email, phone, position, username, 6-digit code. Then switch to <b>👔 Gary</b> — the approval is sitting on his home screen. One tap and the new player is in the squad, pickable, and gets pushes.</p></div>' +
       '<div class="note r"><b>Why "pending", not "instant"</b><p>An open signup that <i>instantly</i> joins the squad means <b>anyone on the internet</b> can be in your team — seeing team info, getting notifications, appearing in selection. Pending + one-tap approve costs Gary one second and closes that hole completely. Especially important before youth teams come on.</p></div>' +
       '<div class="note r"><b>Why staff get individual logins</b><p>A shared PIN gives you no audit trail — you can\'t tell <i>who</i> released a player or wrote a note, and you can\'t revoke one person. And <b>19332026 is printed in your public source code.</b> You already built individual staff logins (<code>staff-login.js</code>, salted + hashed) — use them.</p></div>' +
       '<div class="note g"><b>The 6-digit code is fine — with guardrails</b><p>A million combinations is guessable in seconds if you let someone try forever. Hashed + <b>locked after 5 wrong attempts</b> and it\'s perfectly reasonable for a football club. Easy for players, safe enough for their data.</p></div>';
  } else if(isStaff()){
    h+='<div class="note"><b>Events — not just fixtures</b><p>Swipe the strip at the top: <b>league, cup, charity, friendly, photoshoot, sponsors\' evening</b>. All of them need availability, a push and a check-in — only <i>matches</i> need an XI. Tap the 📸 Photoshoot then open the Squad tab to see that in action.</p></div>' +
       '<div class="note b"><b>Where events come from</b><p>League &amp; cup are <b>auto-imported from FWP</b>. Charity games, friendlies, photoshoots and club nights <b>will never come from a feed</b> — staff add those by hand. The card tells you which is which.</p></div>' +
       '<div class="note"><b>Not everything is at Tithe Farm</b><p>Each event carries its own ground and address, so away games give players real one-tap directions. The <b>opponent crest comes from your existing crest library</b>.</p></div>' +
       '<div class="note b"><b>Players tab → tap a player</b><p>Two <i>different</i> things live there: a <b>private note</b> (player never sees) and <b>feedback</b> (player sees, can only acknowledge). That distinction is the safeguarding line — feedback, never a chat.</p></div>' +
       '<div class="note b"><b>Release a player</b><p>Open Craig Dunne (released) or release anyone. Access revoked, out of selection — but <b>appearances and goals stay in club history</b>. Never delete; archive.</p></div>' +
       '<div class="note g"><b>Training tab</b><p>Tap the register, or let players check themselves in. Same QR check-in machinery you already built for fans.</p></div>' +
       '<div class="note r"><b>WhatsApp isn\'t the enemy</b><p>You won\'t kill the group chat. So the app does what WhatsApp can\'t — <b>counting</b> availability — then posts the summary <b>into</b> the group.</p></div>';
  } else {
    h+='<div class="note"><b>Everything is really saving</b><p>Change your availability, check in, refresh the page — it\'s still there. This prototype uses browser storage; the real one uses Supabase. <b>Same behaviour.</b></p></div>' +
       '<div class="note"><b>Try the full loop</b><p>Mark yourself Available → switch to Gary → Squad tab → tap yourself into the XI → Publish → come back here. Watch your screen change.</p></div>' +
       '<div class="note g"><b>My Card tab</b><p>Your <b>photoshoot headshot</b> is already there — one photo feeds the app, the website, the programme and your goal graphics. Your <b>player sponsor</b> sits on your card and on every graphic you appear in. That\'s a £150/season product.</p></div>' +
       '<div class="note r"><b>The stats say "–", not 0</b><p>Because faking them is worse than blanking them. From 1 Aug they <b>count themselves</b> from the games Gary records.</p></div>';
  }
  n.innerHTML=h;
}

save(); render();
</script>
</body>
</html>
