<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" style="width:100%;height:auto">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0A1A0A"/>
      <stop offset="100%" stop-color="#080808"/>
    </linearGradient>
    <linearGradient id="pitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D200D" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#080808" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="500" fill="url(#bg)"/>

  <!-- Pitch markings -->
  <ellipse cx="450" cy="460" rx="380" ry="60" fill="none" stroke="#1A3A1A" stroke-width="1.5" opacity="0.5"/>
  <line x1="450" y1="400" x2="450" y2="500" stroke="#1A3A1A" stroke-width="1" opacity="0.4"/>
  <ellipse cx="450" cy="460" rx="80" ry="20" fill="none" stroke="#1A3A1A" stroke-width="1" opacity="0.4"/>

  <!-- PLAYER 1 — Left — Darker skin — Running pose -->
  <g transform="translate(140, 80)">
    <!-- Shadow -->
    <ellipse cx="70" cy="405" rx="40" ry="10" fill="#000" opacity="0.3"/>
    <!-- Legs -->
    <rect x="52" y="290" width="18" height="90" rx="8" fill="#222" transform="rotate(-8, 61, 290)"/>
    <rect x="68" y="285" width="18" height="95" rx="8" fill="#222" transform="rotate(12, 77, 285)"/>
    <!-- Socks -->
    <rect x="50" y="355" width="20" height="30" rx="4" fill="#FFD100" transform="rotate(-8, 60, 355)"/>
    <rect x="67" y="358" width="20" height="30" rx="4" fill="#FFD100" transform="rotate(12, 77, 358)"/>
    <!-- Boots -->
    <ellipse cx="54" cy="386" rx="14" ry="7" fill="#111" transform="rotate(-8, 54, 386)"/>
    <ellipse cx="78" cy="389" rx="14" ry="7" fill="#111" transform="rotate(12, 78, 389)"/>
    <!-- Kit shorts -->
    <path d="M45 240 Q61 280 61 290 L79 290 Q79 280 95 240 Z" fill="#1A1A1A"/>
    <!-- Kit shirt — YELLOW -->
    <path d="M35 140 Q20 155 22 200 L30 240 L90 240 L100 200 Q102 155 85 140 Q72 130 61 128 Q50 130 35 140 Z" fill="#FFD100"/>
    <!-- Kit number -->
    <text x="61" y="200" text-anchor="middle" font-family="Arial Black" font-size="22" font-weight="900" fill="#1A5C32" opacity="0.8">7</text>
    <!-- Arms -->
    <path d="M35 150 Q10 170 8 210" stroke="#5C3317" stroke-width="16" stroke-linecap="round" fill="none"/>
    <path d="M87 150 Q118 175 125 200" stroke="#5C3317" stroke-width="16" stroke-linecap="round" fill="none"/>
    <!-- Hands -->
    <circle cx="8" cy="214" r="8" fill="#5C3317"/>
    <circle cx="125" cy="203" r="8" fill="#5C3317"/>
    <!-- Neck -->
    <rect x="54" y="108" width="16" height="22" rx="7" fill="#5C3317"/>
    <!-- Head — darker skin tone -->
    <circle cx="62" cy="90" r="32" fill="#5C3317"/>
    <!-- Hair -->
    <path d="M33 78 Q42 55 62 52 Q82 55 91 78 Q78 65 62 63 Q46 65 33 78 Z" fill="#1A0800"/>
    <!-- Eyes -->
    <circle cx="52" cy="88" r="4" fill="#fff"/>
    <circle cx="72" cy="88" r="4" fill="#fff"/>
    <circle cx="53" cy="89" r="2.5" fill="#1A0800"/>
    <circle cx="73" cy="89" r="2.5" fill="#1A0800"/>
  </g>

  <!-- PLAYER 2 — Centre — Medium brown skin — Jumping/celebrating -->
  <g transform="translate(360, 40)">
    <!-- Shadow -->
    <ellipse cx="80" cy="430" rx="45" ry="10" fill="#000" opacity="0.3"/>
    <!-- Legs spread -->
    <rect x="55" y="310" width="20" height="95" rx="9" fill="#222" transform="rotate(-20, 65, 310)"/>
    <rect x="75" y="310" width="20" height="95" rx="9" fill="#222" transform="rotate(20, 85, 310)"/>
    <!-- Socks -->
    <rect x="38" y="375" width="22" height="32" rx="5" fill="#FFD100" transform="rotate(-20, 49, 375)"/>
    <rect x="86" y="375" width="22" height="32" rx="5" fill="#FFD100" transform="rotate(20, 97, 375)"/>
    <!-- Boots -->
    <ellipse cx="36" cy="408" rx="16" ry="8" fill="#111" transform="rotate(-20, 36, 408)"/>
    <ellipse cx="102" cy="408" rx="16" ry="8" fill="#111" transform="rotate(20, 102, 408)"/>
    <!-- Shorts -->
    <path d="M48 250 Q65 300 65 310 L85 310 Q85 300 102 250 Z" fill="#1A1A1A"/>
    <!-- Kit shirt — YELLOW -->
    <path d="M30 140 Q12 158 14 210 L22 250 L108 250 L118 210 Q120 158 100 140 Q86 128 75 126 Q62 128 30 140 Z" fill="#FFD100"/>
    <!-- Kit number -->
    <text x="75" y="207" text-anchor="middle" font-family="Arial Black" font-size="24" font-weight="900" fill="#1A5C32" opacity="0.8">10</text>
    <!-- Arms raised -->
    <path d="M30 148 Q-10 100 -20 70" stroke="#8B5E3C" stroke-width="18" stroke-linecap="round" fill="none"/>
    <path d="M100 148 Q140 100 155 70" stroke="#8B5E3C" stroke-width="18" stroke-linecap="round" fill="none"/>
    <!-- Hands raised -->
    <circle cx="-20" cy="65" r="10" fill="#8B5E3C"/>
    <circle cx="155" cy="65" r="10" fill="#8B5E3C"/>
    <!-- Neck -->
    <rect x="68" y="105" width="18" height="24" rx="8" fill="#8B5E3C"/>
    <!-- Head — medium brown -->
    <circle cx="77" cy="84" r="35" fill="#8B5E3C"/>
    <!-- Hair — short fade -->
    <path d="M45 70 Q55 48 77 45 Q99 48 109 70 Q95 58 77 56 Q59 58 45 70 Z" fill="#1A0800"/>
    <!-- Eyes -->
    <circle cx="65" cy="82" r="4.5" fill="#fff"/>
    <circle cx="89" cy="82" r="4.5" fill="#fff"/>
    <circle cx="66" cy="83" r="3" fill="#2B1500"/>
    <circle cx="90" cy="83" r="3" fill="#2B1500"/>
    <!-- Smile -->
    <path d="M65 96 Q77 106 89 96" stroke="#1A0800" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- PLAYER 3 — Right — Lighter brown skin — Heading pose -->
  <g transform="translate(620, 90)">
    <!-- Shadow -->
    <ellipse cx="70" cy="395" rx="40" ry="10" fill="#000" opacity="0.3"/>
    <!-- Legs -->
    <rect x="50" y="285" width="19" height="85" rx="8" fill="#222" transform="rotate(5, 59, 285)"/>
    <rect x="70" y="280" width="19" height="90" rx="8" fill="#222" transform="rotate(-10, 79, 280)"/>
    <!-- Socks -->
    <rect x="50" y="348" width="20" height="28" rx="4" fill="#FFD100" transform="rotate(5, 60, 348)"/>
    <rect x="68" y="345" width="20" height="28" rx="4" fill="#FFD100" transform="rotate(-10, 78, 345)"/>
    <!-- Boots -->
    <ellipse cx="58" cy="376" rx="14" ry="7" fill="#111"/>
    <ellipse cx="80" cy="373" rx="14" ry="7" fill="#111"/>
    <!-- Shorts -->
    <path d="M44 235 Q61 275 61 285 L79 285 Q79 275 96 235 Z" fill="#1A1A1A"/>
    <!-- Kit shirt — YELLOW -->
    <path d="M34 138 Q18 152 20 196 L28 235 L92 235 L100 196 Q102 152 86 138 Q74 128 70 126 Q58 128 34 138 Z" fill="#FFD100"/>
    <!-- Kit number -->
    <text x="65" y="196" text-anchor="middle" font-family="Arial Black" font-size="22" font-weight="900" fill="#1A5C32" opacity="0.8">9</text>
    <!-- Arms -->
    <path d="M34 146 Q15 165 10 195" stroke="#C8956C" stroke-width="15" stroke-linecap="round" fill="none"/>
    <path d="M86 146 Q108 168 112 192" stroke="#C8956C" stroke-width="15" stroke-linecap="round" fill="none"/>
    <!-- Hands -->
    <circle cx="10" cy="198" r="8" fill="#C8956C"/>
    <circle cx="112" cy="194" r="8" fill="#C8956C"/>
    <!-- Neck -->
    <rect x="56" y="107" width="16" height="22" rx="7" fill="#C8956C"/>
    <!-- Head — lighter brown skin, heading pose (slightly back) -->
    <circle cx="64" cy="87" r="30" fill="#C8956C"/>
    <!-- Hair — longer on top -->
    <path d="M36 75 Q44 50 64 48 Q84 50 92 75 Q80 60 64 59 Q48 60 36 75 Z" fill="#2A1800"/>
    <!-- Eyes -->
    <circle cx="54" cy="86" r="4" fill="#fff"/>
    <circle cx="74" cy="86" r="4" fill="#fff"/>
    <circle cx="55" cy="87" r="2.5" fill="#2A1800"/>
    <circle cx="75" cy="87" r="2.5" fill="#2A1800"/>
    <!-- Concentrated expression -->
    <path d="M54 96 Q64 100 74 96" stroke="#2A1800" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- YELLOW decorative elements -->
  <text x="450" y="460" text-anchor="middle" font-family="Arial Black" font-size="160" font-weight="900" fill="#FFD100" opacity="0.03">RLFC</text>

  <!-- Bottom gradient overlay -->
  <rect width="900" height="500" fill="url(#pitch)" opacity="0.6"/>
</svg>