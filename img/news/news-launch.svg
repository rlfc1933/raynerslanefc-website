<svg viewBox="0 0 1200 675" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0F1A0F"/>
      <stop offset="100%" stop-color="#050805"/>
    </radialGradient>
    <radialGradient id="glow1" cx="30%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#FFD100" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#FFD100" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="70%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#AAAAAA" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#AAAAAA" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip-left">
      <rect x="0" y="0" width="600" height="675"/>
    </clipPath>
    <clipPath id="clip-right">
      <rect x="600" y="0" width="600" height="675"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow1)"/>
  <rect width="1200" height="675" fill="url(#glow2)"/>

  <!-- Grid lines -->
  <line x1="0" y1="225" x2="1200" y2="225" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  <line x1="0" y1="450" x2="1200" y2="450" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  <line x1="400" y1="0" x2="400" y2="675" stroke="rgba(255,255,255,.04)" stroke-width="1"/>
  <line x1="800" y1="0" x2="800" y2="675" stroke="rgba(255,255,255,.04)" stroke-width="1"/>

  <!-- Top yellow bar -->
  <rect x="0" y="0" width="1200" height="6" fill="#FFD100"/>

  <!-- Centre divider line -->
  <line x1="600" y1="80" x2="600" y2="595" stroke="rgba(255,255,255,.12)" stroke-width="1"/>
  <rect x="598" y="320" width="4" height="80" fill="#FFD100"/>

  <!-- X MARK decorative top right -->
  <text x="1100" y="300" font-family="Arial Black" font-size="320" font-weight="900"
        fill="rgba(255,255,255,.025)" text-anchor="middle">X</text>

  <!-- LEFT SIDE - RLFC -->
  <!-- Badge circle glow -->
  <circle cx="300" cy="338" r="200" fill="rgba(255,209,0,.07)"/>
  <circle cx="300" cy="338" r="175" fill="rgba(255,209,0,.05)"/>

  <!-- RLFC Badge (SVG recreation of the crest) -->
  <!-- Outer circle -->
  <circle cx="300" cy="338" r="155" fill="#FFD100"/>
  <circle cx="300" cy="338" r="155" fill="none" stroke="#1A5C32" stroke-width="18"/>
  <!-- Inner ring -->
  <circle cx="300" cy="338" r="130" fill="#FFD100" stroke="#1A5C32" stroke-width="4"/>

  <!-- Top text arc "RAYNERS LANE" -->
  <path id="arcTop" d="M 158,290 A 155,155 0 0,1 442,290" fill="none"/>
  <text font-family="Arial Black" font-size="22" font-weight="900" fill="#1A5C32" letter-spacing="3">
    <textPath href="#arcTop" startOffset="8%">RAYNERS LANE</textPath>
  </text>
  <!-- Bottom text arc "FOOTBALL CLUB" -->
  <path id="arcBot" d="M 158,386 A 155,155 0 0,0 442,386" fill="none"/>
  <text font-family="Arial Black" font-size="22" font-weight="900" fill="#1A5C32" letter-spacing="3">
    <textPath href="#arcBot" startOffset="7%">FOOTBALL CLUB</textPath>
  </text>

  <!-- Shield shape -->
  <path d="M300,238 L355,258 L355,308 Q355,358 300,390 Q245,358 245,308 L245,258 Z"
        fill="#1A5C32" stroke="#FFD100" stroke-width="3"/>
  <!-- Shield stripes -->
  <path d="M248,290 Q300,282 352,290 L350,302 Q300,294 250,302 Z" fill="rgba(255,209,0,.4)"/>
  <path d="M247,310 Q300,302 353,310 L351,322 Q300,314 249,322 Z" fill="rgba(255,209,0,.4)"/>
  <path d="M248,330 Q300,322 352,330 L350,342 Q300,334 250,342 Z" fill="rgba(255,209,0,.4)"/>
  <!-- Crown -->
  <path d="M283,245 L283,255 L289,250 L300,257 L311,250 L317,255 L317,245 Z" fill="#FFD100"/>
  <!-- Banner -->
  <rect x="255" y="365" width="90" height="20" rx="3" fill="#1A5C32"/>
  <text x="300" y="379" font-family="Arial Black" font-size="9" font-weight="900"
        fill="#FFD100" text-anchor="middle" letter-spacing="1">Rayners Lane FC</text>
  <!-- EST 1933 -->
  <text x="275" y="402" font-family="Arial Black" font-size="9" fill="#1A5C32" text-anchor="middle">EST.</text>
  <text x="325" y="402" font-family="Arial Black" font-size="9" fill="#1A5C32" text-anchor="middle">1933</text>

  <!-- Club name below badge -->
  <text x="300" y="545" font-family="Arial Black" font-size="28" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="4">RAYNERS LANE FC</text>
  <text x="300" y="572" font-family="Arial" font-size="13" fill="rgba(255,255,255,.4)"
        text-anchor="middle" letter-spacing="3">EST. 1933 · HARROW</text>

  <!-- Right side - CXLLAB -->
  <!-- CXLLAB logo recreation -->
  <circle cx="900" cy="310" r="120" fill="none" stroke="#CCCCCC" stroke-width="10"/>

  <!-- X pattern inside circle -->
  <!-- Main X diagonals -->
  <g transform="translate(900,310)">
    <!-- Top-left to bottom-right diagonal pair -->
    <line x1="-58" y1="-58" x2="-20" y2="-20" stroke="#CCCCCC" stroke-width="14" stroke-linecap="square"/>
    <line x1="20" y1="20" x2="58" y2="58" stroke="#CCCCCC" stroke-width="14" stroke-linecap="square"/>
    <!-- Top-right to bottom-left diagonal pair -->
    <line x1="58" y1="-58" x2="20" y2="-20" stroke="#CCCCCC" stroke-width="14" stroke-linecap="square"/>
    <line x1="-20" y1="20" x2="-58" y2="58" stroke="#CCCCCC" stroke-width="14" stroke-linecap="square"/>
    <!-- Horizontal pair -->
    <line x1="-80" y1="0" x2="-28" y2="0" stroke="#CCCCCC" stroke-width="14" stroke-linecap="square"/>
    <line x1="28" y1="0" x2="80" y2="0" stroke="#CCCCCC" stroke-width="14" stroke-linecap="square"/>
    <!-- Vertical pair -->
    <line x1="0" y1="-80" x2="0" y2="-28" stroke="#CCCCCC" stroke-width="14" stroke-linecap="square"/>
    <line x1="0" y1="28" x2="0" y2="80" stroke="#CCCCCC" stroke-width="14" stroke-linecap="square"/>
    <!-- Corner dots -->
    <circle cx="0" cy="-95" r="5" fill="#CCCCCC"/>
    <circle cx="95" cy="0" r="5" fill="#CCCCCC"/>
    <circle cx="0" cy="95" r="5" fill="#CCCCCC"/>
    <circle cx="-95" cy="0" r="5" fill="#CCCCCC"/>
    <!-- Inner arrows pointing inward -->
    <polyline points="-38,-18 -20,-18 -20,0" stroke="#CCCCCC" stroke-width="8" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
    <polyline points="38,-18 20,-18 20,0" stroke="#CCCCCC" stroke-width="8" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
    <polyline points="-38,18 -20,18 -20,0" stroke="#CCCCCC" stroke-width="8" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
    <polyline points="38,18 20,18 20,0" stroke="#CCCCCC" stroke-width="8" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
  </g>

  <!-- CXLLAB LDN text -->
  <text x="900" y="482" font-family="Arial Black" font-size="32" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="6">CXLLAB LDN</text>
  <text x="900" y="510" font-family="Arial" font-size="13" fill="rgba(255,255,255,.4)"
        text-anchor="middle" letter-spacing="3">CREATIVE STUDIO</text>

  <!-- Centre text area -->
  <text x="600" y="136" font-family="Arial Black" font-size="11" font-weight="700"
        fill="rgba(255,209,0,.6)" text-anchor="middle" letter-spacing="6">OFFICIAL ANNOUNCEMENT</text>

  <!-- Main headline -->
  <text x="600" y="610" font-family="Arial Black" font-size="42" font-weight="900"
        fill="white" text-anchor="middle" letter-spacing="2">A NEW DIGITAL ERA</text>
  <text x="600" y="648" font-family="Arial" font-size="15" fill="rgba(255,255,255,.35)"
        text-anchor="middle" letter-spacing="3">RAYNERS LANE FC × CXLLAB LDN · 2026</text>

  <!-- Celebratory stars/sparks -->
  <text x="520" y="100" font-size="18" fill="rgba(255,209,0,.5)">✦</text>
  <text x="668" y="88" font-size="12" fill="rgba(255,209,0,.35)">✦</text>
  <text x="490" y="65" font-size="8" fill="rgba(255,209,0,.25)">✦</text>
  <text x="700" y="108" font-size="22" fill="rgba(255,209,0,.4)">✦</text>
  <text x="555" y="72" font-size="14" fill="rgba(255,255,255,.2)">✦</text>

  <!-- Bottom bar -->
  <rect x="0" y="669" width="1200" height="6" fill="#FFD100"/>
</svg>