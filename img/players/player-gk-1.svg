<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="280" fill="#080E08"/>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="120" fill="rgba(255,209,0,0.04)"/>
  <!-- Kit number watermark -->
  <text x="100" y="200" text-anchor="middle" font-family="Arial Black,sans-serif" 
        font-size="140" font-weight="900" fill="rgba(255,209,0,0.06)">1</text>
  
  <!-- Player figure -->
  
        <!-- GK body slightly wider stance -->
        <path d="M62,148 L70,126 C75,117 88,114 100,126 C112,114 125,117 130,126 L138,148 Z" fill="#FFD100"/>
        <text x="100" y="144" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="16" font-weight="900" fill="#1A5C32">1</text>
        <!-- Arms spread wide -->
        <path d="M63,128 L32,122 C27,121 24,124 25,128 C26,132 30,134 35,133 L65,135 Z" fill="#FFD100"/>
        <path d="M137,128 L168,122 C173,121 176,124 175,128 C174,132 170,134 165,133 L135,135 Z" fill="#FFD100"/>
        <!-- GK gloves -->
        <ellipse cx="26" cy="129" rx="10" ry="8" fill="#FFD100"/>
        <ellipse cx="174" cy="129" rx="10" ry="8" fill="#FFD100"/>
        <ellipse cx="26" cy="129" rx="8" ry="6" fill="#1A5C32"/>
        <ellipse cx="174" cy="129" rx="8" ry="6" fill="#1A5C32"/>
        <!-- Shorts -->
        <path d="M66,148 L72,178 L92,178 L100,162 L108,178 L128,178 L134,148 Z" fill="#1A5C32"/>
        <!-- Wide legs -->
        <rect x="70" y="178" width="18" height="48" rx="6" fill="#F0C090"/>
        <rect x="112" y="178" width="18" height="48" rx="6" fill="#F0C090"/>
        <!-- Socks -->
        <rect x="70" y="210" width="18" height="22" rx="3" fill="white"/>
        <rect x="112" y="210" width="18" height="22" rx="3" fill="white"/>
        <!-- Boots -->
        <rect x="67" y="224" width="26" height="13" rx="4" fill="#111111"/>
        <rect x="109" y="224" width="26" height="13" rx="4" fill="#111111"/>
        
  
  <!-- Neck -->
  <rect x="89" y="106" width="22" height="22" rx="6" fill="#F0C090"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="28" ry="30" fill="#F0C090"/>
  
  <!-- Hair -->
  <ellipse cx="100" cy="66" rx="26" ry="14" fill="#1A0A00"/><rect x="78" y="60" width="8" height="18" rx="4" fill="#1A0A00"/><rect x="114" y="60" width="8" height="18" rx="4" fill="#1A0A00"/>
  
  <!-- Ears -->
  <ellipse cx="72" cy="92" rx="5" ry="7" fill="#D8A878"/>
  <ellipse cx="128" cy="92" rx="5" ry="7" fill="#D8A878"/>
  
  <!-- Eyes white -->
  <ellipse cx="90" cy="92" rx="6" ry="5" fill="white"/>
  <ellipse cx="110" cy="92" rx="6" ry="5" fill="white"/>
  <!-- Pupils -->
  <circle cx="91" cy="93" r="3.5" fill="#1A0800"/>
  <circle cx="109" cy="93" r="3.5" fill="#1A0800"/>
  <!-- Eye shine -->
  <circle cx="93" cy="91" r="1.2" fill="white"/>
  <circle cx="111" cy="91" r="1.2" fill="white"/>
  <!-- Eyebrows -->
  <path d="M84,82 C87,79 92,79 95,82" 
        stroke="#1A0800" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M105,82 C108,79 113,79 116,82" 
        stroke="#1A0800" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="100" cy="100" rx="4" ry="3" fill="#D8A878" opacity="0.6"/>
  <!-- Mouth / smile -->
  <path d="M92,108 C96,112 104,112 108,108" 
        stroke="#D8A878" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Yellow kit collar -->
  <path d="M88,122 C94,130 106,130 112,122" 
        fill="#FFD100"/>
</svg>