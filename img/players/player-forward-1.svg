<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="280" fill="#0A1A10"/>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="120" fill="rgba(255,209,0,0.04)"/>
  <!-- Kit number watermark -->
  <text x="100" y="200" text-anchor="middle" font-family="Arial Black,sans-serif" 
        font-size="140" font-weight="900" fill="rgba(255,209,0,0.06)">9</text>
  
  <!-- Player figure -->
  
        <!-- Body - yellow kit -->
        <path d="M70,145 L75,125 C80,118 90,115 100,128 C110,115 120,118 125,125 L130,145 Z" fill="#FFD100"/>
        <!-- Number on kit -->
        <text x="100" y="143" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="16" font-weight="900" fill="#1A5C32">9</text>
        <!-- Left arm raised -->
        <path d="M72,130 L48,105 C44,101 40,100 38,104 C36,108 38,112 43,114 L65,135 Z" fill="#FFD100"/>
        <!-- Right arm raised -->
        <path d="M128,130 L152,105 C156,101 160,100 162,104 C164,108 162,112 157,114 L135,135 Z" fill="#FFD100"/>
        <!-- Left hand -->
        <circle cx="40" cy="103" r="7" fill="#2C1508"/>
        <!-- Right hand -->
        <circle cx="160" cy="103" r="7" fill="#2C1508"/>
        <!-- Shorts -->
        <path d="M72,145 L78,175 L95,175 L100,160 L105,175 L122,175 L128,145 Z" fill="#1A5C32"/>
        <!-- Left leg -->
        <rect x="78" y="175" width="18" height="45" rx="6" fill="#2C1508"/>
        <!-- Right leg -->
        <rect x="104" y="175" width="18" height="45" rx="6" fill="#2C1508"/>
        <!-- White socks -->
        <rect x="78" y="205" width="18" height="20" rx="3" fill="white"/>
        <rect x="104" y="205" width="18" height="20" rx="3" fill="white"/>
        <!-- Boots -->
        <rect x="75" y="218" width="24" height="12" rx="4" fill="#111111"/>
        <rect x="101" y="218" width="24" height="12" rx="4" fill="#111111"/>
        
  
  <!-- Neck -->
  <rect x="89" y="106" width="22" height="22" rx="6" fill="#2C1508"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="28" ry="30" fill="#2C1508"/>
  
  <!-- Hair -->
  <ellipse cx="100" cy="64" rx="24" ry="12" fill="#0A0502"/><ellipse cx="100" cy="62" rx="20" ry="9" fill="#0D0604"/>
  
  <!-- Ears -->
  <ellipse cx="72" cy="92" rx="5" ry="7" fill="#3D1E0A"/>
  <ellipse cx="128" cy="92" rx="5" ry="7" fill="#3D1E0A"/>
  
  <!-- Eyes white -->
  <ellipse cx="90" cy="92" rx="6" ry="5" fill="white"/>
  <ellipse cx="110" cy="92" rx="6" ry="5" fill="white"/>
  <!-- Pupils -->
  <circle cx="91" cy="93" r="3.5" fill="#1A0800"/>
  <circle cx="109" cy="93" r="3.5" fill="#1A0800"/>
  <!-- Eye shine -->
  <circle cx="93" cy="91" r="1.2" fill="white"/>
  <circle cx="111" cy="91" r="1.2" fill="white"/>
  <!-- Eyebrows -->
  <path d="M84,82 C87,79 92,79 95,82" 
        stroke="#1A0800" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M105,82 C108,79 113,79 116,82" 
        stroke="#1A0800" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="100" cy="100" rx="4" ry="3" fill="#3D1E0A" opacity="0.6"/>
  <!-- Mouth / smile -->
  <path d="M92,108 C96,112 104,112 108,108" 
        stroke="#3D1E0A" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Yellow kit collar -->
  <path d="M88,122 C94,130 106,130 112,122" 
        fill="#FFD100"/>
</svg>