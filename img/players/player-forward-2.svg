<svg viewBox="0 0 200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="200" height="280" fill="#0D1008"/>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="120" fill="rgba(255,209,0,0.04)"/>
  <!-- Kit number watermark -->
  <text x="100" y="200" text-anchor="middle" font-family="Arial Black,sans-serif" 
        font-size="140" font-weight="900" fill="rgba(255,209,0,0.06)">11</text>
  
  <!-- Player figure -->
  
        <!-- Body twisted shooting -->
        <path d="M65,148 L72,126 C76,117 88,114 100,126 C112,114 124,117 128,126 L135,148 Z" fill="#FFD100"/>
        <text x="100" y="144" text-anchor="middle" font-family="Arial Black,sans-serif" font-size="16" font-weight="900" fill="#1A5C32">11</text>
        <!-- Left arm up for balance -->
        <path d="M67,128 L46,108 C42,104 38,105 37,109 C36,113 39,117 43,118 L66,134 Z" fill="#FFD100"/>
        <!-- Right arm back -->
        <path d="M133,132 L152,145 C156,148 157,152 154,154 C151,156 147,154 145,151 L129,140 Z" fill="#FFD100"/>
        <!-- Hands -->
        <circle cx="37" cy="110" r="7" fill="#C49060"/>
        <circle cx="155" cy="155" r="7" fill="#C49060"/>
        <!-- Shorts -->
        <path d="M67,148 L73,176 L92,176 L100,160 L108,176 L127,176 L133,148 Z" fill="#1A5C32"/>
        <!-- Left plant leg straight -->
        <rect x="75" y="176" width="16" height="52" rx="5" fill="#C49060"/>
        <!-- Right leg kicking forward high -->
        <path d="M110,176 C116,188 126,196 136,204" stroke="#C49060" stroke-width="16" stroke-linecap="round" fill="none"/>
        <!-- Socks -->
        <rect x="75" y="210" width="16" height="22" rx="3" fill="white"/>
        <ellipse cx="136" cy="204" rx="11" ry="9" fill="white"/>
        <!-- Boots -->
        <rect x="72" y="223" width="22" height="12" rx="4" fill="#111111"/>
        <ellipse cx="140" cy="210" rx="14" ry="8" fill="#111111" transform="rotate(-20 140 210)"/>
        
  
  <!-- Neck -->
  <rect x="89" y="106" width="22" height="22" rx="6" fill="#C49060"/>
  
  <!-- Head -->
  <ellipse cx="100" cy="90" rx="28" ry="30" fill="#C49060"/>
  
  <!-- Hair -->
  <ellipse cx="100" cy="63" rx="23" ry="10" fill="#050302"/>
  
  <!-- Ears -->
  <ellipse cx="72" cy="92" rx="5" ry="7" fill="#A87848"/>
  <ellipse cx="128" cy="92" rx="5" ry="7" fill="#A87848"/>
  
  <!-- Eyes white -->
  <ellipse cx="90" cy="92" rx="6" ry="5" fill="white"/>
  <ellipse cx="110" cy="92" rx="6" ry="5" fill="white"/>
  <!-- Pupils -->
  <circle cx="91" cy="93" r="3.5" fill="#1A0800"/>
  <circle cx="109" cy="93" r="3.5" fill="#1A0800"/>
  <!-- Eye shine -->
  <circle cx="93" cy="91" r="1.2" fill="white"/>
  <circle cx="111" cy="91" r="1.2" fill="white"/>
  <!-- Eyebrows -->
  <path d="M84,82 C87,79 92,79 95,82" 
        stroke="#1A0800" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M105,82 C108,79 113,79 116,82" 
        stroke="#1A0800" stroke-width="2" fill="none" stroke-linecap="round"/>
  <!-- Nose -->
  <ellipse cx="100" cy="100" rx="4" ry="3" fill="#A87848" opacity="0.6"/>
  <!-- Mouth / smile -->
  <path d="M92,108 C96,112 104,112 108,108" 
        stroke="#A87848" stroke-width="2" fill="none" stroke-linecap="round" opacity="0.7"/>
  
  <!-- Yellow kit collar -->
  <path d="M88,122 C94,130 106,130 112,122" 
        fill="#FFD100"/>
</svg>