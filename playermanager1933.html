  .login{flex:1;display:flex;flex-direction:column;justify-content:center;padding:24px;text-align:center;overflow-y:auto}

  .install-banner b{color:var(--y)}
  .spin{width:15px;height:15px;border:2px solid rgba(0,0,0,.25);border-top-color:#0d0d0d;border-radius:50%;display:inline-block;vertical-align:-2px;animation:sp .7s linear infinite}
  @keyframes sp{to{transform:rotate(360deg)}}

  .kp.press{background:var(--y);color:#0d0d0d;transform:scale(.88);border-color:var(--y)}

<body>
<div class="push" id="push"><div class="b" id="push-body"></div></div>
<div class="off" id="off"><i class="ico ico-bell-off"></i> Offline — your taps are saved and will sync when you're back.</div>
<div class="screen" id="root"></div>

<script>
/* ═══════ THE LANE APP — real backend (Supabase via Netlify functions) ═══════ */
var FN = '/.netlify/functions';
var LS = window.localStorage;
var state = { token: LS.getItem('la_token')||'', role: LS.getItem('la_role')||'', me:null, board:null, tab:'home', activeEvent:null, sel:null, busy:{} };

/* ── networking + offline write-queue (idempotent) ── */
function getQueue(){ try{ return JSON.parse(LS.getItem('la_queue')||'[]'); }catch(e){ return []; } }
function setQueue(q){ LS.setItem('la_queue', JSON.stringify(q)); }
function enqueue(item){ var q=getQueue(); q.push(item); setQueue(q); reflectOffline(); }
function uid(){ return 'k'+Math.random().toString(36).slice(2)+(state.token||'').slice(0,4); }

async function api(fn, body, opts){
  opts = opts||{};
  body = Object.assign({ token: state.token }, body||{});
  try{
    var r = await fetch(FN+'/'+fn, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    var j = await r.json().catch(function(){ return {ok:false,error:'Bad response'}; });
    return j;
  }catch(e){
    // network failure → queue write actions so nothing is lost
    if(opts.queueable){ enqueue({ fn:fn, body:body }); return { ok:true, queued:true }; }
    return { ok:false, error:'You appear to be offline.' };
  }
}
async function flushQueue(){
  var q=getQueue(); if(!q.length) return;
  var left=[];
  for(var i=0;i<q.length;i++){
    try{ var r=await fetch(FN+'/'+q[i].fn,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(q[i].body)}); var j=await r.json().catch(function(){return{ok:false};}); if(!j.ok && !j.queued) { /* drop only on definitive server reject to avoid loops */ } }
    catch(e){ left.push(q[i]); }
  }
  setQueue(left); reflectOffline();
  if(left.length===0 && q.length){ toast('Synced your offline taps.'); refresh(); }
}
function reflectOffline(){ var el=document.getElementById('off'); if(el) el.classList.toggle('on', !navigator.onLine || getQueue().length>0); }
window.addEventListener('online', function(){ reflectOffline(); flushQueue(); });
window.addEventListener('offline', reflectOffline);

/* ── toast / push ── */
function toast(msg, err){ var b=document.getElementById('push-body'), el=document.getElementById('push'); b.textContent=msg; el.classList.toggle('err',!!err); el.classList.add('on'); clearTimeout(window._pt); window._pt=setTimeout(function(){el.classList.remove('on');},3600); }

/* ── install (PWA) — Android/Chrome prompt + iOS walkthrough + install gate ── */
var deferredPrompt=null, isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
function isStandalone(){ return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone===true; }
window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferredPrompt=e; render(); });
window.addEventListener('appinstalled', function(){ deferredPrompt=null; toast('Installed — open “The Lane App” from your home screen.'); render(); });
async function installApp(){
  if(deferredPrompt){ deferredPrompt.prompt(); var c=await deferredPrompt.userChoice; deferredPrompt=null; if(c.outcome==='accepted') toast('Installing…'); render(); return; }
  if(isIOS){ showIosInstall(); return; }
  toast('Use your browser menu → “Install app” / “Add to Home Screen”.');
}
function canPromptInstall(){ return !!deferredPrompt || (isIOS && !isStandalone()); }
function installButton(){
  if(isStandalone()) return '';
  return '<div class="install-banner"><div style="display:flex;align-items:center;gap:10px">'+
    '<img src="/img/icon-pm-192.png" style="width:42px;height:42px;border-radius:10px">'+
    '<div style="flex:1;text-align:left"><div style="font-family:var(--fc);font-weight:800;font-size:14px">Install the app</div>'+
    '<div class="muted" style="font-size:10.5px">Add to your home screen — needed for match alerts</div></div></div>'+
    '<button class="btn btn-y btn-sm" style="margin-top:9px" onclick="installApp()"><i class="ico ico-smartphone"></i> Add to Home Screen</button></div>';
}
function showIosInstall(){
  document.getElementById('root').innerHTML =
    '<div class="login"><img src="/img/icon-pm-192.png" style="border-radius:16px">'+
    '<h1>ADD TO<br><span class="y">HOME SCREEN</span></h1>'+
    '<p>iPhone needs the app installed for notifications to work.</p>'+
    '<div class="card" style="text-align:left"><ol style="margin:0 0 0 18px;font-family:var(--fb);font-size:13.5px;line-height:1.9;color:#dcdcd4">'+
    '<li>Tap the <b style="color:var(--y)">Share</b> icon <span style="font-size:15px">􀈂</span> at the bottom of Safari</li>'+
    '<li>Scroll and tap <b style="color:var(--y)">Add to Home Screen</b></li>'+
    '<li>Tap <b style="color:var(--y)">Add</b> — then open <b>The Lane App</b> from your home screen</li>'+
    '</ol></div>'+
    '<div class="honest">On iPhone, push notifications <b>only work from the installed app</b>, not the Safari tab — so we set this up first.</div>'+
    '<button class="btn btn-o btn-sm" style="margin-top:12px" onclick="render()">← Back</button></div>';
}

/* ── notifications: register THIS device for push (management gets a buzz the
   moment a player signs up; players get their squad status). Asked after a
   first successful action, and only where push can actually work. ── */
function b64ToU8(base64){ var pad='='.repeat((4-base64.length%4)%4); var s=(base64+pad).replace(/-/g,'+').replace(/_/g,'/'); var raw=atob(s); var out=new Uint8Array(raw.length); for(var i=0;i<raw.length;i++) out[i]=raw.charCodeAt(i); return out; }
function pushSupported(){ return ('Notification' in window) && ('serviceWorker' in navigator) && ('PushManager' in window); }
function notifyState(){ if(!pushSupported()) return 'unsupported'; if(isIOS && !isStandalone()) return 'install-first'; return Notification.permission; } // default|granted|denied
async function enableNotifications(){
  if(!pushSupported()){ toast('This device can’t do notifications.',1); return; }
  if(isIOS && !isStandalone()){ showIosInstall(); return; }
  try{
    var perm = Notification.permission==='granted' ? 'granted' : await Notification.requestPermission();
    if(perm!=='granted'){ toast('Notifications are turned off in your settings.',1); render(); return; }
    var keyRes = await fetch(FN+'/push-key').then(function(r){return r.json();}).catch(function(){return{};});
    if(!keyRes.enabled || !keyRes.key){ toast('Alerts aren’t switched on by the club yet.',1); return; }
    var reg = await navigator.serviceWorker.ready;
    var sub = await reg.pushManager.getSubscription();
    if(!sub){ sub = await reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey: b64ToU8(keyRes.key) }); }
    var r = await api('la-push-subscribe', { subscription: sub.toJSON ? sub.toJSON() : sub });
    if(r.ok){ LS.setItem('la_notif','on'); toast('Alerts on — you’ll be notified on this phone.'); render(); }
    else toast(r.error||'Could not turn on alerts.',1);
  }catch(e){ toast('Could not turn on alerts.',1); }
}
async function maybeAskNotify(){
  if(notifyState()!=='default') return;            // already granted/denied, or can't
  if(LS.getItem('la_askedNotif')) return;
  LS.setItem('la_askedNotif','1');
  enableNotifications();
}
/* a tappable banner when alerts aren't on yet (staff especially want this) */
function notifyBanner(){
  var st=notifyState();
  if(st==='granted' && LS.getItem('la_notif')==='on') return '';
  if(st==='unsupported') return '';

/* ═══════ AUTH ═══════ */
var authMode='choose', pin='', staffPick='', staffDir=[];
function setAuth(m){ authMode=m; pin=''; staffPick=''; render(); if(m==='staff') loadStaffDir(); }
/* numeric keypad (4–10 digit code — players 6, management can be your existing PIN) */
function flashKey(el){ if(!el) return; el.classList.add('press'); setTimeout(function(){ el.classList.remove('press'); },130); try{ navigator.vibrate && navigator.vibrate(12); }catch(e){} }
function pinPress(d, el){ if(pin.length>=10) return; pin+=d; renderPinArea(); flashKey(el); }
function pinDel(el){ pin=pin.slice(0,-1); renderPinArea(); flashKey(el); }
function pinDots(){ var n=Math.max(pin.length,4), d=''; for(var i=0;i<n;i++){ d+='<span class="pdot'+(i<pin.length?' on':'')+'"></span>'; } return d; }
function renderPinArea(){ var el=document.getElementById('pin-dots'); if(el) el.innerHTML=pinDots(); }
function keypad(){ var keys=['1','2','3','4','5','6','7','8','9','','0','del'];
  return '<div class="keypad">'+keys.map(function(k){
    if(k==='') return '<div class="kp blank"></div>';
    if(k==='del') return '<button type="button" class="kp" style="font-size:24px" onclick="pinDel(this)">⌫</button>';
    return '<button type="button" class="kp" onclick="pinPress(\''+k+'\',this)">'+k+'</button>';
  }).join('')+'</div>';
}
function prettyStaff(s){ var nm=(s.username||'').replace(/[._]/g,' ').replace(/\b\w/g,function(c){return c.toUpperCase();}); var role=(s.role||'').charAt(0).toUpperCase()+(s.role||'').slice(1); return nm+' · '+role; }
async function loadStaffDir(){ var r=await api('la-staff-directory',{}); staffDir=(r&&r.staff)||[]; var sel=document.getElementById('staff-pick'); if(sel){ sel.innerHTML='<option value="">— choose —</option>'+staffDir.map(function(s){ return '<option value="'+esc(s.username)+'">'+esc(prettyStaff(s))+'</option>'; }).join(''); } }
async function doStaffLogin(){

async function doSignup(){

/* ═══════ LOAD ═══════ */
function isStaff(){ return ['chairman','manager','coach','staff'].indexOf(state.role)>=0; }
async function refresh(){
  if(!state.token){ render(); return; }
  if(isStaff()){
    var r=await api('la-board', { event_id: state.activeEvent });
    if(r.ok){ state.board=r; if(!state.activeEvent) state.activeEvent=r.activeEvent; LS.setItem('la_cache_board', JSON.stringify(r)); }
    else if(r.error){ if(/sign in|not active|staff/i.test(r.error)) return logout(); loadCache(); }
  } else {
    var r=await api('la-me', {});
    if(r.ok){ state.me=r; if(!state.activeEvent && r.events && r.events[0]) state.activeEvent=r.events[0].id; LS.setItem('la_cache_me', JSON.stringify(r)); }
    else if(r.error && /sign in/i.test(r.error)) return logout();
    else loadCache();
  }
  render();
}
// Offline / failed fetch → render the last-known data so event details, meet
// time and address are still readable at a ground with no signal.
function loadCache(){
  try{
    if(isStaff()){ var b=JSON.parse(LS.getItem('la_cache_board')||'null'); if(b){ state.board=b; if(!state.activeEvent) state.activeEvent=b.activeEvent; } }
    else { var m=JSON.parse(LS.getItem('la_cache_me')||'null'); if(m){ state.me=m; if(!state.activeEvent && m.events && m.events[0]) state.activeEvent=m.events[0].id; } }
  }catch(e){}
}

var TYPES={ league:{lbl:'League',ic:'<i class="ico ico-trophy"></i>',col:'var(--y)',match:true}, cup:{lbl:'Cup',ic:'<i class="ico ico-medal"></i>',col:'#ffca6b',match:true},

  club_event:{lbl:'Club Event',ic:'<i class="ico ico-ticket"></i>',col:'#c4b5fd',match:false} };

function fmtD(iso){ if(!iso) return 'TBC'; try{ return new Date(iso).toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short',timeZone:'Europe/London'}); }catch(e){ return 'TBC'; } }
function fmtT(iso){ if(!iso) return 'TBC'; try{ return new Date(iso).toLocaleTimeString('en-GB',{hour:'numeric',minute:'2-digit',timeZone:'Europe/London'}); }catch(e){ return 'TBC'; } }
function venueOf(e){ return (e&&e.la_venues) || {ground:'TBC',address:'',lat:null,lng:null}; }
function ini(n){ return (n||'').split(' ').map(function(x){return x[0];}).join('').slice(0,2).toUpperCase(); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  }).join('');
  out+='<button class="btn btn-y" style="margin-top:9px" onclick="publish()"><i class="ico ico-megaphone"></i> Publish squad &amp; notify everyone</button>';

function pickEvent(id){ state.activeEvent=id; if(isStaff()) refresh(); else render(); }
async function setAvail(v){
  var e=evt(); if(!e) return;
  e.myAvailability=v; render();                                   // optimistic
  var r=await api('la-availability', {event_id:e.id, status:v}, {queueable:true});
  if(r.queued){ toast('Saved offline — will sync.'); }
  else if(!r.ok){ toast(r.error||'Save failed.',1); refresh(); return; }
  else { toast(v==='available'?'Saved — you’re AVAILABLE.':'Saved — you’re out.'); }
  maybeAskNotify();
}
async function checkIn(){
  var e=evt(); if(!e) return;
  e.myCheckin=true; render();                                     // optimistic
  var r=await api('la-checkin', {event_id:e.id, idempotency_key:uid()}, {queueable:true});
  if(r.queued) toast('Check-in saved offline — will sync.');
  else if(!r.ok){ toast(r.error||'Check-in failed.',1); e.myCheckin=false; render(); return; }
  else toast('Checked in.');
  maybeAskNotify();
}
async function cycleSel(id, cur, avail){
  if(!avail){ toast('Can’t pick — not available.',1); return; }
  var next = cur==='none'||cur==='not_selected'?'starting': cur==='starting'?'sub':'not_selected';
  var r=await api('la-select', {event_id:state.activeEvent, player_id:id, role:next});
  if(!r.ok){ toast(r.error||'Could not save.',1); return; }
  refresh();
}
async function publish(){ var r=await api('la-publish', {event_id:state.activeEvent}); if(!r.ok){ toast(r.error||'Failed.',1); return; }
  toast('Squad published — '+r.starting+' starting, '+r.subs+' subs.'+(r.pushConfigured?' Everyone notified.':' (Push not set up yet.)')); refresh(); }
async function approve(id, reject){ var r=await api('la-approve', {player_id:id, reject:!!reject}); if(!r.ok){ toast(r.error||'Failed.',1); return; } toast(reject?'Rejected.':'Approved — now in the squad.'); refresh(); }
async function sendAnn(){ var t=(document.getElementById('an-t')||{}).value||'', m=(document.getElementById('an-m')||{}).value||''; if(!t||!m){ toast('Add a title and a message.',1); return; }

async function ackFb(id){ var r=await api('la-feedback', {ack:id}); if(r.ok){ toast('Acknowledged'); refresh(); } }

/* The club venue book (data/venues.json) — the same one the website's Directions
   buttons read. Loaded once and cached so adding an away game fills in the
   opponent's real ground instead of leaving players with "TBC". */
var VBOOK=null;
function vbNorm(s){ return String(s||'').toLowerCase().replace(/\bf\.?c\.?\b/g,'').replace(/\butd\b/g,'united').replace(/&/g,'and').replace(/[^a-z0-9]/g,''); }
async function venueBook(){
  if(VBOOK) return VBOOK;
  try{
    var r=await fetch('/data/venues.json?t='+Date.now());
    var j=await r.json(); VBOOK={};
    (j.venues||[]).forEach(function(v){ if(v&&v.club) VBOOK[vbNorm(v.club)]=v; });
  }catch(e){ VBOOK={}; }
  return VBOOK;
}
async function addEvent(){
  var g=function(i){return (document.getElementById(i)||{}).value||'';};
  var type=g('ae-type'), start=g('ae-start');
  if(!start){ toast('Pick a date & time.',1); return; }
  var home=g('ae-ha')==='home';
  // The venue is the HOME club's ground — for an away game that's the
  // opponent's. Look it up rather than shipping "TBC" with no coordinates, but
  // only trust a verified entry; an unchecked one stays TBC on purpose.
  var book=await venueBook();
  var homeClub = home ? 'Rayners Lane' : g('ae-opp').trim();
  var vb = book[vbNorm(homeClub)];
  var venue;
  if(vb && vb.verified && vb.lat!=null){
    venue={ club_name:vb.club, ground:vb.ground||'TBC',
      address:[vb.address,vb.postcode].filter(Boolean).join(', '),
      lat:vb.lat, lng:vb.lng, notes:vb.notes||null };
  } else if(home){
    venue={club_name:'Rayners Lane', ground:'Tithe Farm Sports & Social Club', address:'151 Rayners Lane, Harrow HA2 0XH', lat:51.570435, lng:-0.365073};
  } else {
    venue = g('ae-opp') ? {club_name:g('ae-opp').trim(), ground:'TBC', address:'', lat:null, lng:null} : null;
  }
  var body={ type:type, opponent:g('ae-opp').trim()||null, is_home:home, competition:g('ae-comp').trim()||null,
    starts_at:new Date(start).toISOString(), meet_at:g('ae-meet')?new Date(g('ae-meet')).toISOString():null, kit:g('ae-kit').trim()||null, venue:venue };
  var btn=document.getElementById('ae-go'); if(btn){btn.disabled=true;btn.innerHTML='<span class="spin"></span> Adding…';}
  var r=await api('la-event', body); if(!r.ok){ toast(r.error||'Failed.',1); if(btn){btn.disabled=false;btn.textContent='Add & ask the squad';} return; }
  state.activeEvent=r.event.id; toast('Event added — the squad has been asked.'); refresh();
}
