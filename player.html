<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Player Profile | Rayners Lane FC</title>
  <meta name="description" content="Player profile at Rayners Lane FC — appearances, goals and the story behind the Yellow Army squad. Harrow's club since 1933.">
  <link rel="icon" type="image/png" href="img/badge.png">
  <!-- Self-hosted type: Bebas Neue (display) + Manrope (everything else). No Google Fonts request. -->
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .player-hero { background:var(--black); min-height:420px; display:grid; grid-template-columns:360px 1fr; overflow:hidden; border-bottom:3px solid var(--yellow); }
    .player-hero-img { position:relative; overflow:hidden; background:linear-gradient(160deg,var(--green),#060E08); display:flex; align-items:flex-end; justify-content:center; }
    .player-hero-img img { width:100%; height:100%; object-fit:cover; object-position:top; }
    .player-hero-img .player-number { position:absolute; top:-20px; right:-10px; font-family:var(--font-d); font-size:200px; color:rgba(255,209,0,.08); line-height:1; }
    .player-hero-info { padding:48px 40px; display:flex; flex-direction:column; justify-content:flex-end; }
    .stat-empty{font-family:var(--font-b);font-size:14px;color:var(--grey);line-height:1.6;max-width:520px;margin-top:22px;padding-left:14px;border-left:2px solid rgba(255,209,0,.35)}
    .stat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(120px,1fr)); gap:2px; margin-top:32px; }
    .stat-card { background:var(--card); padding:20px; text-align:center; }
    .stat-num { font-family:var(--font-d); font-size:48px; letter-spacing:.04em; color:var(--yellow); line-height:1; }
    .stat-lbl { font-family:var(--font-c); font-size:10px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--grey); margin-top:4px; }
    .match-list { display:flex; flex-direction:column; gap:2px; }
    .match-row { display:grid; grid-template-columns:120px 1fr auto; gap:16px; align-items:center; background:var(--card); padding:14px 18px; text-decoration:none; border-left:3px solid transparent; }
    a.match-row:hover { border-left-color:var(--yellow); }
    .mr-date { font-family:var(--font-c); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--grey); }
    .mr-opp { font-family:var(--font-b); font-size:15px; color:var(--white); }
    .mr-what { font-family:var(--font-c); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--yellow); text-align:right; }
    @media(max-width:640px) { .match-row { grid-template-columns:1fr; gap:4px; } .mr-what { text-align:left; } }
    @media(max-width:768px) { .player-hero { grid-template-columns:1fr; } .player-hero-img { min-height:300px; } .player-hero-info { padding:24px; } }
  </style>
  <!-- lane-schema:start -->
  <!-- The club entity, baked in rather than injected by JS.
       js/components.js also builds this, but at runtime — which Googlebot sees
       (it renders JS) and the AI crawlers mostly do not. Since being cited by
       those is the entire point, it ships in the HTML. injectJSONLD() skips any
       id that already exists, so the runtime copy stands down and there is
       still exactly ONE club entity per page.
       ⛔ Regenerate with scratchpad/bake-schema.js — don't hand-edit, and never
       add a fact that isn't on the club's own pages. -->
  <script type="application/ld+json" id="lane-org">{"@context":"https://schema.org","@type":["SportsTeam","SportsOrganization","LocalBusiness"],"@id":"https://raynerslanefc.co.uk/#team","name":"Rayners Lane FC","legalName":"Rayners Lane Football Club","alternateName":["The Lane","Rayners Lane","Rayners Lane Football Club"],"sport":"Soccer","foundingDate":"1933","foundingLocation":{"@type":"Place","name":"Harrow, Middlesex, England"},"award":["Hellenic League Division One Champions (1982)","FA Cup Second Qualifying Round (1992-93)"],"url":"https://raynerslanefc.co.uk/","logo":"https://raynerslanefc.co.uk/img/badge.png","image":"https://raynerslanefc.co.uk/img/og-card.jpg","email":"info@raynerslanefc.co.uk","description":"Rayners Lane FC ('The Lane') — a community football club founded in 1933, playing non-league football at Tithe Farm, Harrow, in the Combined Counties Premier Division North at Step 5 of the English football pyramid.","memberOf":{"@type":"SportsOrganization","name":"Combined Counties Football League","url":"https://www.combinedcountiesleague.co.uk"},"address":{"@type":"PostalAddress","streetAddress":"151 Rayners Lane","addressLocality":"Harrow","addressRegion":"Middlesex","postalCode":"HA2 0XH","addressCountry":"GB"},"geo":{"@type":"GeoCoordinates","latitude":51.570435,"longitude":-0.365073},"areaServed":[{"@type":"Place","name":"Harrow"},{"@type":"Place","name":"Rayners Lane"},{"@type":"Place","name":"Pinner"},{"@type":"Place","name":"South Harrow"},{"@type":"Place","name":"Ruislip"},{"@type":"Place","name":"Northwood"},{"@type":"Place","name":"Wembley"},{"@type":"AdministrativeArea","name":"London Borough of Harrow"}],"openingHoursSpecification":[{"@type":"OpeningHoursSpecification","dayOfWeek":"Saturday","opens":"14:00","closes":"17:00","description":"Matchday"}],"knowsAbout":["Community football","Non-league football","Football in Harrow","Digital and technology in grassroots football"],"sameAs":["https://twitter.com/RaynersLaneFC","https://instagram.com/raynerslanefc","https://www.youtube.com/channel/UCN6SkwSIRK86x9Wk0AFoydA"]}</script>
  <script type="application/ld+json" id="lane-site">{"@context":"https://schema.org","@type":"WebSite","@id":"https://raynerslanefc.co.uk/#website","url":"https://raynerslanefc.co.uk/","name":"Rayners Lane FC","publisher":{"@id":"https://raynerslanefc.co.uk/#team"},"inLanguage":"en-GB"}</script>
  <script type="application/ld+json" id="lane-breadcrumb">{"@context":"https://schema.org","@type":"BreadcrumbList","@id":"https://raynerslanefc.co.uk/player.html#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"Home","item":"https://raynerslanefc.co.uk/"},{"@type":"ListItem","position":2,"name":"The Squad","item":"https://raynerslanefc.co.uk/squad.html"},{"@type":"ListItem","position":3,"name":"Player Profile","item":"https://raynerslanefc.co.uk/player.html"}]}</script>
  <!-- lane-schema:end -->
</head>
<body>
<div id="nav-placeholder"></div>

<div id="player-content">
  <div style="min-height:60vh;display:flex;align-items:center;justify-content:center">
    <div style="font-family:var(--font-c);font-size:14px;color:var(--grey);letter-spacing:.08em">Loading...</div>
  </div>
</div>

<div id="twitter-placeholder"></div>
<div id="footer-placeholder"></div>
<script src="js/components.js"></script>
<script src="js/player-record.js?v=7"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  initComponents('player.html');
  loadPlayer();
});

// GATE 7 — the page answers to two addresses.
//   ?id=player-beau-pryce   the club's own roster id, which every existing
//                           link on the site already uses.
//   ?p=beau-pryce           the confirmed identity's permanent slug.
// Both land on the same person. Neither invents one: a slug with no confirmed
// identity behind it returns nothing and the visitor goes back to the squad.
async function loadPlayer() {
  var qs = new URLSearchParams(window.location.search);
  var id = qs.get('id');
  var slug = qs.get('p');
  if (!id && !slug) { window.location.href = 'squad.html'; return; }

  try {
    var record = slug && window.LaneRecord ? await window.LaneRecord.detail(slug) : null;
    if (slug && !record && !id) { window.location.href = 'squad.html'; return; }
    if (record && record.clubPlayerId) id = record.clubPlayerId;

    var r = await fetch('data/players.json?t=' + Date.now());
    var d = await r.json();
    var player = (d.players || []).find(function(p) { return p.id === id; });
    if (!player && record) {
      // Confirmed, but not in the roster file — a player who has left. His
      // record still stands; it is his, and the club does not delete it.
      player = { id: record.clubPlayerId, name: record.name, photo: record.portrait || '', bio: record.bio || '' };
    }
    if (!player) { window.location.href = 'squad.html'; return; }

    if (!record && window.LaneRecord) {
      var season = await window.LaneRecord.season();
      var s = season[player.id];
      if (s && s.playerPage) record = await window.LaneRecord.detail(s.playerPage.split('p=')[1]);
      else if (s) record = { currentSeason: { all: s }, matches: [] };
    }
    renderPlayer(player, record);
  } catch(e) { window.location.href = 'squad.html'; }
}

function renderPlayer(p, record) {
  var _pImg = p.photo ? (/^https?:/.test(p.photo) ? p.photo : 'https://raynerslanefc.co.uk/' + p.photo.replace(/^\//, '')) : 'https://raynerslanefc.co.uk/img/og-card.jpg';
  // One canonical URL per player. The roster id is the primary form because
  // every existing link on the site uses it; a confirmed identity's slug is the
  // fallback for somebody who has left the squad list but keeps his record.
  var _pCanon = 'https://raynerslanefc.co.uk/player.html?' + (p.id
    ? 'id=' + encodeURIComponent(p.id)
    : 'p=' + encodeURIComponent((record && record.slug) || ''));
  setPageSEO({
    title: (p.name || 'Player') + (p.position ? ' — ' + p.position : '') + ' | Rayners Lane FC',
    description: (p.name || 'Player') + (p.position ? ', ' + p.position : '') + ' for Rayners Lane FC — non-league football in Harrow, Combined Counties Premier Division North.',
    canonical: _pCanon, image: _pImg, ogType: 'profile',
    jsonld: {
      '@context': 'https://schema.org', '@type': ['Person', 'Athlete'],
      name: p.name, jobTitle: p.position || 'Footballer', image: _pImg, url: _pCanon,
      memberOf: { '@type': 'SportsTeam', name: 'Rayners Lane FC', '@id': 'https://raynerslanefc.co.uk/#team' }
    }
  });
  var posColour = {Goalkeeper:'#1A5C32',Defender:'#1A3A6E',Midfielder:'#6B3A1F',Forward:'#EF4444'}[p.position] || '#FFD100';

  var html = '<div class="player-hero">' +
    '<div class="player-hero-img">' +
      '<div class="player-number" aria-hidden="true">' + (p.number||'') + '</div>' +
      (p.photo
        ? '<img src="' + p.photo + '" alt="' + p.name + '">'
        : '<img src="img/players/player-' + getIllustration(p.position) + '.svg" alt="' + (p.name||'') + '">') +
    '</div>' +
    '<div class="player-hero-info">' +
      '<div style="display:flex;align-items:center;gap:12px;margin-bottom:16px">' +
        '<div style="background:' + posColour + ';font-family:var(--font-c);font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:white;padding:4px 12px">' + (p.position||'') + '</div>' +
        (p.nationality ? '<div style="font-family:var(--font-c);font-size:12px;color:var(--grey);letter-spacing:.08em">' + p.nationality + '</div>' : '') +
      '</div>' +
      '<h1 style="font-family:var(--font-d);font-size:clamp(48px,7vw,90px);letter-spacing:.03em;color:var(--white);line-height:.9;margin:0 0 8px">' + (p.name||'') + '</h1>' +
      (p.nickname ? '<div style="font-family:var(--font-c);font-size:16px;color:var(--yellow);letter-spacing:.08em;margin-bottom:16px">"' + p.nickname + '"</div>' : '') +
      (p.bio ? '<div style="font-family:var(--font-b);font-size:15px;color:var(--grey);line-height:1.75;max-width:540px">' + p.bio + '</div>' : '') +
      // Statistics the club has not recorded are shown as "–", never as 0.
      // A zero is a claim — "he has played no games" — and right now the club
      // simply hasn't counted. The squad modal (js/squad.js pmStat) has always
      // done this; the full profile was the one place still printing noughts.
      // The whole block hides when there is nothing real to show at all, rather
      // than presenting a row of dashes as though it were a record.
      statBlock(p, record) +
    '</div>' +
  '</div>' +
  '<div style="background:var(--dark);padding:16px 0;border-bottom:1px solid var(--border)">' +
    '<div class="container"><a href="squad.html" style="font-family:var(--font-c);font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--grey)">&larr; Back to Squad</a></div>' +
  '</div>' +
  matchBlock(record);

  document.getElementById('player-content').innerHTML = html;
}

function statCard(val, label) {
  return '<div class="stat-card"><div class="stat-num">' + val + '</div><div class="stat-lbl">' + label + '</div></div>';
}
// A number the club has actually recorded, or an em-dash. Never a fabricated 0.
function statVal(v) { return (v == null || Number(v) === 0) ? '&ndash;' : v; }
function statBlock(p, record) {
  // The computed record outranks the hand-maintained figures. It is derived
  // from the matches themselves, so it follows every correction; the numbers in
  // players.json do not, and cannot.
  var s = record && record.currentSeason && (record.currentSeason.all || record.currentSeason);
  if (window.LaneRecord && window.LaneRecord.hasRecord(s)) {
    var mins = window.LaneRecord.minutes(s);
    return '<div class="stat-grid">' +
      statCard(s.appearances, 'Appearances') +
      statCard(s.goals, 'Goals') +
      statCard(s.starts, 'Starts') +
      // Minutes appear only where the match record supports a figure. A season
      // containing one match whose substitutions were never recorded has no
      // defensible total, so it is not given one.
      (mins != null ? statCard(mins, 'Minutes') : '') +
      (s.yellowCards ? statCard(s.yellowCards, 'Bookings') : '') +
      (s.redCards ? statCard(s.redCards, 'Red Cards') : '') +
      statCard(statVal(p.number), 'Squad No.') +
    '</div>';
  }
  var has = [p.apps, p.goals, p.assists, p.number].some(function (v) { return Number(v) > 0; });
  if (!has) {
    // Nothing recorded yet. Say that, in the club's voice, rather than printing
    // four noughts that read as "this player has done nothing".
    return '<div class="stat-empty">Appearances and goals start counting from the first game of the season.</div>';
  }
  return '<div class="stat-grid">' +
    statCard(statVal(p.apps), 'Appearances') +
    statCard(statVal(p.goals), 'Goals') +
    statCard(statVal(p.assists), 'Assists') +
    statCard(statVal(p.number), 'Squad No.') +
  '</div>';
}

/* Every match he has been named in, most recent first. Unused substitute
   appearances are shown as exactly that — being named is not an appearance,
   but it is part of his season and hiding it would be its own distortion. */
function matchBlock(record) {
  var games = (record && record.matches) || [];
  if (!games.length) return '';
  var rows = games.map(function (m) {
    var when = m.date ? new Date(m.date).toLocaleDateString('en-GB',
      { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'Europe/London' }) : '';
    var line = window.LaneRecord.describe(m);
    var label = (m.home ? 'v ' : 'away at ') + (m.opponent || 'Opponent');
    var inner = '<span class="mr-date">' + when + '</span>' +
      '<span class="mr-opp">' + label + '</span>' +
      '<span class="mr-what">' + line + '</span>';
    return m.matchCentre
      ? '<a class="match-row" href="' + m.matchCentre + '">' + inner + '</a>'
      : '<div class="match-row">' + inner + '</div>';
  }).join('');
  return '<div style="background:var(--dark);padding:40px 0;border-bottom:1px solid var(--border)">' +
    '<div class="container">' +
      '<h2 style="font-family:var(--font-d);font-size:32px;letter-spacing:.04em;color:var(--white);margin:0 0 18px">Every Match</h2>' +
      '<div class="match-list">' + rows + '</div>' +
    '</div></div>';
}

function getIllustration(pos) {
  var m = {Goalkeeper:'gk-1',Defender:'def-1',Midfielder:'mid-1',Forward:'forward-1'};
  return m[pos] || 'forward-1';
}
</script>
</body>
</html>
