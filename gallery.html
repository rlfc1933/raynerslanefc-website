<body>
<div id="nav-placeholder"></div>

<main id="main">
<!-- TITLE CARD over Tithe Farm from above. -->
<section class="kl-ph ga-ph" aria-labelledby="ph-title">
  <div class="kl-ph__media" aria-hidden="true">
    <img src="img/ground/tithe-farm-aerial-wide-1600.webp" alt="" width="1600" height="898" fetchpriority="high">
  </div>
  <div class="kl-wrap kl-ph__inner">
    <p class="kl-ph__meta">The Lane</p>
    <h1 class="kl-ph__title" id="ph-title"><span class="kl-line"><span>Gallery</span></span></h1>
    <p class="kl-ph__line">Matchday. Ground. Squad. All things The Lane.</p>
  </div>
</section>

<!-- Filter — words on a hairline, the chosen one underlined. -->
<nav class="ga-tabs" aria-label="Filter photographs">
  <div class="kl-wrap ga-tabs__row" id="gallery-filters">
    <button class="filter-btn active" type="button" aria-pressed="true" onclick="filterGallery('all',this)">All</button>
    <button class="filter-btn" type="button" aria-pressed="false" onclick="filterGallery('matchday',this)">Match Day</button>
    <button class="filter-btn" type="button" aria-pressed="false" onclick="filterGallery('ground',this)">Ground</button>
    <button class="filter-btn" type="button" aria-pressed="false" onclick="filterGallery('squad',this)">Squad</button>
  </div>
</nav>

<!-- The wall: edge to edge, hairline gutters, no frames. -->
<section class="ga-wall" aria-label="Photographs">
  <div class="gallery-grid" id="gallery-grid">
    <!-- Items rendered by JS from data/gallery.json -->
  </div>
</section>

<!-- Upload prompt — the yellow field. -->
<section class="kl-sec kl-sec--yellow ga-send" aria-labelledby="ga-send-h">
  <div class="kl-wrap ga-send__grid">
    <h2 class="kl-h2" id="ga-send-h">Got photos from match day?</h2>
    <div>
      <p class="kl-p ga-send__p">Send them to us and we'll add them to the gallery.</p>
      <a class="kl-btn kl-btn--ink" href="mailto:info@raynerslanefc.co.uk?subject=Gallery%20Photos">Send photos</a>
    </div>
  </div>
</section>
</main>

<!-- Lightbox -->
<div id="lightbox" role="dialog" aria-modal="true" aria-label="Photograph">
  <button id="lb-close" type="button" onclick="closeLightbox()">Close</button>
  <figure class="lb-fig">
    <img id="lb-img" alt="">
    <figcaption id="lb-cap"></figcaption>
  </figure>
</div>

<div id="twitter-placeholder"></div>
<div id="footer-placeholder"></div>
<script src="js/consent.js?v=1"></script>
<script src="js/components.js"></script>
<script>
document.addEventListener("DOMContentLoaded", function() {
  initComponents("gallery.html");
  loadGallery();
});

var galleryItems = [];
var activeFilter = "all";

// Placeholder items using our editorial images until real photos are uploaded
var DEFAULT_ITEMS = [
  { id:1, src:"img/news/news-matchday.svg",   label:"Match Day at Tithe Farm",  cat:"matchday" },
  { id:2, src:"img/players/player-forward-1.svg", label:"The Lane Attack",     cat:"squad"    },
  { id:3, src:"img/news/news-trials.svg",    label:"Summer Trials 2026",        cat:"squad"    },
  { id:4, src:"img/players/player-gk-1.svg",label:"Shot Stopping",             cat:"squad"    },
  { id:5, src:"img/news/news-signing.svg",   label:"New Signing",               cat:"squad"    },
  { id:6, src:"img/players/player-def-1.svg",label:"Defensive Unit",           cat:"squad"    },
  { id:7, src:"img/news/news-league.svg",    label:"League Football",           cat:"matchday" },
  { id:8, src:"img/players/player-mid-1.svg",label:"Midfield Magic",           cat:"squad"    },
  { id:9, src:"img/news/news-commercial.svg",label:"2026-27 Campaign",         cat:"ground"   },
];

async function loadGallery() {
  try {
    var r = await fetch("data/gallery.json?t=" + Date.now());
    if (r.ok) {
      var d = await r.json();
      if (d.items && d.items.length) { galleryItems = d.items; renderGallery(); return; }
    }
  } catch(e) {}
  galleryItems = DEFAULT_ITEMS;
  renderGallery();
}

function filterGallery(cat, btn) {
  activeFilter = cat;
  document.querySelectorAll(".filter-btn").forEach(b => {
    b.classList.remove("active"); b.setAttribute("aria-pressed", "false");
  });
  btn.classList.add("active"); btn.setAttribute("aria-pressed", "true");
  renderGallery();
}

function renderGallery() {
  var filtered = activeFilter === "all" ? galleryItems : galleryItems.filter(i => i.cat === activeFilter);
  var grid = document.getElementById("gallery-grid");
  if (!filtered.length) {
    grid.innerHTML = '<div class="gallery-empty"><p class="gallery-empty__h">No photos yet</p><p class="kl-p">Send us your match day photos.</p></div>';
    return;
  }
  // Pipeline 4: the photographer's name is part of the record, not metadata.
  // Both writers (the portal and tools-archive-match.js) have required a credit
  // since 4a19edb — and nothing has ever displayed it. A volunteer who gives up
  // a Saturday to photograph a game should see their name under the photograph.
  // Thumbnails are used where the archive generated them: a 480px file in a grid
  // cell instead of a 1600px one.
  var esc = function (s) { return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); };
  grid.innerHTML = filtered.map(function (item) {
    var full  = item.src;
    var thumb = item.thumb || item.src;
    var label = item.label || "";
    var credit = item.credit ? '<span class="gallery-item-credit">Photo: ' + esc(item.credit) + '</span>' : "";
    // A button, so the wall works from the keyboard as well as the mouse.
    return '<button type="button" class="gallery-item" onclick="openLightbox(' + JSON.stringify(full).replace(/"/g,"&quot;") + ',' + JSON.stringify(label).replace(/"/g,"&quot;") + ',this)">' +
      '<img src="' + esc(thumb) + '" alt="' + esc(label || "Rayners Lane FC match day photo") + '" loading="lazy" width="800" height="600">' +
      '<span class="gallery-item-overlay">' +
        '<span class="gallery-item-label">' + esc(label) + '</span>' + credit +
      '</span></button>';
  }).join("");
}

var lbReturn = null;
function openLightbox(src, label, from) {
  var img = document.getElementById("lb-img");
  img.src = src; img.alt = label || "Rayners Lane FC photograph";
  var cap = document.getElementById("lb-cap");
  if (cap) cap.textContent = label || "";
  lbReturn = from || null;
  document.getElementById("lightbox").classList.add("open");
  document.body.style.overflow = "hidden";
  document.getElementById("lb-close").focus();
}
function closeLightbox() {
  document.getElementById("lightbox").classList.remove("open");
  document.body.style.overflow = "";
  if (lbReturn && lbReturn.focus) lbReturn.focus();
  lbReturn = null;
}
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && document.getElementById("lightbox").classList.contains("open")) closeLightbox();
});
document.getElementById("lightbox").addEventListener("click", function(e) {
  if (e.target === this) closeLightbox();
});
</script>
</body>
</html>
