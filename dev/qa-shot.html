<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>QA capture harness — Rayners Lane FC (dev only)</title>
<!--
  ════════════════════════════════════════════════════════════════════════
  DEV-ONLY SCREENSHOT HARNESS. NOT LINKED. NOT INDEXED. NOT DEPLOYED CODE.

  WHY THIS EXISTS. Headless Chrome can screenshot a URL but cannot click
  anything, so it cannot photograph a fixture card's EXPANDED state, and it
  cannot crop to a single card. Rather than add QA hooks to fixtures.html —
  which would put test affordances in the file that serves supporters — this
  page loads the real page in a same-origin iframe, lifts the real rendered
  node out of it along with the real stylesheets, and presents it alone.

  WHAT IT IS NOT. It does not re-implement a card, mock data, or restyle
  anything. Every pixel it shows was rendered by fixtures.html from
  data/fixtures.json. If the real page is broken, this shows it broken.

  Usage: qa-shot.html?sel=.fxc--home&n=0&open=1&w=1000&label=Home%20league
  ════════════════════════════════════════════════════════════════════════
-->
<style>
  html,body{margin:0;padding:0;background:#050505}
  #stage{padding:26px;box-sizing:border-box}
  #lbl{
    font:700 11px/1.4 ui-monospace,Menlo,monospace; letter-spacing:.14em;
    text-transform:uppercase; color:#7a7a7a; margin:0 0 12px; padding:0 2px;
  }
  #err{font:600 14px/1.5 system-ui;color:#ff8080;padding:20px}
  iframe#src{position:absolute;left:-10000px;top:0;height:3000px;border:0}
</style>
</head>
<body>
<div id="stage"><p id="lbl">loading…</p></div>
<iframe id="src" title="source page"></iframe>
<script>
(function () {
  'use strict';
  var q = new URLSearchParams(location.search);
  var sel   = q.get('sel')   || '.fxc';
  var n     = parseInt(q.get('n') || '0', 10);
  var open  = q.get('open') === '1';
  var width = parseInt(q.get('w') || '1000', 10);
  var label = q.get('label') || '';
  var note  = q.get('note') || '';

  var stage = document.getElementById('stage');
  var frame = document.getElementById('src');
  // Any same-origin page on the site, not just the fixtures list.
  var src = q.get('src') || '/fixtures.html';
  if (!/^\//.test(src)) src = '/' + src;
  frame.style.width = width + 'px';
  frame.src = src;

  function fail(msg) {
    stage.innerHTML = '<p id="err">QA HARNESS: ' + msg + '</p>';
    document.title = 'QA FAIL';
  }

  /**
   * Named bootstraps, for pages whose content only renders after a module runs.
   *
   * AN ALLOWLIST, NOT AN EVAL. This takes a key, never code from the URL, so a
   * dev-only page cannot be turned into a way to execute arbitrary script
   * against the site's own origin.
   *
   * It does NOT log anyone in. The portal's PIN gate stays exactly where it is;
   * these modules read only public JSON (data/fixtures.json, the brand and
   * competition registries), which is why they can be exercised without a
   * session. Anything that needs real staff data is not capturable this way,
   * and should not be.
   */
  /**
   * DEV-ONLY LIVE SIMULATION.
   *
   * There is no live match on a Tuesday, and the Live Content Desk correctly
   * shows nothing without one — so the finished product cannot be photographed
   * from real data on demand.
   *
   * This stubs the READ side only: RLFCLive.eventsFor(), the single function
   * the desk uses to fetch events. The rows below are shaped exactly like
   * public.match_events, including dedupe_key, so the desk's real merge,
   * ordering and dedupe logic run unmodified against them.
   *
   * IT WRITES NOTHING. It cannot reach the database, cannot alter a score, and
   * exists only inside this dev page's iframe. Production football truth is
   * untouched, which is why simulating here is safe and simulating anywhere
   * else would not be.
   */
  var SIM_EVENTS = [
    { id: 'sim-1', event_type: 'kickoff',      minute: 0,  side: 'home', dedupe_key: 'ko',
      occurred_at: '2026-08-15T14:00:00Z' },
    { id: 'sim-2', event_type: 'goal',         minute: 23, side: 'home', player: 'Jenyo Balogun',
      score_home_after: 1, score_away_after: 0, dedupe_key: 'g23', occurred_at: '2026-08-15T14:23:00Z' },
    { id: 'sim-3', event_type: 'goal',         minute: 41, side: 'away', player: 'C. Mullins',
      score_home_after: 1, score_away_after: 1, dedupe_key: 'g41', occurred_at: '2026-08-15T14:41:00Z' },
    { id: 'sim-4', event_type: 'half_time',    minute: 45, side: 'home',
      score_home_after: 1, score_away_after: 1, dedupe_key: 'ht', occurred_at: '2026-08-15T14:45:00Z' },
    { id: 'sim-5', event_type: 'yellow_card',  minute: 58, side: 'away', player: 'R. Deane',
      card_colour: 'yellow', dedupe_key: 'y58', occurred_at: '2026-08-15T15:03:00Z' },
    { id: 'sim-6', event_type: 'substitution', minute: 62, side: 'home', player: 'Beau Pryce',
      assistant: 'Harry Bonner', dedupe_key: 's62', occurred_at: '2026-08-15T15:07:00Z' },
    { id: 'sim-7', event_type: 'goal',         minute: 67, side: 'home', player: 'Keiran Barnard-White',
      score_home_after: 2, score_away_after: 1, dedupe_key: 'g67', occurred_at: '2026-08-15T15:12:00Z' }
  ];

  var BOOTS = {
    'live-desk': function (w) {
      w.RLFCLive = w.RLFCLive || {};
      w.RLFCLive.eventsFor = function () { return Promise.resolve(SIM_EVENTS.slice()); };
      return Promise.all([
        w.fetch('data/club-brands.json').then(function (r) { return r.json(); })
          .then(function (d) { if (w.BrandPalette) w.BrandPalette.setRegistry(d); }).catch(function () {}),
        w.fetch('data/competitions.json').then(function (r) { return r.json(); })
          .then(function (d) { if (d && d.competitions && w.CompetitionBrand) w.CompetitionBrand.setRegistry(d.competitions); }).catch(function () {})
      ]).then(function () {
        return w.PrepareMatch && w.PrepareMatch.load();
      }).then(function () {
        var f = w.PrepareMatch && w.PrepareMatch._state.fixture;
        if (!f || !w.LiveContentDesk) return;
        w.LiveContentDesk.start(f.id, {
          id: 'fx-' + f.id, fixtureId: f.id, isHome: f.isHome !== false,
          home: { name: f.isHome !== false ? 'Rayners Lane' : f.opponent },
          away: { name: f.isHome !== false ? f.opponent : 'Rayners Lane' }
        });
      });
    },
    'brand-library': function (w) { return w.BrandLibrary && w.BrandLibrary.init(); },
    'studio-shell': function (w) {
      return new Promise(function (res) {
        var t = 0;
        (function go() {
          if (w.loadPostStudio && w.StudioShell) {
            w.loadPostStudio();
            setTimeout(function () {
              w.StudioShell.init();
              if (q.get('cat')) w.StudioShell.pick(q.get('cat'));
              res(true);
            }, 1500);
            return;
          }
          if (++t > 120) return res(false);
          setTimeout(go, 100);
        })();
      });
    },
    /* The REAL Post Studio, rendering a real fixture through the cinematic
       engine. ?ps=<type>&fmt=<size> chooses the template and format. This
       exercises admin.html's own psRender(), not a parallel preview. */
    'studio': function (w) {
      var type = q.get('ps') || 'matchday', fmt = q.get('fmt') || 'ig';
      return new Promise(function (res) {
        var t = 0;
        (function go() {
          if (w.loadPostStudio && w.StudioCinematic) {
            w.loadPostStudio();
            w.StudioCinematic.prepare().then(function () {
              var wait = 0;
              (function seed() {
                if ((w.psFixtures || []).length) {
                  w.psSetType(type);
                  w.PS.size = fmt;
                  w.psRender();
                  return res(true);
                }
                if (++wait > 120) return res(false);
                setTimeout(seed, 100);
              })();
            });
            return;
          }
          if (++t > 120) return res(false);
          setTimeout(go, 100);
        })();
      });
    },
    'prepare-match': function (w) {
      return Promise.all([
        w.fetch('data/club-brands.json').then(function (r) { return r.json(); })
          .then(function (d) { if (w.BrandPalette) w.BrandPalette.setRegistry(d); }).catch(function () {}),
        w.fetch('data/competitions.json').then(function (r) { return r.json(); })
          .then(function (d) { if (d && d.competitions && w.CompetitionBrand) w.CompetitionBrand.setRegistry(d.competitions); }).catch(function () {})
      ]).then(function () { return w.PrepareMatch && w.PrepareMatch.init(); });
    }
  };

  frame.addEventListener('load', function () {
    var boot = BOOTS[q.get('boot') || ''];
    if (boot) { try { boot(frame.contentWindow); } catch (e) {} }

    // The page fetches its own data, so the node will not exist on load.
    //
    // WAIT FOR THE COUNT TO SETTLE, NOT MERELY TO BE NON-ZERO. The programme
    // builds its pages progressively; grabbing at the first match caught it
    // with one page rendered and asked for index 2. Require the match count to
    // hold steady before taking anything.
    var tries = 0, lastCount = -1, stable = 0;
    (function wait() {
      var doc;
      try { doc = frame.contentDocument; } catch (e) { return fail('cross-origin'); }
      var nodes = doc ? doc.querySelectorAll(sel) : [];
      // COUNT ALONE IS NOT ENOUGH WHEN A MODULE FILLS AN EXISTING NODE.
      // #ps-shell is in the markup from the start, so the count settled
      // instantly and the harness photographed an empty div before the shell
      // had rendered into it. Track the node's own content as well.
      var target = nodes[n];
      var fingerprint = nodes.length + ':' + ((target && target.innerHTML.length) || 0);
      if (nodes.length && fingerprint === lastCount) stable++; else stable = 0;
      lastCount = fingerprint;
      if (!nodes.length || !(target && target.innerHTML.length) || stable < 8) {
        if (++tries > 250) {
          return fail(nodes.length
            ? 'content never settled for ' + sel + ' (last ' + lastCount + ')'
            : 'no node matched ' + sel + ' after 25s');
        }
        return setTimeout(wait, 100);
      }
      var node = nodes[n];
      if (!node) return fail('selector ' + sel + ' matched ' + nodes.length + ', index ' + n + ' out of range');

      // Lift the real stylesheets so the clone is styled exactly as rendered.
      // A cloned <link href="css/fonts.css"> would resolve against /dev/ and
      // 404, which silently drops every design token and renders the card as
      // black serif text on black. Copy the browser's resolved URL instead.
      var pending = 0, done = false;
      doc.querySelectorAll('style,link[rel="stylesheet"]').forEach(function (s) {
        if (s.tagName === 'LINK') {
          var l = document.createElement('link');
          l.rel = 'stylesheet';
          l.href = s.href;                       // already absolute
          pending++;
          l.addEventListener('load', settle);
          l.addEventListener('error', settle);
          document.head.appendChild(l);
        } else {
          document.head.appendChild(s.cloneNode(true));
        }
      });
      function settle() { if (--pending <= 0 && !done) { done = true; ready(); } }
      if (!pending) { done = true; setTimeout(ready, 0); }

      function ready() {
      var clone = node.cloneNode(true);
      // Relative asset paths would resolve against /dev/ once moved. Copy the
      // browser's already-resolved absolute URL across instead.
      var srcImgs = node.querySelectorAll('img'), dstImgs = clone.querySelectorAll('img');
      for (var i = 0; i < srcImgs.length; i++) { dstImgs[i].src = srcImgs[i].src; }
      if (open) {
        clone.querySelectorAll('details').forEach(function (d) { d.open = true; });
        if (clone.tagName === 'DETAILS') clone.open = true;
      }

      var head = document.createElement('p');
      head.id = 'lbl';
      head.textContent = (label || sel) + (note ? '  —  ' + note : '');
      stage.innerHTML = '';
      stage.style.width = (width + 52) + 'px';
      stage.appendChild(head);
      // A Studio card is authored at 1080px+ and must be scaled to be seen
      // whole. Scaling the clone, not the source, so the real card keeps the
      // exact pixel size the export path depends on.
      var scale = parseFloat(q.get('scale') || '0');
      if (scale > 0) {
        // Measure from the SOURCE node, which is laid out. A detached clone
        // reports offsetWidth 0, which collapsed the wrapper to nothing and
        // photographed an empty box.
        var r = node.getBoundingClientRect();
        var w = Math.round(r.width || parseFloat(clone.style.width) || width);
        var h = Math.round(r.height || parseFloat(clone.style.height) || width);
        var box = document.createElement('div');
        box.style.cssText = 'transform:scale(' + scale + ');transform-origin:top left;' +
          'width:' + w + 'px;height:' + h + 'px';
        box.appendChild(clone);
        var shell = document.createElement('div');
        shell.style.cssText = 'overflow:hidden;width:' + Math.ceil(w * scale) +
          'px;height:' + Math.ceil(h * scale) + 'px';
        shell.appendChild(box);
        stage.appendChild(shell);
      } else {
        stage.appendChild(clone);
      }

      // Tell the screenshotter the content is settled and how tall it is.
      requestAnimationFrame(function () {
        document.title = 'QA READY ' + Math.ceil(document.body.scrollHeight);
      });
      }
    })();
  });
})();
</script>
</body>
</html>
