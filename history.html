<div id="nav-placeholder"></div>

<div style="background:var(--black);padding:80px 0 48px;border-bottom:3px solid var(--yellow)">

    <h1 style="font-family:var(--font-d);font-size:clamp(56px,9vw,110px);letter-spacing:.02em;line-height:.9;color:var(--white);margin-bottom:16px">
      THE LANE<br><span style="color:var(--yellow)">HISTORY</span>

      Over 90 years of football in the heart of Harrow. This is the story of Rayners Lane FC.
    </p>
  </div>
</div>

<section class="section">
  <div class="container">
    <div class="timeline">

      <!-- Timeline renders from data/honours.json — the single source for the
           club's history. It used to be ten hand-written blocks here, a second
           copy in llms.txt and a third as a constant in tools-bake-schema.js.
           A wrong honour used to need three edits; now it needs one. -->
      <div id="tl-list"></div>
</section>

<div id="twitter-placeholder"></div>
<div id="footer-placeholder"></div>
<script src="js/consent.js?v=1"></script>
<script src="js/components.js"></script>
<script>document.addEventListener("DOMContentLoaded",()=>initComponents("history.html"));</script>

<script>
// ── Pipeline 6: the club's history has ONE source ────────────────────────────
// data/honours.json → this timeline, the JSON-LD `award` on every page (baked by
// tools-bake-schema.js) and llms.txt. Previously three hand-synced copies with
// 23 consumers and no owner: a wrong honour needed three edits and usually got
// one. Renders nothing rather than a placeholder if the file can't be read —
// an empty timeline is honest, an invented one is not.
(function () {
  var el = document.getElementById('tl-list'); if (!el) return;
  function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  fetch('data/honours.json?t=' + Date.now())
    .then(function (r) { return r.ok ? r.json() : null; })
    .then(function (d) {
      var list = (d && d.timeline) || [];
      if (!list.length) return;
      el.innerHTML = list.map(function (e) {
        return '<div class="tl-item">' +
          '<div class="tl-left"><div class="tl-year">' + esc(e.year) + '</div></div>' +
          '<div class="tl-center"><div class="tl-dot"></div></div>' +
          '<div class="tl-right">' +
            (e.tag ? '<div class="tl-badge">' + esc(e.tag) + '</div>' : '') +
            '<h2 class="tl-title">' + esc(e.title) + '</h2>' +
            '<div class="tl-body">' + esc(e.body) + '</div>' +
          '</div></div>';
      }).join('');
    })
    .catch(function () {});
})();
</script>
</body>
