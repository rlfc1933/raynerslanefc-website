<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Programme — Print Edition | Rayners Lane FC</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Self-hosted type: Bebas Neue (display) + Manrope (everything else). No Google Fonts request. -->
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link rel="stylesheet" href="brand/tokens.css">
<style>
  /* Brand values derive from the single source of truth (brand/tokens.css) */
  :root{ --y:var(--yellow); --g:var(--green); --gd:#0e3d20; --ink:var(--print-ink); --soft:var(--print-soft); --line:var(--print-line); --fd:var(--font-d); --fc:var(--font-c); --fb:var(--font-b); --fm:'Roboto Mono',monospace; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#8a8a8a; font-family:var(--fb); color:var(--ink); }

  .bar{ position:sticky; top:0; z-index:10; background:#0d0d0d; color:#fff; padding:14px 20px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-family:var(--fc); }
  .bar h1{ font-family:var(--fd); font-size:22px; letter-spacing:1px; font-weight:400; }
  .bar .sp{ flex:1; }
  .bar button{ background:var(--y); color:#0d0d0d; border:none; border-radius:8px; font-family:var(--fc); font-weight:700; font-size:15px; letter-spacing:.04em; padding:11px 20px; cursor:pointer; }
  .bar .hint{ font-size:13px; color:#aaa; max-width:520px; line-height:1.4; }

  .pages{ padding:24px 0; }
  .page{ width:210mm; min-height:297mm; background:#fff; margin:0 auto 18px; padding:15mm 14mm 18mm; position:relative; overflow:hidden; box-shadow:0 6px 30px rgba(0,0,0,.3); }

  /* ===== SECTION BANNER (every inside page leads with one) ===== */
  .banner{ position:relative; overflow:hidden; background:linear-gradient(105deg,#0b1d11,#15532e 92%); border-radius:12px; padding:17px 22px; margin-bottom:18px; }
  .banner::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--y); }
  .banner::after{ content:''; position:absolute; right:-24px; top:-34px; width:150px; height:150px; background:url(img/badge.png) center/contain no-repeat; opacity:.10; }
  .banner .kick{ font-family:var(--fc); font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--y); position:relative; }
  .banner h2{ font-family:var(--fd); font-size:36px; line-height:.92; letter-spacing:1px; color:#fff; font-weight:400; margin-top:1px; position:relative; }

  .eyebrow{ font-family:var(--fc); font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--g); }
  .body{ font-family:var(--fb); font-size:12.5px; line-height:1.72; color:#222; }
  .body p{ margin-bottom:9px; }
  .lead{ font-family:var(--fb); font-size:14.5px; line-height:1.6; color:#1a1a1a; font-weight:500; margin-bottom:12px; }
  .muted{ color:var(--soft); }
  h2.sec{ font-family:var(--fd); font-size:28px; letter-spacing:1px; font-weight:400; color:var(--ink); border-bottom:3px solid var(--y); padding-bottom:6px; margin-bottom:14px; }

  .divider{ display:flex; align-items:center; gap:10px; margin:20px 0 12px; }
  .divider .lbl{ font-family:var(--fc); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--g); white-space:nowrap; }
  .divider::before{ content:''; height:3px; width:20px; background:var(--y); border-radius:2px; }
  .divider::after{ content:''; height:1px; background:var(--line); flex:1; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  .card{ border:1px solid var(--line); border-radius:10px; padding:13px 15px; background:#fff; margin-bottom:10px; }
  .card.g{ border-left:4px solid var(--g); background:#f3f8f4; }
  .card.y{ border-left:4px solid var(--y); background:#fffdf0; }
  .card .k{ font-family:var(--fc); font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--g); }
  .card .t{ font-family:var(--fb); font-size:12.5px; color:#222; margin-top:2px; line-height:1.5; }

  /* stat tiles */
  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .tile{ background:#0d0d0d; color:#fff; border-radius:10px; padding:14px 6px 11px; text-align:center; position:relative; overflow:hidden; }
  .tile::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--y); }
  .tile .n{ font-family:var(--fd); font-size:40px; line-height:.85; color:var(--y); }
  .tile .l{ font-family:var(--fc); font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:rgba(255,255,255,.66); margin-top:5px; }
  .form-strip{ display:flex; gap:6px; }
  .fchip{ width:30px; height:30px; border-radius:6px; display:flex; align-items:center; justify-content:center; font-family:var(--fc); font-weight:700; color:#fff; font-size:14px; }

  /* team sheets */
  .ts-team{ font-family:var(--fd); font-size:23px; letter-spacing:.5px; color:#fff; background:var(--g); padding:6px 13px; border-radius:8px 8px 0 0; }
  .ts-team.away{ background:#0d0d0d; }
  .ts-list{ border:1px solid var(--line); border-top:none; border-radius:0 0 8px 8px; overflow:hidden; }
  .ts-row{ display:flex; gap:10px; align-items:center; font-family:var(--fb); font-size:13px; padding:6px 13px; }
  .ts-row:nth-child(even){ background:#fafafa; }
  .ts-row .n{ font-family:var(--fd); font-size:17px; color:var(--g); min-width:24px; text-align:center; }

  /* tables */
  table.lt{ width:100%; border-collapse:collapse; font-family:var(--fb); font-size:12px; }
  table.lt th{ font-family:var(--fc); font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; text-align:center; color:#fff; background:var(--g); padding:8px 4px; }
  table.lt th.l, table.lt td.l{ text-align:left; }
  table.lt td{ padding:6px 5px; text-align:center; border-bottom:1px solid var(--line); }
  table.lt td.num{ font-family:var(--fm); }
  table.lt tbody tr:nth-child(even) td{ background:#fafafa; }
  table.lt tr.me td{ background:var(--y); font-weight:700; color:#0d0d0d; }

  /* premium sponsor showcase */
  .spon-feat-row{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:14px; }
  .spon-feat{ border:1px solid var(--line); border-top:5px solid var(--y); border-radius:10px; padding:18px 16px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:7px; background:#fff; min-height:150px; justify-content:center; }
  .spon-feat img{ max-width:78%; max-height:74px; object-fit:contain; }
  /* The Cherry Red artwork is white on transparent, so it only reads on a dark
     panel. Sized by max-height with width:auto so it can never be stretched. */
  .league-mark{ margin-top:12px; background:#0d0d0d; border-radius:10px; padding:14px 16px;
                display:flex; align-items:center; gap:14px; justify-content:center; }
  .league-mark img{ height:34px; width:auto; max-width:190px; object-fit:contain; }
  .league-mark span{ font-family:var(--fc); font-size:10px; font-weight:700; letter-spacing:.1em;
                     text-transform:uppercase; color:rgba(255,255,255,.75); }
  .spon-feat .tier{ font-family:var(--fc); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--g); }
  .spon-feat .nm{ font-family:var(--fd); font-size:24px; letter-spacing:.5px; color:var(--ink); line-height:1; }
  .spon-feat .role{ font-family:var(--fb); font-size:11.5px; color:var(--soft); }
  .spon-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .spon{ border:1px solid var(--line); border-radius:8px; height:76px; display:flex; align-items:center; justify-content:center; background:#fff; padding:8px; }
  .spon img{ max-width:88%; max-height:58px; object-fit:contain; }
  .spon .nm2{ font-family:var(--fc); font-weight:700; color:#444; text-align:center; font-size:12px; }

  /* today's match sponsors */
  .todays{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .today{ border-radius:9px; padding:12px; text-align:center; background:#0d0d0d; color:#fff; position:relative; overflow:hidden; }
  .today::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--y); }
  .today .k{ font-family:var(--fc); font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--y); }
  .today .v{ font-family:var(--fd); font-size:22px; letter-spacing:.5px; line-height:1.05; margin-top:4px; }

  /* statements + CTA */
  .stmt{ border-left:3px solid var(--y); padding-left:12px; margin-bottom:11px; font-size:12px; line-height:1.55; color:#333; }
  .stmt b{ display:block; font-family:var(--fc); letter-spacing:.08em; text-transform:uppercase; color:var(--g); font-size:11.5px; margin-bottom:2px; }
  .cta-card{ display:flex; gap:18px; align-items:center; border:1px solid var(--line); border-left:5px solid var(--y); border-radius:10px; padding:16px 18px; background:#fffdf3; }
  .cta-qr img, .cta-qr canvas, .cta-qr table{ width:118px; height:118px; }
  .cta-h{ font-family:var(--fd); font-size:25px; letter-spacing:.5px; color:var(--ink); margin-bottom:5px; }
  .backqr{ display:flex; gap:18px; align-items:center; border-top:2px solid var(--y); padding-top:14px; margin-top:16px; }
  .backqr .qr img, .backqr .qr canvas, .backqr .qr table{ width:120px; height:120px; }

  /* COVER */
  .cover{ background:linear-gradient(160deg,#0d0d0d,#161208 70%); color:#fff; padding:0; display:flex; flex-direction:column; }
  .cover-sponsor{ background:var(--y); color:#0d0d0d; text-align:center; font-family:var(--fc); font-weight:700; font-size:14px; letter-spacing:.04em; padding:9px 12px; }
  .cover-sponsor b{ text-transform:uppercase; }
  .cover-top{ flex:1; padding:16mm 15mm 0; text-align:center; display:flex; flex-direction:column; }
  .cover-badge{ width:118px; height:118px; object-fit:contain; margin:0 auto 12px; }
  .cover-kicker{ font-family:var(--fc); font-size:15px; font-weight:700; letter-spacing:.32em; text-transform:uppercase; color:var(--y); }
  .cover-title{ font-family:var(--fd); font-size:62px; line-height:.92; letter-spacing:2px; margin:6px 0 2px; }
  .cover-comp{ font-family:var(--fc); font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.7); }
  .vs{ display:flex; align-items:center; justify-content:center; gap:26px; margin:auto 0; }
  .vs .crest{ width:150px; height:150px; object-fit:contain; }
  .vs .vstxt{ font-family:var(--fd); font-size:70px; color:var(--y); letter-spacing:2px; }
  .vs .tn{ font-family:var(--fd); font-size:26px; letter-spacing:1px; margin-top:8px; }
  .vs .side{ width:230px; text-align:center; }
  .cover-meta{ display:flex; justify-content:center; gap:30px; margin:auto 0 16mm; }
  .cover-meta .m .l{ font-family:var(--fc); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--y); }
  .cover-meta .m .v{ font-family:var(--fd); font-size:27px; letter-spacing:1px; }
  .cover-bottom{ background:var(--y); color:#0d0d0d; padding:11px 15mm; display:flex; justify-content:space-between; align-items:center; font-family:var(--fc); font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:13px; }

  /* per-page footer */
  .pcta{ position:absolute; left:14mm; right:14mm; bottom:8mm; display:flex; align-items:center; gap:12px; border-top:2px solid var(--y); padding-top:7px; font-family:var(--fc); font-size:10.5px; letter-spacing:.05em; color:var(--soft); }
  .pcta span:first-child{ font-weight:700; color:var(--g); }
  .pcta span:nth-child(2){ flex:1; text-align:center; }
  .pcta .pg{ color:#999; }

  /* player cards */
  .pcards{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  /* A card must never be sliced by a page boundary — half a face at the foot
     of one sheet and the stats at the top of the next is the sort of thing the
     committee then tries to fix by hand. */
  .pcard{ border:1px solid var(--line); border-radius:10px; overflow:hidden; background:#fff;
          break-inside:avoid; page-break-inside:avoid; }
  /* THE HEADSHOT BOX WAS THE CROP BUG. At 96px tall in a ~225px-wide column it
     was a letterbox, and object-fit:cover on a portrait photo threw away most
     of the head. object-position:top saved the forehead and cut the chin.
     A portrait box keeps the whole face, and 50% 28% sits the eyeline slightly
     above centre, which is where it falls in almost every squad photo. */
  .pcard .ph{ aspect-ratio:4/5; height:auto; background:linear-gradient(160deg,#14532d,#0b2a1a);
              display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .pcard .ph img{ width:100%; height:100%; object-fit:cover; object-position:50% 28%; }
  .pcard .no{ position:absolute; top:6px; left:8px; font-family:var(--fd); font-size:28px; color:var(--y); line-height:1; }
  .pcard .nm{ font-family:var(--fd); font-size:17px; letter-spacing:.4px; color:var(--ink); padding:7px 9px 0; line-height:1; }
  .pcard .po{ font-family:var(--fc); font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--g); padding:1px 9px 6px; }
  .pcard .st{ display:flex; border-top:1px solid var(--line); }
  .pcard .st div{ flex:1; text-align:center; padding:5px 2px; border-right:1px solid var(--line); }
  .pcard .st div:last-child{ border-right:none; }
  .pcard .st .v{ font-family:var(--fm); font-size:14px; font-weight:700; color:var(--ink); }
  .pcard .st .v.unk{ color:var(--soft); font-weight:400; }
  .pcard .st .k{ font-family:var(--fc); font-size:8px; letter-spacing:.06em; text-transform:uppercase; color:var(--soft); }

  /* directory */
  .dir{ display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; }
  .dir-row{ display:flex; justify-content:space-between; gap:10px; border-bottom:1px dotted var(--line); padding:6px 0; }
  .dir-row .r{ font-family:var(--fc); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--g); }
  .dir-row .n{ font-family:var(--fb); font-size:13px; color:var(--ink); font-weight:600; }

  /* tiered sponsor directory */
  .tier-block{ margin-bottom:12px; }
  .tier-head{ font-family:var(--fc); font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#fff; background:var(--g); padding:4px 12px; border-radius:6px; display:inline-block; }
  .tier-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .tier-chip{ border:1px solid var(--line); border-left:3px solid var(--y); border-radius:6px; padding:7px 12px; font-family:var(--fb); font-size:12.5px; }
  .tier-chip b{ font-family:var(--fc); font-weight:700; }

  /* match preview / opposition cards */
  .pv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pv-vs{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; border:1px solid var(--line); border-radius:10px; padding:14px; margin-bottom:14px; }
  .pv-vs .t{ text-align:center; }
  .pv-vs img{ width:64px; height:64px; object-fit:contain; }
  .pv-vs .nm{ font-family:var(--fd); font-size:18px; letter-spacing:.3px; }
  .pv-vs .vs{ font-family:var(--fd); font-size:30px; color:var(--g); }

  /* next-match advert / back cover */
  .advert{ background:linear-gradient(160deg,#0b1d11,#15532e); color:#fff; border-radius:14px; padding:26px 22px; text-align:center; position:relative; overflow:hidden; }
  .advert::after{ content:''; position:absolute; right:-40px; bottom:-50px; width:240px; height:240px; background:url(img/badge.png) center/contain no-repeat; opacity:.08; }
  .advert .k{ font-family:var(--fc); font-size:13px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--y); }
  .advert .big{ font-family:var(--fd); font-size:46px; line-height:.95; letter-spacing:1px; margin:6px 0; }
  .advert .meta{ font-family:var(--fc); font-size:15px; letter-spacing:.06em; }

  @media print{
    @page{ size:A4 portrait; margin:0; }
    body{ background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .bar{ display:none; }
    .pages{ padding:0; }
    .page{ margin:0; box-shadow:none; page-break-after:always; }
    .page:last-child{ page-break-after:auto; }
    /* Nothing that reads as one unit may be split across sheets. */
    .pcard, .card, .spon, .spon-feat, .ts-row, .cta-card, .partners{ break-inside:avoid; page-break-inside:avoid; }
    .pcards{ break-inside:auto; }
    h1,h2,h3,.k{ break-after:avoid; page-break-after:avoid; }
    /* Backgrounds and logos must survive the print pipeline; without this
       Chrome drops every panel colour and the crest strip prints blank. */
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    img{ max-width:100%; }
  }
</style>
</head>
<body>

<div class="bar">
  <h1>Programme — Print Edition</h1>
  <button onclick="window.print()"><i class="ico ico-printer"></i> Print / Save as PDF</button>
  <span class="hint">Click the button → choose <b>Save as PDF</b> (or your printer) → paper <b>A4</b>, “Background graphics” ON. Then send the PDF to your printer.</span>
  <span class="sp"></span>
  <a href="programme.html" style="color:#aaa;font-family:var(--fc);font-size:13px">← Digital version</a>
</div>

<div class="pages" id="pages">
  <div class="page" style="display:flex;align-items:center;justify-content:center;color:#888;font-family:var(--fc)">Building your programme…</div>
</div>

<script>
(function () {
  var SITE = 'https://raynerslanefc.co.uk';
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function lines(t){ return String(t||'').split('\n').map(function(l){return l.trim();}).filter(Boolean); }
  function notes(t){ return lines(t).map(function(l){ return '<p>'+esc(l)+'</p>'; }).join(''); }
  function to12(t){ if(!t||!/^\d{1,2}:\d{2}/.test(t))return t||'3:00 PM'; var p=t.split(':'),h=parseInt(p[0],10),m=p[1].slice(0,2),ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12; return h+':'+m+' '+ap; }
  function niceDate(d){ if(!d)return ''; var dt=new Date(d.length===10?d+'T12:00:00':d); return isNaN(dt.getTime())?d:dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
  function shortDate(d){ if(!d)return ''; var dt=new Date(d.length===10?d+'T12:00:00':d); return isNaN(dt.getTime())?d:dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }
  function initialsBadge(name){
    var w=String(name||'').replace(/F\.?C\.?/gi,'').trim().split(/\s+/);
    var ini=w.slice(0,3).map(function(x){return (x[0]||'').toUpperCase();}).join('');
    return 'data:image/svg+xml,'+encodeURIComponent('<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="58" fill="%230d0d0d" stroke="%23FFD100" stroke-width="3"/><text x="60" y="72" text-anchor="middle" font-family="Arial Black" font-size="'+(ini.length>2?'30':'38')+'" font-weight="900" fill="white">'+ini+'</text></svg>');
  }
  function getJSON(name){ return fetch('data/'+name+'.json?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}); }
  function qr(text){ try{ var q=qrcode(0,'M'); q.addData(text); q.make(); return q.createImgTag(4,0); }catch(e){ return ''; } }
  function paramId(){ var m=location.search.match(/[?&]id=([^&]+)/); return m?decodeURIComponent(m[1]):''; }
  function banner(kick,title){ return '<div class="banner"><div class="kick">'+esc(kick)+'</div><h2>'+esc(title)+'</h2></div>'; }

  /* ── THE SEASON AS IT STOOD BEFORE THIS MATCH ─────────────────────────────
     A programme is handed to supporters BEFORE kick-off. Every number in it is
     therefore a pre-match number: "Played 12" means twelve before today, and
     Recent Form must not carry a result for the game they are about to watch.

     A score-present filter alone is not enough. Live scores are entered while
     the match is in progress, and the same fixtures file feeds this page — so
     a programme printed at half time, or a PDF regenerated on the night, would
     quietly include the match's own scoreline in its own preview. The only
     safe rule is the date: nothing on or after this edition's match day counts.

     Cutting by DATE rather than by score also means a published edition stays
     correct forever. Its date is frozen in the document, so re-opening last
     August's programme still shows the season exactly as it stood that
     afternoon, however many matches have been played since.

     No date on the edition (an undated draft) falls back to the old behaviour:
     anything with a score. */
  function seasonStats(fixtures, editionDate){
    var cut = String(editionDate||'').slice(0,10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(cut)) cut = '';
    var played = (fixtures||[]).filter(function(f){
      if (f.us==null || f.them==null) return false;
      // Strictly before: a fixture on the same day is today's, or one of
      // today's if the club plays twice.
      return !cut || String(f.date||'').slice(0,10) < cut;
    }).sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    var w=0,dd=0,l=0,gf=0,ga=0,form=[],scorers={};
    played.forEach(function(f){
      gf+=Number(f.us); ga+=Number(f.them);
      if(f.us>f.them) w++; else if(f.us===f.them) dd++; else l++;
      form.push(f.us>f.them?'W':(f.us===f.them?'D':'L'));
      String(f.scorers||'').split(',').forEach(function(s){
        var name=s.replace(/\([^)]*\)/g,'').replace(/\d.*$/,'').replace(/\b(pen|og|p)\b/gi,'').trim();
        if(name && name.length>1){ scorers[name]=(scorers[name]||0)+1; }
      });
    });
    var top=Object.keys(scorers).map(function(n){return {name:n,goals:scorers[n]};}).sort(function(a,b){return b.goals-a.goals;}).slice(0,12);
    return { played:played.length, w:w, d:dd, l:l, gf:gf, ga:ga, pts:(w*3+dd), form:form.slice(-6), scorers:top, results:played.slice().reverse() };
  }
  /* ── WHICH PROGRAMME IS THIS? ────────────────────────────────────────────
     THE BUG THIS FIXES. The admin cover preview rendered from the FORM the
     operator was typing into. This page rendered from the SAVED FILE. Nothing
     reconciled the two, so the preview showed Hilltop while the print edition
     showed "TBC / 2026-27 / 3:00 PM" — the fallbacks that fire when
     data/programme.json still has opponent:'' and no date.

     The operator had no way to know. The panel even told them to press Publish
     first, which "worked" only because publishing happened to write the file.
     Printing and publishing are different things and must not be entangled.

     Order of preference now:
       1. ?draft=1  → the snapshot the admin just saved, handed over directly.
                      Instant, works while unpublished, and is byte-identical
                      to what the operator is looking at.
       2. ?id=…     → a specific archived edition (history must never change).
       3. otherwise → the current saved programme, as before.                */
  function draftSnapshot(){
    try {
      if (!/[?&]draft=1/.test(location.search)) return null;
      var raw = localStorage.getItem('rlfc_programme_draft');
      if (!raw) return null;
      var o = JSON.parse(raw);
      // Stale hand-offs are worse than none: a snapshot from an hour ago would
      // silently print the wrong match.
      if (!o || !o.savedAt || (Date.now() - Date.parse(o.savedAt)) > 30 * 60 * 1000) return null;
      return o.doc || null;
    } catch (e) { return null; }
  }
  function loadProgrammeDoc(){
    var draft = draftSnapshot();
    if (draft) return Promise.resolve(draft);
    var id = paramId();
    if (!id) return getJSON('programme');
    return getJSON('programmes').then(function(a){ var items=(a&&a.items)||[]; return items.filter(function(it){return it.id===id;})[0] || getJSON('programme'); });
  }

  /* ── THE ARCHIVE RULE ─────────────────────────────────────────────────
     A programme is a record of the club on one afternoon, not a live
     document. A DRAFT may read today's figures so Russell builds it with
     current information. A PUBLISHED edition renders from the snapshot frozen
     at publication and never asks the season service again.

     Without this, opening last August's Hilltop programme in March would show
     a player on 25 appearances because that is what he has NOW — rewriting a
     document supporters already hold.

     WHAT DECIDES IS `published`, NOT "is there a snapshot".
     The test used to be `if (doc.playerStats)`, and an empty object is truthy.
     A draft that had ever been handed a `{}` — or a snapshot taken while the
     squad was still unmatched — was therefore treated as settled history and
     printed dashes for ever, with no way to refresh short of publishing. A
     draft is not history. It refreshes. Only a published edition is frozen,
     and it stays frozen even if what it froze was empty, because that is
     honestly what the club knew that afternoon. */
  function loadSeasonStats(doc){
    var published = !!(doc && doc.published);
    if (published) return Promise.resolve((doc && doc.playerStats) || null);
    return fetch('/.netlify/functions/programme-stats')
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });
  }

  Promise.all([ loadProgrammeDoc(), getJSON('crests'), getJSON('sponsors'), getJSON('fixtures'),
    fetch('/.netlify/functions/fetch-table').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    getJSON('committee'), getJSON('officials'), getJSON('emails'), getJSON('players'), getJSON('squad')
  ]).then(function (res) {
    var d = res[0]||{}, crests=(res[1]&&res[1].crests)||[], sponsors=(res[2]&&res[2].sponsors)||[], fixtures=(res[3]&&res[3].fixtures)||[];

    /* THE ARCHIVE RULE, APPLIED TO THE TABLE.
       publishProgramme() freezes the standings into the document at the moment
       of publication, but this page was still calling fetch-table on every
       render — so opening a published edition months later redrew it with
       TODAY's table, showing a club in eighth on a page that went to print
       while they were in second.

       Same rule as the player figures, for the same reason: PUBLISHED decides,
       not "is there a snapshot". A draft shows the standings as they are now,
       so the edition being built is built on current information. Only a
       published edition is pinned to what it froze. */
    var frozenTable = d.leagueTable && (d.leagueTable.table || d.leagueTable);   // rows, or an older envelope
    var liveTable = (res[4] && res[4].table) || [];
    var table = d.published
      ? ((frozenTable && frozenTable.length) ? frozenTable : liveTable)
      : (liveTable.length ? liveTable : (frozenTable || []));
    var club = {
      committee:(res[5]&&res[5].members)||[], officials:res[6]||{}, emails:(res[7]&&res[7].accounts)||[],
      players:((res[8]&&res[8].players)||(res[9]&&res[9].players)||[])
    };
    return loadSeasonStats(d).then(function(ps){
      // Overwrite on a draft. `!d.playerStats` was the same truthiness trap:
      // a draft carrying a stale empty snapshot would discard the figures we
      // had just gone and fetched.
      if (ps && !d.published) d.playerStats = ps;
      else if (ps && !d.playerStats) d.playerStats = ps;
      render(d, crests, sponsors, fixtures, table, club);
      afterRender();
    });
  }).catch(function(err){
    /* WHY THIS EXISTS.
       render() threw and this chain had no catch, so the page sat on
       "Building…" indefinitely. It looked like a slow network. It was a
       TypeError, and it had been swallowing the Season So Far page of every
       printed programme.

       A blank page that says nothing is the worst outcome here, because
       somebody prints it. Say plainly that it failed, and name the fault so
       it can be reported rather than guessed at. */
    var host = document.getElementById('pages') || document.body;
    host.innerHTML = '<div class="page" style="padding:24mm 18mm">' +
      '<h2 style="font-family:var(--fc);letter-spacing:.06em">This programme could not be built</h2>' +
      '<p style="margin-top:10px;line-height:1.6">Nothing has been printed. Please tell whoever looks ' +
      'after the website, and pass on the line below.</p>' +
      '<pre style="margin-top:14px;padding:12px;background:#f4f4f4;border-radius:6px;white-space:pre-wrap;' +
      'font-size:12px">' + esc(String((err && err.message) || err)) + '</pre></div>';
    console.error('[programme-print]', err);
  });

  function afterRender(){
    if (/[?&](print|auto)=1/.test(location.search)) {
      window.addEventListener('load', function(){ setTimeout(function(){ window.print(); }, 900); });
      setTimeout(function(){ window.print(); }, 1400);
    }
  }

  function render(d, crests, sponsors, fixtures, table, club) {

    var playerSeason = (d.playerStats && d.playerStats.players) || {};

         the card must not blur them. */
      function statCell(v, label){

        '<div style="margin-top:14px;display:inline-block;background:var(--y);color:#0d0d0d;font-family:var(--fc);font-weight:700;letter-spacing:.06em;padding:9px 18px;border-radius:8px">PAY ON THE GATE · BAR OPEN · ALL WELCOME</div></div>'+
        '<div class="cta-card" style="margin-top:16px"><div class="cta-qr">'+qr(SITE+'/fixtures.html')+'</div><div><div class="cta-h">Never miss a game</div><div class="body">Scan to add the whole season to your phone calendar. #UpTheLane</div></div></div>'+
        foot()+'</div>');
    }

    /* BACK COVER */
    P.push('<div class="page cover" style="background:linear-gradient(160deg,#14532d,#0b2a1a)">'+
      '<div class="cover-top" style="justify-content:center;align-items:center">'+
        '<img class="cover-badge" src="img/badge.png">'+
        '<div class="cover-kicker">Join the Yellow Army</div>'+
        '<div class="cover-title" style="font-size:52px">BE PART OF<br>THE LANE</div>'+
        '<div class="body" style="color:rgba(255,255,255,.85);max-width:380px;margin:14px auto 0;text-align:center">Free Lane membership, yellow hearts every game and rewards all season. Scan to join in a minute.</div>'+
        '<div style="margin:18px auto 0;background:#fff;padding:11px;border-radius:12px;width:150px;height:150px">'+qr(SITE+'/fan-zone.html')+'</div>'+
      '</div>'+
      '<div class="cover-bottom"><span>raynerslanefc.co.uk</span><span>@RaynersLaneFC · #UpTheLane</span></div>'+
    '</div>');

    document.getElementById('pages').innerHTML = P.join('');
    // Auto-fit safety net: a page is a fixed A4 sheet (297mm). If a long
    // manager's note / welcome / scouting write-up makes a page taller than one
    // sheet, its free-text (.body/.lead) is shrunk a touch until the page fits —
    // so nothing gets silently cut at the print boundary. Data pages (tables,
    // squad, tiles) are left alone; only free-text bodies flex. Runs once fonts
    // are ready so the measurement matches the printed output.
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(fitPages);
  }
  function fitPages() {
    var MAXH = 297 / 25.4 * 96 + 2; // one A4 sheet in px @96dpi (+2 tolerance)
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) {
      var pg = pages[i];
      var flex = pg.querySelectorAll('.body, .lead');
      if (!flex.length) continue;              // nothing free-text to shrink
      var pct = 100, guard = 0;
      while (pg.offsetHeight > MAXH && pct > 68 && guard < 60) {
        pct -= 2; guard++;
        for (var j = 0; j < flex.length; j++) flex[j].style.fontSize = pct + '%';
      }
    }
  }
})();
</script>
