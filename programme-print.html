<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Programme — Print Edition | Rayners Lane FC</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link rel="stylesheet" href="brand/tokens.css">
<style>
  /* All brand values derive from the single source of truth (brand/tokens.css) */
  :root{ --y:var(--rl-yellow); --g:var(--rl-green); --ink:var(--rl-print-ink); --soft:var(--rl-print-soft); --line:var(--rl-print-line); --fd:var(--rl-font-head); --fc:var(--rl-font-cond); --fb:var(--rl-font-body); }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#888; font-family:var(--fb); color:var(--ink); }

  /* Screen toolbar (hidden when printing) */
  .bar{ position:sticky; top:0; z-index:10; background:#0d0d0d; color:#fff; padding:14px 20px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-family:var(--fc); }
  .bar h1{ font-family:var(--fd); font-size:22px; letter-spacing:1px; font-weight:400; }
  .bar .sp{ flex:1; }
  .bar button{ background:var(--y); color:#0d0d0d; border:none; border-radius:8px; font-family:var(--fc); font-weight:700; font-size:15px; letter-spacing:.04em; padding:11px 20px; cursor:pointer; }
  .bar .hint{ font-size:13px; color:#aaa; max-width:520px; line-height:1.4; }

  /* A4 pages */
  .pages{ padding:24px 0; }
  .page{ width:210mm; min-height:297mm; background:#fff; margin:0 auto 18px; padding:16mm 15mm; position:relative; overflow:hidden; box-shadow:0 6px 30px rgba(0,0,0,.3); }

  h2.sec{ font-family:var(--fd); font-size:30px; letter-spacing:1px; font-weight:400; color:var(--ink); border-bottom:3px solid var(--y); padding-bottom:6px; margin-bottom:14px; }
  .eyebrow{ font-family:var(--fc); font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; color:var(--g); }
  .body{ font-family:var(--fb); font-size:12.5px; line-height:1.65; color:#222; }
  .body p{ margin-bottom:9px; }
  .muted{ color:var(--soft); }

  /* COVER */
  .cover{ background:linear-gradient(160deg,#0d0d0d,#161208 70%); color:#fff; padding:0; display:flex; flex-direction:column; }
  .cover-top{ flex:1; padding:18mm 15mm 0; text-align:center; display:flex; flex-direction:column; }
  .cover-badge{ width:120px; height:120px; object-fit:contain; margin:0 auto 14px; }
  .cover-kicker{ font-family:var(--fc); font-size:15px; font-weight:700; letter-spacing:.32em; text-transform:uppercase; color:var(--y); }
  .cover-title{ font-family:var(--fd); font-size:64px; line-height:.92; letter-spacing:2px; margin:6px 0 2px; }
  .cover-comp{ font-family:var(--fc); font-size:15px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.7); }
  .vs{ display:flex; align-items:center; justify-content:center; gap:26px; margin:auto 0; }
  .vs .crest{ width:150px; height:150px; object-fit:contain; }
  .vs .vstxt{ font-family:var(--fd); font-size:70px; color:var(--y); letter-spacing:2px; }
  .vs .tn{ font-family:var(--fd); font-size:26px; letter-spacing:1px; margin-top:8px; }
  .vs .side{ width:230px; text-align:center; }
  .cover-meta{ display:flex; justify-content:center; gap:34px; margin:auto 0 18mm; }
  .cover-meta .m .l{ font-family:var(--fc); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--y); }
  .cover-meta .m .v{ font-family:var(--fd); font-size:28px; letter-spacing:1px; }
  .cover-bottom{ background:var(--y); color:#0d0d0d; padding:12px 15mm; display:flex; justify-content:space-between; align-items:center; font-family:var(--fc); font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:13px; }

  /* team sheets */
  .twocol{ display:grid; grid-template-columns:1fr 1fr; gap:22px; }
  .ts-team{ font-family:var(--fd); font-size:22px; letter-spacing:.5px; color:var(--g); margin-bottom:8px; }
  .ts-row{ display:flex; gap:10px; font-family:var(--fb); font-size:13px; padding:4px 0; border-bottom:1px solid var(--line); }
  .ts-row .n{ font-family:var(--fc); font-weight:700; color:var(--g); min-width:22px; }
  .panel{ border:1px solid var(--line); border-left:3px solid var(--y); border-radius:5px; padding:10px 12px; margin-bottom:10px; }
  .panel .k{ font-family:var(--fc); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--g); }
  .panel .t{ font-family:var(--fb); font-size:12.5px; color:#222; margin-top:2px; }

  /* table */
  table.lt{ width:100%; border-collapse:collapse; font-family:var(--fb); font-size:12px; }
  table.lt th{ font-family:var(--fc); font-size:11px; letter-spacing:.06em; text-transform:uppercase; text-align:center; color:#fff; background:var(--g); padding:7px 4px; }
  table.lt th.l, table.lt td.l{ text-align:left; }
  table.lt td{ padding:6px 4px; text-align:center; border-bottom:1px solid var(--line); }
  table.lt tr.me td{ background:rgba(255,209,0,.18); font-weight:700; }

  /* sponsors */
  .spon-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .spon{ border:1px solid var(--line); border-radius:6px; height:90px; display:flex; align-items:center; justify-content:center; background:#fff; padding:8px; }
  .spon img{ max-width:90%; max-height:70px; object-fit:contain; }
  .spon .nm{ font-family:var(--fc); font-weight:700; color:#333; text-align:center; font-size:13px; }

  /* statements */
  .stmt{ border-left:3px solid var(--y); padding-left:12px; margin-bottom:12px; font-size:12px; line-height:1.6; color:#333; }
  .stmt b{ display:block; font-family:var(--fc); letter-spacing:.08em; text-transform:uppercase; color:var(--g); font-size:11.5px; margin-bottom:2px; }

  .backqr{ display:flex; gap:18px; align-items:center; border-top:2px solid var(--y); padding-top:14px; margin-top:14px; }
  .backqr .qr img, .backqr .qr canvas, .backqr .qr table{ width:120px; height:120px; }
  .pgnum{ position:absolute; bottom:8mm; right:15mm; font-family:var(--fc); font-size:10px; letter-spacing:.1em; color:#aaa; }
  .foot{ position:absolute; bottom:8mm; left:15mm; font-family:var(--fc); font-size:10px; letter-spacing:.1em; color:#aaa; }

  /* cover: "this match sponsored by" band */
  .cover-sponsor{ background:var(--y); color:#0d0d0d; text-align:center; font-family:var(--fc); font-weight:700; font-size:14px; letter-spacing:.04em; padding:9px 12px; }
  .cover-sponsor b{ text-transform:uppercase; }

  /* per-page footer call-to-action band */
  .pcta{ position:absolute; left:15mm; right:15mm; bottom:7mm; display:flex; align-items:center; gap:12px; border-top:2px solid var(--y); padding-top:7px; font-family:var(--fc); font-size:10.5px; letter-spacing:.05em; color:var(--soft); }
  .pcta span:first-child{ font-weight:700; color:var(--g); }
  .pcta span:nth-child(2){ flex:1; text-align:center; }
  .pcta .pg{ color:#aaa; }

  /* today's match sponsors highlight */
  .todays{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .today{ border:2px solid var(--y); border-radius:8px; padding:10px 12px; text-align:center; background:rgba(255,209,0,.06); }
  .today .k{ font-family:var(--fc); font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--g); }
  .today .v{ font-family:var(--fd); font-size:22px; letter-spacing:.5px; color:var(--ink); line-height:1.05; margin-top:3px; }

  /* CTA cards (Become Part of The Lane) */
  .cta-card{ display:flex; gap:18px; align-items:center; border:1px solid var(--line); border-left:4px solid var(--y); border-radius:8px; padding:16px 18px; }
  .cta-qr img, .cta-qr canvas, .cta-qr table{ width:120px; height:120px; }
  .cta-h{ font-family:var(--fd); font-size:24px; letter-spacing:.5px; color:var(--ink); margin-bottom:6px; }

  @media print{
    @page{ size:A4 portrait; margin:0; }
    body{ background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .bar{ display:none; }
    .pages{ padding:0; }
    .page{ margin:0; box-shadow:none; page-break-after:always; }
    .page:last-child{ page-break-after:auto; }
  }
</style>
</head>
<body>

<div class="bar">
  <h1>Programme — Print Edition</h1>
  <button onclick="window.print()">🖨️ Print / Save as PDF</button>
  <span class="hint">Click the button → choose <b>Save as PDF</b> (or your printer) → make sure paper is <b>A4</b> and “Background graphics” is ON. Then send the PDF to your printer.</span>
  <span class="sp"></span>
  <a href="programme.html" style="color:#aaa;font-family:var(--fc);font-size:13px">← Digital version</a>
</div>

<div class="pages" id="pages">
  <div class="page" style="display:flex;align-items:center;justify-content:center;color:#888;font-family:var(--fc)">Building your programme…</div>
</div>

<script>
(function () {
  var SITE = 'https://raynerslanefc.co.uk';
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function lines(t){ return String(t||'').split('\n').map(function(l){return l.trim();}).filter(Boolean); }
  function notes(t){ return lines(t).map(function(l){ return '<p>'+esc(l)+'</p>'; }).join(''); }
  function to12(t){ if(!t||!/^\d{1,2}:\d{2}/.test(t))return t||'3:00 PM'; var p=t.split(':'),h=parseInt(p[0],10),m=p[1].slice(0,2),ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12; return h+':'+m+' '+ap; }
  function niceDate(d){ if(!d)return ''; var dt=new Date(d.length===10?d+'T12:00:00':d); return isNaN(dt.getTime())?d:dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
  function shortDate(d){ if(!d)return ''; var dt=new Date(d.length===10?d+'T12:00:00':d); return isNaN(dt.getTime())?d:dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }
  function initialsBadge(name){
    var w=String(name||'').replace(/F\.?C\.?/gi,'').trim().split(/\s+/);
    var ini=w.slice(0,3).map(function(x){return (x[0]||'').toUpperCase();}).join('');
    return 'data:image/svg+xml,'+encodeURIComponent('<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="58" fill="%230d0d0d" stroke="%23FFD100" stroke-width="3"/><text x="60" y="72" text-anchor="middle" font-family="Arial Black" font-size="'+(ini.length>2?'30':'38')+'" font-weight="900" fill="white">'+ini+'</text></svg>');
  }
  function getJSON(name){ return fetch('data/'+name+'.json?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}); }
  function qr(text){
    try{ var q=qrcode(0,'M'); q.addData(text); q.make(); return q.createImgTag(4,0); }catch(e){ return ''; }
  }
  function paramId(){ var m=location.search.match(/[?&]id=([^&]+)/); return m?decodeURIComponent(m[1]):''; }
  // Season so far — built live from the club fixtures (results, form, top scorers).
  function seasonStats(fixtures){
    var played = (fixtures||[]).filter(function(f){ return f.us!=null && f.them!=null; })
      .sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    var w=0,dd=0,l=0,gf=0,ga=0,form=[],scorers={};
    played.forEach(function(f){
      gf+=Number(f.us); ga+=Number(f.them);
      if(f.us>f.them) w++; else if(f.us===f.them) dd++; else l++;
      form.push(f.us>f.them?'W':(f.us===f.them?'D':'L'));
      String(f.scorers||'').split(',').forEach(function(s){
        var name=s.replace(/\([^)]*\)/g,'').replace(/\d.*$/,'').replace(/\b(pen|og|p)\b/gi,'').trim();
        if(name && name.length>1){ scorers[name]=(scorers[name]||0)+1; }
      });
    });
    var top=Object.keys(scorers).map(function(n){return {name:n,goals:scorers[n]};}).sort(function(a,b){return b.goals-a.goals;}).slice(0,12);
    return { played:played.length, w:w, d:dd, l:l, gf:gf, ga:ga, pts:(w*3+dd), form:form.slice(-6), scorers:top, results:played.slice().reverse() };
  }
  // Load a specific archived programme (?id=) or the latest (programme.json).
  function loadProgrammeDoc(){
    var id = paramId();
    if (!id) return getJSON('programme');
    return getJSON('programmes').then(function(a){ var items=(a&&a.items)||[]; return items.filter(function(it){return it.id===id;})[0] || getJSON('programme'); });
  }

  Promise.all([ loadProgrammeDoc(), getJSON('crests'), getJSON('sponsors'), getJSON('fixtures'),
    fetch('/.netlify/functions/fetch-table').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;})
  ]).then(function (res) {
    var d = res[0]||{}, crests=(res[1]&&res[1].crests)||[], sponsors=(res[2]&&res[2].sponsors)||[], fixtures=(res[3]&&res[3].fixtures)||[], table=(res[4]&&res[4].table)||[];
    render(d, crests, sponsors, fixtures, table);
    // Auto-open the print dialog when asked (e.g. opened from the admin button).
    if (/[?&](print|auto)=1/.test(location.search)) {
      window.addEventListener('load', function(){ setTimeout(function(){ window.print(); }, 900); });
      setTimeout(function(){ window.print(); }, 1400);
    }
  });

  function render(d, crests, sponsors, fixtures, table) {
    var opp = d.opponent || 'TBC';
    // Opponent crest: editor's chosen crest → name lookup → initials badge.
    var crestRow = crests.filter(function(c){ return c.name && opp && c.name.toLowerCase()===opp.toLowerCase(); })[0];
    var oppCrest = d.oppCrest || (crestRow && crestRow.file) || initialsBadge(opp);
    var comp = d.competition || 'Combined Counties Premier Division North';
    var venue = d.venue || 'Tithe Farm Sports & Social Club';
    // Cover colour scheme (front page only — inside pages stay uniform).
    var COVER_THEMES = {
      'black-yellow': { bg: '#0d0d0d', ink: '#ffffff', accent: '#FFD100', accentInk: '#0d0d0d', soft: 'rgba(255,255,255,.72)' },
      'yellow-black': { bg: '#FFD100', ink: '#0d0d0d', accent: '#0d0d0d', accentInk: '#FFD100', soft: 'rgba(0,0,0,.62)' },
      'black-green':  { bg: '#0d0d0d', ink: '#ffffff', accent: '#2E8B57', accentInk: '#ffffff', soft: 'rgba(255,255,255,.72)' },
      'green-black':  { bg: '#14532d', ink: '#ffffff', accent: '#0d0d0d', accentInk: '#FFD100', soft: 'rgba(255,255,255,.8)' },
      'yellow-green': { bg: '#FFD100', ink: '#14532d', accent: '#14532d', accentInk: '#FFD100', soft: 'rgba(20,83,45,.78)' },
      'green-yellow': { bg: '#14532d', ink: '#FFD100', accent: '#FFD100', accentInk: '#14532d', soft: 'rgba(255,209,0,.85)' },
      'festive':      { bg: '#0b2a1a', ink: '#ffffff', accent: '#FFD100', accentInk: '#0d0d0d', soft: 'rgba(255,255,255,.8)' },
      'remembrance':  { bg: '#0d0d0d', ink: '#ffffff', accent: '#C8102E', accentInk: '#ffffff', soft: 'rgba(255,255,255,.72)' }
    };
    var TH = COVER_THEMES[d.coverTheme] || COVER_THEMES['black-yellow'];
    var DEF = {
      admission:'Adults £5 · Concessions £3 · Under 16s free',
      rules:'No smoking or vaping in the stand · Respect all officials · Supporters welcome behind the barriers',
      firstaid:'First aid is available at the clubhouse — ask any committee member.',
      respect:"Rayners Lane FC proudly supports The FA's Respect programme. We ask every player, coach, supporter and official to back positive, respectful football — win, lose or draw.",
      safe:'The wellbeing of children and young people is paramount. Rayners Lane FC is committed to safeguarding; concerns can be raised in confidence with our Club Welfare Officer via info@raynerslanefc.co.uk.',
      equality:'Football is for everyone. Rayners Lane FC opposes discrimination of every kind and welcomes players, supporters and volunteers of all backgrounds, abilities, ages, faiths, genders, sexualities and ethnicities.',
      affil:'Rayners Lane FC is affiliated to Middlesex County FA and plays in the Combined Counties Football League, Premier Division North — Step 5 of the National League System. An FA Charter Standard Community Club, est. 1933.'
    };
    // Rotating call-to-action printed at the foot of every page.
    var CTAS = [
      'Join the Yellow Army — free Lane membership at raynerslanefc.co.uk/fan-zone.html',
      'Sponsor The Lane — info@raynerslanefc.co.uk',
      'Follow @RaynersLaneFC for live match updates',
      '#UpTheLane — raynerslanefc.co.uk'
    ];
    var pn = 0;
    function foot(){ pn++; return '<div class="pcta"><span>RAYNERSLANEFC.CO.UK</span><span>'+CTAS[(pn-1)%CTAS.length]+'</span><span class="pg">'+pn+'</span></div>'; }
    var P = [];

    // 1 — COVER  (themed; only the cover changes colour scheme)
    P.push('<div class="page cover" style="background:' + TH.bg + ';color:' + TH.ink + '">' +
      (d.matchSponsor ? '<div class="cover-sponsor" style="background:' + TH.accent + ';color:' + TH.accentInk + '">This match is proudly sponsored by <b>'+esc(d.matchSponsor)+'</b></div>' : '') +
      '<div class="cover-top" style="position:relative">' +
        '<div style="position:absolute;right:-120px;bottom:-110px;width:520px;height:520px;background:url(img/badge.png) center/contain no-repeat;opacity:.05;pointer-events:none"></div>' +
        '<img class="cover-badge" src="img/badge.png" alt="RLFC">' +
        '<div class="cover-kicker" style="color:' + TH.accent + '">Official Matchday Programme</div>' +
        '<div class="cover-title" style="color:' + TH.ink + '">RAYNERS LANE FC</div>' +
        '<div class="cover-comp" style="color:' + TH.soft + '">'+esc(comp)+'</div>' +
        '<div class="vs" style="position:relative;z-index:1">' +
          '<div class="side"><img class="crest" src="img/badge.png"><div class="tn" style="color:' + TH.ink + '">Rayners Lane</div></div>' +
          '<div class="vstxt" style="color:' + TH.accent + '">VS</div>' +
          '<div class="side"><img class="crest" src="'+esc(oppCrest)+'"><div class="tn" style="color:' + TH.ink + '">'+esc(opp)+'</div></div>' +
        '</div>' +
        '<div class="cover-meta" style="position:relative;z-index:1">' +
          '<div class="m"><div class="l" style="color:' + TH.accent + '">Date</div><div class="v" style="color:' + TH.ink + '">'+esc(shortDate(d.date)||'2026-27')+'</div></div>' +
          '<div class="m"><div class="l" style="color:' + TH.accent + '">Kick-off</div><div class="v" style="color:' + TH.ink + '">'+esc(to12(d.kickoff))+'</div></div>' +
          '<div class="m"><div class="l" style="color:' + TH.accent + '">Venue</div><div class="v" style="font-size:20px;color:' + TH.ink + '">'+esc(venue)+'</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="cover-bottom" style="background:' + TH.accent + ';color:' + TH.accentInk + '"><span>The Lane · Yellow Army · Est. 1933</span><span>raynerslanefc.co.uk</span></div>' +
    '</div>');

    // 2 — WELCOME & MANAGER'S NOTES  (only if the editor wrote something)
    if (lines(d.welcomeNotes).length || lines(d.managerNotes).length || lines(d.lookingForward).length) {
      P.push('<div class="page">' +
        (lines(d.welcomeNotes).length ? '<h2 class="sec">Welcome to The Lane</h2><div class="eyebrow">'+esc(niceDate(d.date))+' · '+esc(to12(d.kickoff))+' · '+esc(venue)+'</div><div class="body" style="margin-top:10px">'+notes(d.welcomeNotes)+'</div>' : '') +
        (lines(d.managerNotes).length ? '<h2 class="sec" style="margin-top:22px">From the Dugout</h2><div class="body">'+notes(d.managerNotes)+'</div>' : '') +
        (lines(d.lookingForward).length ? '<h2 class="sec" style="margin-top:22px">Looking Forward</h2><div class="body">'+notes(d.lookingForward)+'</div>' : '') +
        foot() + '</div>');
    }

    // 3 — TEAM SHEETS  (only if any team content)
    function tsList(text){ var L=lines(text); if(!L.length) return ''; return L.map(function(l){ var m=l.match(/^\s*(\d+)[\.\)]?\s+(.*)$/); return '<div class="ts-row">'+(m?'<span class="n">'+m[1]+'</span><span>'+esc(m[2])+'</span>':'<span>'+esc(l)+'</span>')+'</div>'; }).join(''); }
    if (lines(d.homeXI).length || lines(d.homeSubs).length || lines(d.awayLineup).length || (d.staff||'').trim()) {
      P.push('<div class="page">' +
        '<h2 class="sec">Team Sheets</h2>' +
        '<div class="twocol">' +
          '<div><div class="ts-team">Rayners Lane</div>'+(tsList(d.homeXI)||'<div class="muted body">Confirmed at kick-off.</div>')+
            (lines(d.homeSubs).length?'<div class="eyebrow" style="margin:10px 0 4px">Substitutes</div>'+tsList(d.homeSubs):'')+
            ((d.staff||'').trim()?'<div class="body" style="margin-top:10px"><b>'+esc(d.staff)+'</b></div>':'')+'</div>' +
          '<div><div class="ts-team" style="color:#333">'+esc(opp)+'</div>'+(tsList(d.awayLineup)||'<div class="muted body">Confirmed at kick-off.</div>')+'</div>' +
        '</div>' +
        foot() + '</div>');
    }

    // 4 — MATCH INFO  (compulsory uniform: officials if given, + matchday info)
    var offBits = [ d.referee?'Referee: '+esc(d.referee):'', (d.assistant1||d.assistant2)?'Assistants: '+esc([d.assistant1,d.assistant2].filter(Boolean).join(' & ')):'', d.fourthOfficial?'4th Official: '+esc(d.fourthOfficial):'' ].filter(Boolean);
    P.push('<div class="page">' +
      '<h2 class="sec">Matchday Information</h2>' +
      (offBits.length ? '<div class="panel"><div class="k">Match Officials</div><div class="t">'+offBits.join(' &nbsp;·&nbsp; ')+'</div></div>' : '') +
      '<div class="panel"><div class="k">Admission</div><div class="t">'+esc(d.admission||DEF.admission)+'</div></div>' +
      '<div class="panel"><div class="k">Ground rules</div><div class="t">'+esc(d.groundRules||DEF.rules)+'</div></div>' +
      '<div class="panel"><div class="k">First aid</div><div class="t">'+esc(d.firstAid||DEF.firstaid)+'</div></div>' +
      '<div class="panel"><div class="k">Find us</div><div class="t">'+esc(venue)+(d.address?' — '+esc(d.address):'')+'</div></div>' +
      foot() + '</div>');

    // 5 — OPPOSITION + LEAGUE TABLE
    var tableHTML = table.length
      ? '<table class="lt"><thead><tr><th>#</th><th class="l">Team</th><th>P</th><th>W</th><th>D</th><th>L</th><th>GD</th><th>Pts</th></tr></thead><tbody>'+
        table.map(function(r){ return '<tr class="'+(r.rlfc?'me':'')+'"><td>'+r.pos+'</td><td class="l">'+esc(r.team)+'</td><td>'+r.pld+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+r.gd+'</td><td><b>'+r.pts+'</b></td></tr>'; }).join('')+
        '</tbody></table>'
      : '<div class="muted body">The league table appears here once the season is under way.</div>';
    P.push('<div class="page">' +
      (lines(d.oppSummary).length||lines(d.headToHead).length ? '<h2 class="sec">Today’s Visitors — '+esc(opp)+'</h2>'+
        (lines(d.oppSummary).length?'<div class="body">'+notes(d.oppSummary)+'</div>':'')+
        (lines(d.headToHead).length?'<div class="eyebrow" style="margin-top:10px">Head to Head</div><div class="body">'+notes(d.headToHead)+'</div>':'') : '') +
      '<h2 class="sec" style="margin-top:18px">League Table</h2><div class="eyebrow" style="margin-bottom:8px">'+esc(comp)+'</div>'+tableHTML +
      foot() + '</div>');

    // 5b — SEASON SO FAR (auto: results, form, top scorers — updates every week)
    var S = seasonStats(fixtures);
    if (S.played) {
      var formHTML = S.form.map(function(v){ var c=v==='W'?'#22C55E':(v==='D'?'#C9A200':'#EF4444'); return '<span style="display:inline-flex;width:22px;height:22px;border-radius:5px;background:'+c+';color:#fff;font-family:var(--fc);font-weight:700;align-items:center;justify-content:center;font-size:12px;margin-right:4px">'+v+'</span>'; }).join('');
      var resHTML = S.results.slice(0,8).map(function(r){ var win=r.us>r.them,draw=r.us===r.them,c=win?'#1a7a3a':(draw?'#9a7d00':'#b3231a'); return '<div class="ts-row"><span style="flex:1">'+esc(shortDate(r.date))+' &middot; Rayners Lane '+(r.isHome===false?'@ ':'vs ')+esc(r.opponent||'')+'</span><b style="color:'+c+'">'+r.us+'–'+r.them+'</b></div>'; }).join('');
      var scoreHTML = S.scorers.length ? '<table class="lt"><thead><tr><th class="l">Top Scorer</th><th>Goals</th></tr></thead><tbody>'+S.scorers.map(function(s){return '<tr><td class="l">'+esc(s.name)+'</td><td><b>'+s.goals+'</b></td></tr>';}).join('')+'</tbody></table>' : '<div class="muted body">Goal scorers appear as results come in.</div>';
      P.push('<div class="page">' +
        '<h2 class="sec">Season So Far</h2>' +
        '<div class="todays" style="grid-template-columns:repeat(4,1fr)"><div class="today"><div class="k">Played</div><div class="v">'+S.played+'</div></div><div class="today"><div class="k">W-D-L</div><div class="v">'+S.w+'-'+S.d+'-'+S.l+'</div></div><div class="today"><div class="k">Goals</div><div class="v">'+S.gf+'-'+S.ga+'</div></div><div class="today"><div class="k">Points</div><div class="v">'+S.pts+'</div></div></div>' +
        '<div class="eyebrow" style="margin:16px 0 6px">Recent Form</div><div>'+formHTML+'</div>' +
        '<div class="twocol" style="margin-top:16px">' +
          '<div><div class="eyebrow" style="margin-bottom:6px">Recent Results</div>'+resHTML+'</div>' +
          '<div><div class="eyebrow" style="margin-bottom:6px">Top Scorers</div>'+scoreHTML+'</div>' +
        '</div>' +
        foot() + '</div>');
    }

    // 6 — SPONSORS (today's match sponsors highlighted + the club wall)
    var todays = [ d.matchSponsor?['Match Sponsor',d.matchSponsor]:null, d.ballSponsor?['Match Ball Sponsor',d.ballSponsor]:null, d.matchdaySponsor?['Matchday Sponsor',d.matchdaySponsor]:null ].filter(Boolean);
    var todayHTML = todays.length ? '<div class="todays">'+todays.map(function(t){ return '<div class="today"><div class="k">'+t[0]+'</div><div class="v">'+esc(t[1])+'</div></div>'; }).join('')+'</div>' : '';
    var sponCells = sponsors.length
      ? sponsors.map(function(s){ return '<div class="spon">'+(s.logo?'<img src="'+esc(s.logo)+'" alt="'+esc(s.name)+'">':'<span class="nm">'+esc(s.name)+'</span>')+'</div>'; }).join('')
      : '<div class="spon"><span class="nm">Your business here — sponsor The Lane</span></div>';
    P.push('<div class="page">' +
      '<h2 class="sec">Our Sponsors</h2>' +
      todayHTML +
      '<div class="eyebrow" style="margin:'+(todays.length?'18px':'2px')+' 0 10px">Our Partners</div>' +
      '<div class="spon-grid">'+sponCells+'</div>' +
      '<div class="body muted" style="margin-top:16px">Please support the businesses who support your club.</div>' +
      foot() + '</div>');

    // 7 — BECOME PART OF THE LANE  (compulsory CTA page)
    P.push('<div class="page">' +
      '<h2 class="sec">Become Part of The Lane</h2>' +
      '<div class="cta-card"><div class="cta-qr">'+qr(SITE+'/fan-zone.html')+'</div>' +
        '<div class="cta-text"><div class="cta-h">Join the Yellow Army — it’s free</div>' +
        '<div class="body">Become a free <b>Lane loyalty member</b>: get your own membership card, collect yellow hearts every time you come, and unlock rewards through the season. Scan the code or visit <b>raynerslanefc.co.uk/fan-zone.html</b> to register in a minute.</div></div></div>' +
      '<div class="cta-card" style="margin-top:16px;border-left-color:var(--g)"><div class="cta-text" style="width:100%">' +
        '<div class="cta-h" style="color:var(--g)">Sponsor The Lane</div>' +
        '<div class="body">Put your business in front of the Yellow Army every matchday — shirt &amp; kit, match &amp; matchball sponsorship, pitch-side boards and programme ads. It’s marketing that backs grassroots football. To get involved, email <b>info@raynerslanefc.co.uk</b>.</div></div></div>' +
      foot() + '</div>');

    // 7b — FA: REPORT IT / EQUALITY (compulsory)
    P.push('<div class="page">' +
      '<h2 class="sec">Report It. Kick It Out of Football.</h2>' +
      '<div class="body" style="font-size:13px"><p>Rayners Lane FC and The FA are committed to football for everyone. Discrimination of any kind — based on age, disability, gender reassignment, marriage &amp; civil partnership, pregnancy &amp; maternity, race, religion or belief, sex or sexual orientation — is against the law and has no place at The Lane.</p>' +
      '<p>If you see or experience discrimination at a match, please report it:</p></div>' +
      '<div class="panel"><div class="k">At the ground</div><div class="t">Speak to any committee member or match official straight away — we will act.</div></div>' +
      '<div class="panel"><div class="k">Kick It Out</div><div class="t">Report online at <b>kickitout.org</b>, email <b>report@kickitout.org</b>, or use the free Kick It Out app.</div></div>' +
      '<div class="panel"><div class="k">The FA</div><div class="t">Report discrimination at <b>thefa.com/football-rules-governance/equality</b>.</div></div>' +
      '<div class="panel"><div class="k">Club Welfare</div><div class="t">For any safeguarding or welfare concern, contact our Club Welfare Officer via <b>info@raynerslanefc.co.uk</b>.</div></div>' +
      '<div class="body muted" style="margin-top:10px">Rayners Lane FC is affiliated to Middlesex County FA — an FA Charter Standard Community Club. #UpTheLane, together.</div>' +
      foot() + '</div>');

    // 7c — THE EDITOR'S OWN PAGES (custom artwork on a branded RLFC page)
    (d.customPages || []).forEach(function (cp) {
      if (!cp.image && !cp.title && !cp.caption) return;
      P.push('<div class="page">' +
        (cp.title ? '<h2 class="sec">' + esc(cp.title) + '</h2>'
          : '<div style="display:flex;align-items:center;gap:10px;border-bottom:3px solid var(--y);padding-bottom:8px;margin-bottom:14px"><img src="img/badge.png" style="width:34px;height:34px;object-fit:contain"><span style="font-family:var(--fd);font-size:24px;letter-spacing:.5px;color:var(--ink)">Rayners Lane FC</span></div>') +
        (cp.image ? '<div style="text-align:center"><img src="' + esc(cp.image) + '" style="max-width:100%;max-height:225mm;object-fit:contain;border-radius:6px"></div>' : '') +
        (cp.caption ? '<div class="body muted" style="text-align:center;margin-top:12px">' + esc(cp.caption) + '</div>' : '') +
        foot() + '</div>');
    });

    // 8 — BACK PAGE: fixtures + statements + digital QR
    var now2 = 0;
    function dt(f){ return new Date(f.date+'T'+(f.kickoff||'15:00')+':00').getTime(); }
    var upcoming = fixtures.slice().filter(function(f){ return f.us==null||f.them==null; }).sort(function(a,b){return dt(a)-dt(b);}).slice(0,6);
    var fixHTML = upcoming.length
      ? upcoming.map(function(f){ return '<div class="ts-row"><span style="flex:1">'+esc(shortDate(f.date))+' &middot; Rayners Lane '+(f.isHome===false?'@ ':'vs ')+esc(f.opponent||'TBC')+'</span><span class="n">'+esc(f.kickoff||'15:00')+'</span></div>'; }).join('')
      : '<div class="muted body">Fixtures are released soon.</div>';
    P.push('<div class="page">' +
      '<h2 class="sec">Coming Up</h2>'+fixHTML +
      '<h2 class="sec" style="margin-top:20px">The Club Stands For</h2>' +
      '<div class="stmt"><b>Respect &amp; Fair Play</b>'+esc(d.respect||DEF.respect)+'</div>' +
      '<div class="stmt"><b>Safeguarding</b>'+esc(d.safeguarding||DEF.safe)+'</div>' +
      '<div class="stmt"><b>Equality &amp; Inclusion</b>'+esc(d.equality||DEF.equality)+'</div>' +
      '<div class="stmt"><b>Affiliation</b>'+esc(d.affiliation||DEF.affil)+'</div>' +
      '<div class="backqr"><div class="qr">'+qr(SITE+'/programme.html')+'</div>' +
        '<div class="body"><div class="eyebrow">Read it on your phone</div><p>Scan for the live digital programme — line-ups, table &amp; live score updates.</p>' +
        '<p><b>@RaynersLaneFC</b> on X &middot; <b>@raynerslanefc</b> on Instagram</p></div></div>' +
      foot() + '</div>');

    document.getElementById('pages').innerHTML = P.join('');
  }
})();
</script>
</body>
</html>
