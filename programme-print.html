<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Match Programme — Print Edition | Rayners Lane FC</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- Self-hosted type: Bebas Neue (display) + Manrope (everything else). No Google Fonts request. -->
  <link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/icons.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@500;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<link rel="stylesheet" href="brand/tokens.css">
<style>
  /* Brand values derive from the single source of truth (brand/tokens.css) */
  :root{ --y:var(--yellow); --g:var(--green); --gd:#0e3d20; --ink:var(--print-ink); --soft:var(--print-soft); --line:var(--print-line); --fd:var(--font-d); --fc:var(--font-c); --fb:var(--font-b); --fm:'Roboto Mono',monospace; }
  *{ box-sizing:border-box; margin:0; padding:0; }
  body{ background:#8a8a8a; font-family:var(--fb); color:var(--ink); }

  .bar{ position:sticky; top:0; z-index:10; background:#0d0d0d; color:#fff; padding:14px 20px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; font-family:var(--fc); }
  .bar h1{ font-family:var(--fd); font-size:22px; letter-spacing:1px; font-weight:400; }
  .bar .sp{ flex:1; }
  .bar button{ background:var(--y); color:#0d0d0d; border:none; border-radius:8px; font-family:var(--fc); font-weight:700; font-size:15px; letter-spacing:.04em; padding:11px 20px; cursor:pointer; }
  .bar .hint{ font-size:13px; color:#aaa; max-width:520px; line-height:1.4; }

  .pages{ padding:24px 0; }
  .page{ width:210mm; min-height:297mm; background:#fff; margin:0 auto 18px; padding:15mm 14mm 18mm; position:relative; overflow:hidden; box-shadow:0 6px 30px rgba(0,0,0,.3); }

  /* ═══════════════════════════════════════════════════════════════════════
     THE MASTHEAD — what replaced the banner.

     Nineteen of twenty-one pages used to open with the same green rounded
     bar: yellow eyebrow, white condensed title, crest watermarked behind it.
     Shrunk to thumbnails on a contact sheet the publication read as one
     component repeated twenty-one times, which is exactly what it was.

     A masthead instead: a hard rule, a section number, a label set vertically
     against it, and the title at a size the page can carry. No fill, no
     radius, no watermark. The RULE colour is what varies by archetype, so a
     data page and a commercial page announce themselves differently before a
     word is read.
     ═══════════════════════════════════════════════════════════════════════ */
  .mh{ display:grid; grid-template-columns:auto 1fr; gap:0 14px; align-items:end;
       border-bottom:3px solid var(--ink); padding-bottom:7px; margin-bottom:16px; }
  .mh .n{ font-family:var(--fd); font-size:44px; line-height:.78; color:var(--y);
          -webkit-text-stroke:1px var(--ink); letter-spacing:.01em; }
  .mh .tx{ min-width:0; }
  .mh .kick{ font-family:var(--fc); font-size:9.5px; font-weight:700; letter-spacing:.22em;
             text-transform:uppercase; color:var(--soft); display:block; }
  .mh h2{ font-family:var(--fd); font-size:34px; line-height:.9; letter-spacing:.6px;
          color:var(--ink); font-weight:400; margin-top:2px; }
  /* Archetype tints — the only thing that changes, and it changes the read. */
  .page--data    .mh{ border-bottom-color:var(--g); }
  .page--data    .mh .n{ color:var(--g); -webkit-text-stroke:0; }
  .page--comm    .mh{ border-bottom-color:var(--y); }
  .page--comm    .mh .n{ color:var(--ink); -webkit-text-stroke:0; }
  .page--edit    .mh{ border-bottom-width:1px; }
  .page--edit    .mh h2{ font-size:42px; }
  .page--edit    .mh .n{ display:none; }
  .page--roster  .mh{ border-bottom-color:var(--ink); }
  .page--info    .mh{ border-bottom-width:1px; border-bottom-color:var(--line); }
  .page--info    .mh h2{ font-size:24px; }
  .page--info    .mh .n{ font-size:26px; }

  /* Dark archetypes: full colour fields, type reversed out. */
  .page--dark{ background:var(--gd); color:#fff; }
  .page--dark .mh{ border-bottom-color:rgba(255,255,255,.35); }
  .page--dark .mh h2{ color:#fff; }
  .page--dark .mh .n{ color:var(--y); -webkit-text-stroke:0; }
  .page--dark .mh .kick{ color:rgba(255,255,255,.7); }
  .page--dark .body,.page--dark .body p{ color:rgba(255,255,255,.88); }
  .page--ink{ background:#0d0d0d; color:#fff; }
  .page--ink .mh{ border-bottom-color:rgba(255,255,255,.3); }
  .page--ink .mh h2{ color:#fff; }
  .page--ink .mh .n{ color:var(--y); -webkit-text-stroke:0; }
  .page--ink .mh .kick{ color:rgba(255,255,255,.65); }

  /* Retained only where a green field is genuinely the design. */
  .banner{ position:relative; overflow:hidden; background:linear-gradient(105deg,#0b1d11,#15532e 92%); padding:17px 22px; margin-bottom:18px; }
  .banner::before{ content:''; position:absolute; left:0; top:0; bottom:0; width:8px; background:var(--y); }
  .banner .kick{ font-family:var(--fc); font-size:11px; font-weight:700; letter-spacing:.2em; text-transform:uppercase; color:var(--y); position:relative; }
  .banner h2{ font-family:var(--fd); font-size:36px; line-height:.92; letter-spacing:1px; color:#fff; font-weight:400; margin-top:1px; position:relative; }

  .eyebrow{ font-family:var(--fc); font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase; color:var(--g); }
  .body{ font-family:var(--fb); font-size:12.5px; line-height:1.72; color:#222; }
  .body p{ margin-bottom:9px; }
  .lead{ font-family:var(--fb); font-size:14.5px; line-height:1.6; color:#1a1a1a; font-weight:500; margin-bottom:12px; }
  .muted{ color:var(--soft); }
  h2.sec{ font-family:var(--fd); font-size:28px; letter-spacing:1px; font-weight:400; color:var(--ink); border-bottom:3px solid var(--y); padding-bottom:6px; margin-bottom:14px; }

  .divider{ display:flex; align-items:center; gap:10px; margin:20px 0 12px; }
  .divider .lbl{ font-family:var(--fc); font-size:12px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--g); white-space:nowrap; }
  .divider::before{ content:''; height:3px; width:20px; background:var(--y); }
  .divider::after{ content:''; height:1px; background:var(--line); flex:1; }

  .grid2{ display:grid; grid-template-columns:1fr 1fr; gap:18px; align-items:start; }
  .card{ border:0; border-top:2px solid var(--ink); padding:9px 0 0; background:transparent; margin-bottom:13px; }
  .card.g{ border-top-color:var(--g); background:transparent; }
  .card.y{ border-top-color:var(--y); background:transparent; }
  .card .k{ font-family:var(--fc); font-size:10.5px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--g); }
  .card .t{ font-family:var(--fb); font-size:12.5px; color:#222; margin-top:2px; line-height:1.5; }

  /* stat tiles */
  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .tile{ background:#0d0d0d; color:#fff; padding:14px 6px 11px; text-align:center; position:relative; overflow:hidden; }
  .tile::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--y); }
  .tile .n{ font-family:var(--fd); font-size:40px; line-height:.85; color:var(--y); }
  .tile .l{ font-family:var(--fc); font-size:9.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:rgba(255,255,255,.66); margin-top:5px; }
  .form-strip{ display:flex; gap:6px; }
  .fchip{ width:30px; height:30px; display:flex; align-items:center; justify-content:center; font-family:var(--fc); font-weight:700; color:#fff; font-size:14px; }

  /* team sheets */
  .ts-team{ font-family:var(--fd); font-size:23px; letter-spacing:.5px; color:#fff; background:var(--g); padding:6px 13px; }
  .ts-team.away{ background:#0d0d0d; }
  .ts-list{ border:0; border-top:2px solid var(--ink); overflow:hidden; }
  .ts-row{ display:flex; gap:10px; align-items:center; font-family:var(--fb); font-size:13px; padding:6px 13px; }
  .ts-row:nth-child(even){ background:#fafafa; }
  .ts-row .n{ font-family:var(--fd); font-size:17px; color:var(--g); min-width:24px; text-align:center; }

  /* tables */
  table.lt{ width:100%; border-collapse:collapse; font-family:var(--fb); font-size:12px; }
  table.lt th{ font-family:var(--fc); font-size:10.5px; font-weight:700; letter-spacing:.05em; text-transform:uppercase; text-align:center; color:#fff; background:var(--g); padding:8px 4px; }
  table.lt th.l, table.lt td.l{ text-align:left; }
  table.lt td{ padding:6px 5px; text-align:center; border-bottom:1px solid var(--line); }
  table.lt td.num{ font-family:var(--fm); }
  table.lt tbody tr:nth-child(even) td{ background:#fafafa; }
  table.lt tr.me td{ background:var(--y); font-weight:700; color:#0d0d0d; }

  /* premium sponsor showcase */
  .spon-feat-row{ display:grid; grid-template-columns:repeat(2,1fr); gap:14px; margin-bottom:14px; }
  .spon-feat{ border:0; border-top:4px solid var(--y); padding:18px 16px; display:flex; flex-direction:column; align-items:center; text-align:center; gap:7px; background:#fff; min-height:150px; justify-content:center; }
  .spon-feat img{ max-width:78%; max-height:74px; object-fit:contain; }
  /* The Cherry Red artwork is white on transparent, so it only reads on a dark
     panel. Sized by max-height with width:auto so it can never be stretched. */
  /* ═══ FLOOD PAGES — one colour field, type at poster scale ═══════════════
     The campaign pages were the emptiest in the publication: two outlined
     panels delivering a sentence each on a white sheet. A flood page fills
     edge to edge and carries one message, which is what a campaign page is.
     It also gives the contact sheet something to read at thumbnail size —
     a solid field is instantly distinguishable from an editorial page. */
  .page--flood{ padding:0; }
  .fl{ height:100%; padding:22mm 16mm 16mm; display:flex; flex-direction:column; }
  .page--flood-y{ background:var(--y); }
  .page--flood-y .fl{ color:#0d0d0d; }
  .page--flood-g{ background:var(--gd); }
  .page--flood-g .fl{ color:#fff; }
  .fl-kick{ font-family:var(--fc); font-size:11px; font-weight:700; letter-spacing:.26em;
            text-transform:uppercase; opacity:.7; }
  .fl-big{ font-family:var(--fd); font-size:86px; line-height:.84; letter-spacing:.5px;
           margin-top:14px; }
  .page--flood-g .fl-big{ color:#fff; }
  .fl-sub{ font-family:var(--fb); font-size:16px; line-height:1.5; max-width:34ch;
           margin-top:16px; font-weight:500; }
  .fl-qr{ margin-top:auto; width:132px; height:132px; background:#fff; padding:9px; }
  .page--flood-y .fl-qr{ border:2px solid #0d0d0d; }
  .fl-qr img,.fl-qr canvas{ width:100%; height:100%; }
  .fl-foot{ margin-top:16px; padding-top:11px; display:flex; justify-content:space-between;
            gap:16px; flex-wrap:wrap; font-family:var(--fc); font-size:10px; font-weight:700;
            letter-spacing:.12em; text-transform:uppercase; }
  .page--flood-y .fl-foot{ border-top:2px solid #0d0d0d; }
  .page--flood-g .fl-foot{ border-top:2px solid rgba(255,255,255,.5); color:rgba(255,255,255,.85); }
  .fl-body{ font-family:var(--fb); font-size:12.5px; line-height:1.7; max-width:62ch; margin-top:14px; }
  .page--flood-g .fl-body{ color:rgba(255,255,255,.9); }
  /* Reporting routes as columns on a rule, not four tinted cards. */
  .kio{ margin-top:auto; display:grid; grid-template-columns:1fr 1fr; gap:16px 26px;
        border-top:2px solid rgba(255,255,255,.45); padding-top:14px; }
  .kio div{ font-family:var(--fb); font-size:11.5px; line-height:1.55; color:rgba(255,255,255,.88); }
  .kio b{ display:block; font-family:var(--fc); font-size:9.5px; font-weight:700;
          letter-spacing:.16em; text-transform:uppercase; color:var(--y); margin-bottom:3px; }

  /* ═══ ACERBIS — technical partner editorial ═══════════════════════════════
     Black field, the real mark at proper clear space, one enormous statement,
     three short columns on a rule. Closer to a sportswear campaign page than a
     sponsor listing, which is what a kit partner earns. */
  .acb{ display:flex; flex-direction:column; }
  .acb-top{ display:flex; align-items:center; justify-content:space-between; gap:20px;
            border-bottom:2px solid rgba(255,255,255,.28); padding-bottom:16px; }
  /* Height only — the width follows, so the mark keeps its own proportions. */
  .acb-mark{ height:54px; width:auto; }
  .acb-tier{ font-family:var(--fc); font-size:10px; font-weight:700; letter-spacing:.24em;
             text-transform:uppercase; color:var(--y); }
  .acb-big{ font-family:var(--fd); font-size:96px; line-height:.82; color:#fff;
            letter-spacing:1px; margin-top:26px; }
  .acb-cols{ margin-top:auto; display:grid; grid-template-columns:repeat(3,1fr); gap:22px;
             border-top:2px solid var(--y); padding-top:15px; }
  .acb-cols div{ font-family:var(--fb); font-size:11px; line-height:1.6; color:rgba(255,255,255,.82); }
  .acb-cols b{ display:block; font-family:var(--fd); font-size:19px; letter-spacing:.4px;
               color:#fff; font-weight:400; margin-bottom:5px; }
  .acb-foot{ margin-top:16px; padding-top:11px; border-top:1px solid rgba(255,255,255,.25);
             display:flex; justify-content:space-between; gap:14px; flex-wrap:wrap;
             font-family:var(--fc); font-size:9.5px; font-weight:700; letter-spacing:.16em;
             text-transform:uppercase; color:rgba(255,255,255,.6); }

  /* GROUND GUIDE — a photograph where there used to be white space. */
  .gg-hero{ margin:0 0 16px; }
  .gg-hero img{ width:100%; height:74mm; object-fit:cover; object-position:50% 55%; display:block; }
  .gg-hero figcaption{ font-family:var(--fc); font-size:9px; font-weight:700; letter-spacing:.14em;
                       text-transform:uppercase; color:var(--soft); padding-top:6px;
                       border-top:2px solid var(--ink); margin-top:6px; }
  .gg{ display:grid; grid-template-columns:1fr 1fr; gap:13px 26px; }
  .gg div{ font-family:var(--fb); font-size:11.5px; line-height:1.55; color:#262626;
           border-top:1px solid var(--line); padding-top:7px; }
  .gg b{ display:block; font-family:var(--fc); font-size:9.5px; font-weight:700;
         letter-spacing:.16em; text-transform:uppercase; color:var(--g); margin-bottom:3px; }

  /* ═══ THE SQUAD — a roster directory, not twenty-six adverts ═════════════
     Five across. The portrait is deliberately small: at this size the page
     reads as THE FIRST TEAM rather than as a grid of individual features, and
     twenty-six players fit on one A4 sheet with room to breathe.

     No card, no border, no radius, no statistics. Number, face, name,
     position. A squad page in a media guide carries exactly that and nothing
     more, because that is all a reader wants from it. */
  .sq-grid{ display:grid; grid-template-columns:repeat(5, 1fr); gap:11px 9px; }
  .sq{ position:relative; }
  .sq-ph{ aspect-ratio:1/1; background:linear-gradient(160deg,#14532d,#0b2a1a);
          position:relative; overflow:hidden; display:flex; align-items:center;
          justify-content:center; }
  .sq-ph img{ width:100%; height:100%; object-fit:cover; object-position:50% 22%; }
  /* The fallback occupies the identical footprint, so adding a photograph
     later needs no layout change at all. */
  .sq-ph--none{ background:
      repeating-linear-gradient(115deg, rgba(255,209,0,.14) 0 7px, transparent 7px 17px),
      linear-gradient(160deg,#14532d,#08210f); }
  .sq-ph--none .ini{ font-family:var(--fd); font-size:27px; line-height:.85; color:#fff;
                     letter-spacing:.5px; }
  .sq-ph--none .crestcrop{ position:absolute; left:-14px; top:-12px; width:48px; height:48px;
                           background:url(img/badge.png) center/contain no-repeat; opacity:.14; }
  .sq-ph--none .soon{ position:absolute; left:0; right:0; bottom:3px; text-align:center;
                      font-family:var(--fc); font-size:5.5px; font-weight:700; letter-spacing:.12em;
                      text-transform:uppercase; color:rgba(255,255,255,.5); line-height:1.35; }
  .sq-no{ position:absolute; top:0; left:0; background:var(--y); color:#0d0d0d;
          font-family:var(--fd); font-size:15px; line-height:1; padding:2px 5px 1px;
          font-variant-numeric:tabular-nums; }
  .sq-nm{ font-family:var(--fd); font-size:12.5px; line-height:1; letter-spacing:.2px;
          color:var(--ink); margin-top:5px; }
  .sq-po{ font-family:var(--fc); font-size:7px; font-weight:700; letter-spacing:.13em;
          text-transform:uppercase; color:var(--g); margin-top:2px; }

  /* ═══ CLUB DIRECTORY — a masthead, not a spreadsheet ═════════════════════
     Names carry more weight than the roles beside them, because the people are
     the point. Grouped by what they actually do. */
  .mast-dir{ display:grid; grid-template-columns:1fr 1fr; gap:16px 30px; }
  .md-sec{ break-inside:avoid; }
  .md-sec > b{ display:block; font-family:var(--fc); font-size:9px; font-weight:700;
               letter-spacing:.2em; text-transform:uppercase; color:var(--soft);
               border-bottom:2px solid var(--ink); padding-bottom:4px; margin-bottom:7px; }
  .md-p{ display:flex; justify-content:space-between; align-items:baseline; gap:10px;
         padding:4px 0; border-bottom:1px solid var(--line); }
  .md-p .nm{ font-family:var(--fd); font-size:16px; letter-spacing:.3px; color:var(--ink);
             line-height:1.05; }
  .md-p .rl{ font-family:var(--fc); font-size:8px; font-weight:700; letter-spacing:.11em;
             text-transform:uppercase; color:var(--g); text-align:right; white-space:nowrap; }
  .md-contact{ margin-top:14px; border-top:2px solid var(--ink); padding-top:9px;
               display:grid; grid-template-columns:1fr 1fr; gap:4px 26px; }
  .md-contact div{ display:flex; justify-content:space-between; gap:10px;
                   font-family:var(--fb); font-size:10px; color:#333;
                   border-bottom:1px dotted var(--line); padding:3px 0; }
  .md-contact b{ font-family:var(--fc); font-size:8px; font-weight:700; letter-spacing:.1em;
                 text-transform:uppercase; color:var(--soft); }

  /* A rule with a label sitting on it — replaces .divider's pill-and-dash. */
  .rule{ display:flex; align-items:center; gap:12px; margin:22px 0 11px; }
  .rule::before{ content:''; height:3px; width:34px; background:var(--y); flex:none; }
  .rule span{ font-family:var(--fc); font-size:10px; font-weight:700; letter-spacing:.2em;
              text-transform:uppercase; color:var(--ink); white-space:nowrap; }
  .rule::after{ content:''; height:2px; background:var(--ink); flex:1; }

  /* SEASON SO FAR — one dominant record, no KPI tiles. */
  .ssf{ display:flex; align-items:flex-end; gap:26px; flex-wrap:wrap;
        border-bottom:3px solid var(--ink); padding-bottom:12px; }
  .ssf-hero{ display:flex; align-items:flex-end; gap:11px; }
  .ssf-big{ font-family:var(--fd); font-size:118px; line-height:.72; color:var(--g);
            font-variant-numeric:tabular-nums; }
  .ssf-cap{ font-family:var(--fc); font-size:11px; font-weight:700; letter-spacing:.16em;
            text-transform:uppercase; color:var(--soft); line-height:1.5; padding-bottom:5px; }
  .ssf-cap b{ color:var(--ink); }
  .ssf-rec{ display:flex; flex-direction:column; gap:5px; padding-bottom:5px; }
  .ssf-wdl{ font-family:var(--fd); font-size:44px; line-height:.85; color:var(--ink);
            font-variant-numeric:tabular-nums; }
  .ssf-wdl i{ font-style:normal; font-size:19px; color:var(--y); -webkit-text-stroke:.6px var(--ink);
              padding:0 7px 0 3px; }
  .ssf-pts{ font-family:var(--fd); font-size:26px; color:var(--g); line-height:1; }
  .ssf-pts i{ font-style:normal; font-family:var(--fc); font-size:10px; font-weight:700;
              letter-spacing:.14em; text-transform:uppercase; color:var(--soft); }
  .ssf-goals{ display:flex; gap:30px; flex-wrap:wrap; padding:9px 0 0; }
  .ssf-goals span{ font-family:var(--fb); font-size:11.5px; color:#333; letter-spacing:.02em; }
  .ssf-goals b{ font-family:var(--fd); font-size:24px; color:var(--ink); line-height:1;
                padding-right:5px; font-variant-numeric:tabular-nums; }

  /* NEXT MATCH — a fixture poster, not an advert in a rounded box.
     Hard rules, one colour field, type doing the work. The away variant shifts
     the field darker and swaps the connector; it does NOT adopt the opponent's
     colours, because this is still a Rayners Lane publication. */
  .nx{ background:var(--g); color:#fff; padding:26px 24px 24px; }
  .nx-away{ }
  .nx-away .nx{ background:#0d0d0d; border-top:5px solid var(--y); }
  .nx-state{ font-family:var(--fc); font-size:10px; font-weight:700; letter-spacing:.2em;
             text-transform:uppercase; color:var(--y); }
  .nx-fix{ margin-top:8px; display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .nx-us,.nx-them{ font-family:var(--fd); font-size:40px; line-height:.9; letter-spacing:.5px; color:#fff; }
  .nx-vs{ font-family:var(--fd); font-size:28px; color:var(--y); line-height:.9; }
  .nx-meta{ margin-top:12px; padding-top:9px; border-top:1px solid rgba(255,255,255,.28);
            font-family:var(--fb); font-size:12px; color:rgba(255,255,255,.9); }
  .nx-cta{ margin-top:14px; display:inline-block; background:var(--y); color:#0d0d0d;
           font-family:var(--fc); font-weight:700; letter-spacing:.06em; padding:8px 16px; font-size:12px; }
  .nx-note{ margin-top:12px; font-family:var(--fb); font-size:12px; color:rgba(255,255,255,.82); }
  .nx-second{ display:flex; justify-content:space-between; align-items:baseline; gap:14px;
              flex-wrap:wrap; border-bottom:2px solid var(--ink); padding-bottom:7px; }
  .nx-second b{ font-family:var(--fd); font-size:21px; letter-spacing:.4px; color:var(--ink); font-weight:400; }
  .nx-second span{ font-family:var(--fb); font-size:11.5px; color:#333; }

  /* Playing colours and officials — set as type, not as cards. */
  .kit-block{ display:flex; flex-direction:column; gap:7px; }
  .kit-row{ display:flex; align-items:center; gap:14px; flex-wrap:wrap;
            border-bottom:1px solid var(--line); padding-bottom:6px; }
  .kit-l{ font-family:var(--fd); font-size:15px; letter-spacing:.5px; color:var(--ink);
          min-width:130px; }
  .kit-i{ font-family:var(--fb); font-size:11px; color:#333; display:inline-flex;
          align-items:center; gap:5px; }
  .kit-i b{ font-family:var(--fc); font-size:9px; font-weight:700; letter-spacing:.1em;
            text-transform:uppercase; color:var(--soft); }
  .kit-i i{ width:11px; height:11px; border:1px solid rgba(0,0,0,.35); display:inline-block; }
  .kit-tbc,.off-tbc{ font-family:var(--fb); font-size:11px; font-style:italic; color:var(--soft); }
  .off-block{ display:flex; gap:22px; flex-wrap:wrap; }
  .off-i{ font-family:var(--fb); font-size:11.5px; color:#222; }
  .off-i b{ font-family:var(--fc); font-size:9px; font-weight:700; letter-spacing:.1em;
            text-transform:uppercase; color:var(--soft); display:block; }
  .league-mark{ margin-top:12px; background:#0d0d0d; padding:14px 16px;
                display:flex; align-items:center; gap:14px; justify-content:center; }
  .league-mark img{ height:34px; width:auto; max-width:190px; object-fit:contain; }
  .league-mark span{ font-family:var(--fc); font-size:10px; font-weight:700; letter-spacing:.1em;
                     text-transform:uppercase; color:rgba(255,255,255,.75); }
  .spon-feat .tier{ font-family:var(--fc); font-size:10px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--g); }
  .spon-feat .nm{ font-family:var(--fd); font-size:24px; letter-spacing:.5px; color:var(--ink); line-height:1; }
  .spon-feat .role{ font-family:var(--fb); font-size:11.5px; color:var(--soft); }
  .spon-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:10px; }
  .spon{ border:0; height:76px; display:flex; align-items:center; justify-content:center; background:#fff; padding:8px; }
  .spon img{ max-width:88%; max-height:58px; object-fit:contain; }
  .spon .nm2{ font-family:var(--fc); font-weight:700; color:#444; text-align:center; font-size:12px; }

  /* today's match sponsors */
  .todays{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  .today{ padding:12px; text-align:center; background:#0d0d0d; color:#fff; position:relative; overflow:hidden; }
  .today::after{ content:''; position:absolute; left:0; right:0; bottom:0; height:3px; background:var(--y); }
  .today .k{ font-family:var(--fc); font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--y); }
  .today .v{ font-family:var(--fd); font-size:22px; letter-spacing:.5px; line-height:1.05; margin-top:4px; }

  /* statements + CTA */
  .stmt{ border-left:3px solid var(--y); padding-left:12px; margin-bottom:11px; font-size:12px; line-height:1.55; color:#333; }
  .stmt b{ display:block; font-family:var(--fc); letter-spacing:.08em; text-transform:uppercase; color:var(--g); font-size:11.5px; margin-bottom:2px; }
  .cta-card{ display:flex; gap:18px; align-items:center; border:0; border-top:2px solid var(--ink); padding:14px 0 0; background:transparent; }
  .cta-qr img, .cta-qr canvas, .cta-qr table{ width:118px; height:118px; }
  .cta-h{ font-family:var(--fd); font-size:25px; letter-spacing:.5px; color:var(--ink); margin-bottom:5px; }
  .backqr{ display:flex; gap:18px; align-items:center; border-top:2px solid var(--y); padding-top:14px; margin-top:16px; }
  .backqr .qr img, .backqr .qr canvas, .backqr .qr table{ width:120px; height:120px; }

  /* COVER */
  .cover{ background:linear-gradient(160deg,#0d0d0d,#161208 70%); color:#fff; padding:0; display:flex; flex-direction:column; }
  .cover-sponsor{ background:var(--y); color:#0d0d0d; text-align:center; font-family:var(--fc); font-weight:700; font-size:14px; letter-spacing:.04em; padding:9px 12px; }
  .cover-sponsor b{ text-transform:uppercase; }
  .cover-top{ flex:1; padding:16mm 15mm 0; text-align:center; display:flex; flex-direction:column; }
  .cover-badge{ width:118px; height:118px; object-fit:contain; margin:0 auto 12px; }
  .cover-kicker{ font-family:var(--fc); font-size:15px; font-weight:700; letter-spacing:.32em; text-transform:uppercase; color:var(--y); }
  .cover-title{ font-family:var(--fd); font-size:62px; line-height:.92; letter-spacing:2px; margin:6px 0 2px; }
  .cover-comp{ font-family:var(--fc); font-size:14px; letter-spacing:.16em; text-transform:uppercase; color:rgba(255,255,255,.7); }
  .vs{ display:flex; align-items:center; justify-content:center; gap:26px; margin:auto 0; }
  .vs .crest{ width:150px; height:150px; object-fit:contain; }
  .vs .vstxt{ font-family:var(--fd); font-size:70px; color:var(--y); letter-spacing:2px; }
  .vs .tn{ font-family:var(--fd); font-size:26px; letter-spacing:1px; margin-top:8px; }
  .vs .side{ width:230px; text-align:center; }
  .cover-meta{ display:flex; justify-content:center; gap:30px; margin:auto 0 16mm; }
  .cover-meta .m .l{ font-family:var(--fc); font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--y); }
  .cover-meta .m .v{ font-family:var(--fd); font-size:27px; letter-spacing:1px; }
  .cover-bottom{ background:var(--y); color:#0d0d0d; padding:11px 15mm; display:flex; justify-content:space-between; align-items:center; font-family:var(--fc); font-weight:700; letter-spacing:.1em; text-transform:uppercase; font-size:13px; }

  /* per-page footer */
  .pcta{ position:absolute; left:14mm; right:14mm; bottom:8mm; display:flex; align-items:center; gap:12px; border-top:2px solid var(--y); padding-top:7px; font-family:var(--fc); font-size:10.5px; letter-spacing:.05em; color:var(--soft); }
  .pcta span:first-child{ font-weight:700; color:var(--g); }
  .pcta span:nth-child(2){ flex:1; text-align:center; }
  .pcta .pg{ color:#999; }

  /* player cards */
  .pcards{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  /* A card must never be sliced by a page boundary — half a face at the foot
     of one sheet and the stats at the top of the next is the sort of thing the
     committee then tries to fix by hand. */
  /* No card. The border and radius were what made the squad read as an
     e-commerce grid; the portrait now runs to the cell edge and type sits
     under it, which is how a squad page works in print. */
  .pcard{ background:transparent; break-inside:avoid; page-break-inside:avoid; }
  /* THE HEADSHOT BOX WAS THE CROP BUG. At 96px tall in a ~225px-wide column it
     was a letterbox, and object-fit:cover on a portrait photo threw away most
     of the head. object-position:top saved the forehead and cut the chin.
     A portrait box keeps the whole face, and 50% 28% sits the eyeline slightly
     above centre, which is where it falls in almost every squad photo. */
  .pcard .ph{ aspect-ratio:4/5; height:auto; background:linear-gradient(160deg,#14532d,#0b2a1a);
              display:flex; align-items:center; justify-content:center; position:relative; overflow:hidden; }
  .pcard .ph img{ width:100%; height:100%; object-fit:cover; object-position:50% 28%; }
  .pcard .no{ position:absolute; top:6px; left:8px; font-family:var(--fd); font-size:28px; color:var(--y); line-height:1; }
  .pcard .nm{ font-family:var(--fd); font-size:19px; letter-spacing:.4px; color:var(--ink);
              padding:7px 0 0; line-height:.95; }
  .pcard .po{ font-family:var(--fc); font-size:9px; font-weight:700; letter-spacing:.14em;
              text-transform:uppercase; color:var(--g); padding:2px 0 5px; }
  /* ONE HORIZONTAL LINE, not three boxed cells. A statistic does not need a
     box; it needs to be legible and to sit on a rule. */
  .pcard .st{ display:flex; gap:10px; border-top:2px solid var(--ink); padding-top:4px; }
  .pcard .st div{ display:flex; align-items:baseline; gap:3px; }
  .pcard .st .v{ font-family:var(--fd); font-size:16px; color:var(--ink); line-height:1;
                 font-variant-numeric:tabular-nums; }
  .pcard .st .v.unk{ color:var(--soft); }
  .pcard .st .k{ font-family:var(--fc); font-size:7.5px; font-weight:700; letter-spacing:.1em;
                 text-transform:uppercase; color:var(--soft); }

  /* ═══ NO PHOTOGRAPH YET — designed, not failed ═══════════════════════════
     Eight of twenty-six players have no headshot. They used to render as a
     flat green rectangle, which on the contact sheet was indistinguishable
     from a broken image. This is a deliberate identity graphic instead: the
     squad number oversized, the player's initials, a diagonal kit stripe and
     a cropped crest. When a real photograph arrives it simply replaces this —
     nothing else changes. */
  .ph--none{ background:
      repeating-linear-gradient(115deg, rgba(255,209,0,.13) 0 9px, transparent 9px 22px),
      linear-gradient(160deg,#14532d,#08210f); }
  .ph--none .ini{ font-family:var(--fd); font-size:46px; line-height:.85; color:#fff;
                  letter-spacing:1px; opacity:.95; }
  .ph--none .bignum{ position:absolute; right:-6px; bottom:-16px; font-family:var(--fd);
                     font-size:96px; line-height:.72; color:var(--y); opacity:.20; }
  .ph--none .soon{ position:absolute; left:0; right:0; bottom:6px; text-align:center;
                   font-family:var(--fc); font-size:7px; font-weight:700; letter-spacing:.18em;
                   text-transform:uppercase; color:rgba(255,255,255,.55); }
  .ph--none .crestcrop{ position:absolute; left:-22px; top:-18px; width:78px; height:78px;
                        background:url(img/badge.png) center/contain no-repeat; opacity:.13; }

  /* directory */
  .dir{ display:grid; grid-template-columns:1fr 1fr; gap:8px 18px; }
  .dir-row{ display:flex; justify-content:space-between; gap:10px; border-bottom:1px dotted var(--line); padding:6px 0; }
  .dir-row .r{ font-family:var(--fc); font-size:11px; font-weight:700; letter-spacing:.04em; text-transform:uppercase; color:var(--g); }
  .dir-row .n{ font-family:var(--fb); font-size:13px; color:var(--ink); font-weight:600; }

  /* tiered sponsor directory */
  .tier-block{ margin-bottom:12px; }
  .tier-head{ font-family:var(--fc); font-size:12px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:#fff; background:var(--g); padding:4px 12px; display:inline-block; }
  .tier-row{ display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .tier-chip{ border:0; border-bottom:1px solid var(--line); padding:6px 0; font-family:var(--fb); font-size:12.5px; }
  .tier-chip b{ font-family:var(--fc); font-weight:700; }

  /* match preview / opposition cards */
  .pv-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .pv-vs{ display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px; border:0; border-top:3px solid var(--ink); border-bottom:3px solid var(--ink); padding:14px 0; margin-bottom:14px; }
  .pv-vs .t{ text-align:center; }
  .pv-vs img{ width:64px; height:64px; object-fit:contain; }
  .pv-vs .nm{ font-family:var(--fd); font-size:18px; letter-spacing:.3px; }
  .pv-vs .vs{ font-family:var(--fd); font-size:30px; color:var(--g); }

  /* next-match advert / back cover */
  .advert{ background:linear-gradient(160deg,#0b1d11,#15532e); color:#fff; padding:26px 22px; text-align:center; position:relative; overflow:hidden; }
  .advert::after{ content:''; position:absolute; right:-40px; bottom:-50px; width:240px; height:240px; background:url(img/badge.png) center/contain no-repeat; opacity:.08; }
  .advert .k{ font-family:var(--fc); font-size:13px; font-weight:700; letter-spacing:.22em; text-transform:uppercase; color:var(--y); }
  .advert .big{ font-family:var(--fd); font-size:46px; line-height:.95; letter-spacing:1px; margin:6px 0; }
  .advert .meta{ font-family:var(--fc); font-size:15px; letter-spacing:.06em; }

  @media print{
    @page{ size:A4 portrait; margin:0; }
    body{ background:#fff; -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    .bar{ display:none; }
    .pages{ padding:0; }
    /* HEIGHT, NOT MIN-HEIGHT. With min-height:297mm the last sheet rounded a
       hair over A4 and Chrome emitted a blank trailing page — a wasted sheet on
       every copy the club prints. Fixing the height to exactly A4 (with
       overflow hidden, already set) makes each .page occupy one sheet and no
       more. `page-break-after:always` is dropped for the same reason: with
       exact-height pages the natural flow already breaks correctly, and the
       explicit break was what produced the extra sheet at the end. */
    .page{ margin:0; box-shadow:none; height:297mm; break-after:page; }
    .page:last-child{ break-after:auto; page-break-after:auto; }
    /* Nothing that reads as one unit may be split across sheets. */
    .pcard, .card, .spon, .spon-feat, .ts-row, .cta-card, .partners{ break-inside:avoid; page-break-inside:avoid; }
    .pcards{ break-inside:auto; }
    h1,h2,h3,.k{ break-after:avoid; page-break-after:avoid; }
    /* Backgrounds and logos must survive the print pipeline; without this
       Chrome drops every panel colour and the crest strip prints blank. */
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    img{ max-width:100%; }
  }
</style>
</head>
<body>

<div class="bar">
  <h1>Programme — Print Edition</h1>
  <button onclick="window.print()"><i class="ico ico-printer"></i> Print / Save as PDF</button>
  <span class="hint">Click the button → choose <b>Save as PDF</b> (or your printer) → paper <b>A4</b>, “Background graphics” ON. Then send the PDF to your printer.</span>
  <span class="sp"></span>
  <a href="programme.html" style="color:#aaa;font-family:var(--fc);font-size:13px">← Digital version</a>
</div>

<div class="pages" id="pages">
  <div class="page" style="display:flex;align-items:center;justify-content:center;color:#888;font-family:var(--fc)">Building your programme…</div>
</div>

<script>
(function () {
  var SITE = 'https://raynerslanefc.co.uk';
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function lines(t){ return String(t||'').split('\n').map(function(l){return l.trim();}).filter(Boolean); }
  function notes(t){ return lines(t).map(function(l){ return '<p>'+esc(l)+'</p>'; }).join(''); }
  function to12(t){ if(!t||!/^\d{1,2}:\d{2}/.test(t))return t||'3:00 PM'; var p=t.split(':'),h=parseInt(p[0],10),m=p[1].slice(0,2),ap=h>=12?'PM':'AM'; h=h%12; if(h===0)h=12; return h+':'+m+' '+ap; }
  function niceDate(d){ if(!d)return ''; var dt=new Date(d.length===10?d+'T12:00:00':d); return isNaN(dt.getTime())?d:dt.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'}); }
  function shortDate(d){ if(!d)return ''; var dt=new Date(d.length===10?d+'T12:00:00':d); return isNaN(dt.getTime())?d:dt.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'}); }
  /** "Keiran Barnard-White" -> "KB". Two letters, because three starts to read
      as an acronym rather than a person. */
  function initials(name){
    var w = String(name||'').trim().split(/[\s-]+/).filter(Boolean);
    if(!w.length) return '';
    return ((w[0][0]||'') + (w.length>1 ? (w[w.length-1][0]||'') : '')).toUpperCase();
  }
  function initialsBadge(name){
    var w=String(name||'').replace(/F\.?C\.?/gi,'').trim().split(/\s+/);
    var ini=w.slice(0,3).map(function(x){return (x[0]||'').toUpperCase();}).join('');
    return 'data:image/svg+xml,'+encodeURIComponent('<svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg"><circle cx="60" cy="60" r="58" fill="%230d0d0d" stroke="%23FFD100" stroke-width="3"/><text x="60" y="72" text-anchor="middle" font-family="Arial Black" font-size="'+(ini.length>2?'30':'38')+'" font-weight="900" fill="white">'+ini+'</text></svg>');
  }
  function getJSON(name){ return fetch('data/'+name+'.json?t='+Date.now()).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}); }
  function qr(text){ try{ var q=qrcode(0,'M'); q.addData(text); q.make(); return q.createImgTag(4,0); }catch(e){ return ''; } }
  function paramId(){ var m=location.search.match(/[?&]id=([^&]+)/); return m?decodeURIComponent(m[1]):''; }
  /* The masthead that replaced the repeated green bar. `secNo` counts the
     editorial sections so the number means something — it is the section's
     position in the publication, not decoration. */
  var secNo = 0;
  function banner(kick,title){
    secNo++;
    var n = (secNo<10?'0':'') + secNo;
    return '<div class="mh"><span class="n">'+n+'</span><div class="tx">'+
      '<span class="kick">'+esc(kick)+'</span><h2>'+esc(title)+'</h2></div></div>';
  }
  /* For pages that carry their own hierarchy and need no masthead at all. */
  function rule(label){
    return '<div class="rule"><span>'+esc(label)+'</span></div>';
  }

  /* ── THE SEASON AS IT STOOD BEFORE THIS MATCH ─────────────────────────────
     A programme is handed to supporters BEFORE kick-off. Every number in it is
     therefore a pre-match number: "Played 12" means twelve before today, and
     Recent Form must not carry a result for the game they are about to watch.

     A score-present filter alone is not enough. Live scores are entered while
     the match is in progress, and the same fixtures file feeds this page — so
     a programme printed at half time, or a PDF regenerated on the night, would
     quietly include the match's own scoreline in its own preview. The only
     safe rule is the date: nothing on or after this edition's match day counts.

     Cutting by DATE rather than by score also means a published edition stays
     correct forever. Its date is frozen in the document, so re-opening last
     August's programme still shows the season exactly as it stood that
     afternoon, however many matches have been played since.

     No date on the edition (an undated draft) falls back to the old behaviour:
     anything with a score. */
  /**
   * How many players go on each squad page, given a roster size and the most
   * that fit on one sheet.
   *
   * Returns a list of per-page counts that sum to exactly `total`, uses the
   * fewest pages that can hold them, and differs by at most one between the
   * fullest and emptiest page. That last property is the point: it is what
   * stops a roster of 26 ending on a sheet holding two players.
   */
  function squadPages(total, max){
    if (total <= 0) return [];
    var pages = Math.ceil(total / max);
    var base = Math.floor(total / pages);
    var extra = total % pages;                 // spread the remainder, one each
    var out = [];
    for (var i = 0; i < pages; i++) out.push(base + (i < extra ? 1 : 0));
    return out;
  }

  function seasonStats(fixtures, editionDate){
    var cut = String(editionDate||'').slice(0,10);
    if (!/^\d{4}-\d{2}-\d{2}$/.test(cut)) cut = '';
    var played = (fixtures||[]).filter(function(f){
      if (f.us==null || f.them==null) return false;
      // Strictly before: a fixture on the same day is today's, or one of
      // today's if the club plays twice.
      return !cut || String(f.date||'').slice(0,10) < cut;
    }).sort(function(a,b){ return String(a.date).localeCompare(String(b.date)); });
    var w=0,dd=0,l=0,gf=0,ga=0,form=[],scorers={};
    played.forEach(function(f){
      gf+=Number(f.us); ga+=Number(f.them);
      if(f.us>f.them) w++; else if(f.us===f.them) dd++; else l++;
      form.push(f.us>f.them?'W':(f.us===f.them?'D':'L'));
      String(f.scorers||'').split(',').forEach(function(s){
        var name=s.replace(/\([^)]*\)/g,'').replace(/\d.*$/,'').replace(/\b(pen|og|p)\b/gi,'').trim();
        if(name && name.length>1){ scorers[name]=(scorers[name]||0)+1; }
      });
    });
    var top=Object.keys(scorers).map(function(n){return {name:n,goals:scorers[n]};}).sort(function(a,b){return b.goals-a.goals;}).slice(0,12);
    return { played:played.length, w:w, d:dd, l:l, gf:gf, ga:ga, pts:(w*3+dd), form:form.slice(-6), scorers:top, results:played.slice().reverse() };
  }
  /* ── WHICH PROGRAMME IS THIS? ────────────────────────────────────────────
     THE BUG THIS FIXES. The admin cover preview rendered from the FORM the
     operator was typing into. This page rendered from the SAVED FILE. Nothing
     reconciled the two, so the preview showed Hilltop while the print edition
     showed "TBC / 2026-27 / 3:00 PM" — the fallbacks that fire when
     data/programme.json still has opponent:'' and no date.

     The operator had no way to know. The panel even told them to press Publish
     first, which "worked" only because publishing happened to write the file.
     Printing and publishing are different things and must not be entangled.

     Order of preference now:
       1. ?draft=1  → the snapshot the admin just saved, handed over directly.
                      Instant, works while unpublished, and is byte-identical
                      to what the operator is looking at.
       2. ?id=…     → a specific archived edition (history must never change).
       3. otherwise → the current saved programme, as before.                */
  function draftSnapshot(){
    try {
      if (!/[?&]draft=1/.test(location.search)) return null;
      var raw = localStorage.getItem('rlfc_programme_draft');
      if (!raw) return null;
      var o = JSON.parse(raw);
      // Stale hand-offs are worse than none: a snapshot from an hour ago would
      // silently print the wrong match.
      if (!o || !o.savedAt || (Date.now() - Date.parse(o.savedAt)) > 30 * 60 * 1000) return null;
      return o.doc || null;
    } catch (e) { return null; }
  }
  function loadProgrammeDoc(){
    var draft = draftSnapshot();
    if (draft) return Promise.resolve(draft);
    var id = paramId();
    if (!id) return getJSON('programme');
    return getJSON('programmes').then(function(a){ var items=(a&&a.items)||[]; return items.filter(function(it){return it.id===id;})[0] || getJSON('programme'); });
  }

  /* ── THE ARCHIVE RULE ─────────────────────────────────────────────────
     A programme is a record of the club on one afternoon, not a live
     document. A DRAFT may read today's figures so Russell builds it with
     current information. A PUBLISHED edition renders from the snapshot frozen
     at publication and never asks the season service again.

     Without this, opening last August's Hilltop programme in March would show
     a player on 25 appearances because that is what he has NOW — rewriting a
     document supporters already hold.

     WHAT DECIDES IS `published`, NOT "is there a snapshot".
     The test used to be `if (doc.playerStats)`, and an empty object is truthy.
     A draft that had ever been handed a `{}` — or a snapshot taken while the
     squad was still unmatched — was therefore treated as settled history and
     printed dashes for ever, with no way to refresh short of publishing. A
     draft is not history. It refreshes. Only a published edition is frozen,
     and it stays frozen even if what it froze was empty, because that is
     honestly what the club knew that afternoon. */
  function loadSeasonStats(doc){
    var published = !!(doc && doc.published);
    if (published) return Promise.resolve((doc && doc.playerStats) || null);
    return fetch('/.netlify/functions/programme-stats')
      .then(function(r){ return r.ok ? r.json() : null; })
      .catch(function(){ return null; });
  }

  var cfgKit = null;   // the club's own playing colours, stored once in config

  Promise.all([ loadProgrammeDoc(), getJSON('crests'), getJSON('sponsors'), getJSON('fixtures'),
    fetch('/.netlify/functions/fetch-table').then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}),
    getJSON('committee'), getJSON('officials'), getJSON('emails'), getJSON('players'), getJSON('squad'),
    getJSON('config')
  ]).then(function (res) {
    cfgKit = (res[10] && res[10].kit) || null;
    var d = res[0]||{}, crests=(res[1]&&res[1].crests)||[], sponsors=(res[2]&&res[2].sponsors)||[], fixtures=(res[3]&&res[3].fixtures)||[];

    /* THE ARCHIVE RULE, APPLIED TO THE TABLE.
       publishProgramme() freezes the standings into the document at the moment
       of publication, but this page was still calling fetch-table on every
       render — so opening a published edition months later redrew it with
       TODAY's table, showing a club in eighth on a page that went to print
       while they were in second.

       Same rule as the player figures, for the same reason: PUBLISHED decides,
       not "is there a snapshot". A draft shows the standings as they are now,
       so the edition being built is built on current information. Only a
       published edition is pinned to what it froze. */
    var frozenTable = d.leagueTable && (d.leagueTable.table || d.leagueTable);   // rows, or an older envelope
    var liveTable = (res[4] && res[4].table) || [];
    var table = d.published
      ? ((frozenTable && frozenTable.length) ? frozenTable : liveTable)
      : (liveTable.length ? liveTable : (frozenTable || []));
    var club = {
      committee:(res[5]&&res[5].members)||[], officials:res[6]||{}, emails:(res[7]&&res[7].accounts)||[],
      players:((res[8]&&res[8].players)||(res[9]&&res[9].players)||[])
    };
    return loadSeasonStats(d).then(function(ps){
      // Overwrite on a draft. `!d.playerStats` was the same truthiness trap:
      // a draft carrying a stale empty snapshot would discard the figures we
      // had just gone and fetched.
      if (ps && !d.published) d.playerStats = ps;
      else if (ps && !d.playerStats) d.playerStats = ps;
      render(d, crests, sponsors, fixtures, table, club);
      afterRender();
    });
  }).catch(function(err){
    /* WHY THIS EXISTS.
       render() threw and this chain had no catch, so the page sat on
       "Building…" indefinitely. It looked like a slow network. It was a
       TypeError, and it had been swallowing the Season So Far page of every
       printed programme.

       A blank page that says nothing is the worst outcome here, because
       somebody prints it. Say plainly that it failed, and name the fault so
       it can be reported rather than guessed at. */
    var host = document.getElementById('pages') || document.body;
    host.innerHTML = '<div class="page" style="padding:24mm 18mm">' +
      '<h2 style="font-family:var(--fc);letter-spacing:.06em">This programme could not be built</h2>' +
      '<p style="margin-top:10px;line-height:1.6">Nothing has been printed. Please tell whoever looks ' +
      'after the website, and pass on the line below.</p>' +
      '<pre style="margin-top:14px;padding:12px;background:#f4f4f4;border-radius:6px;white-space:pre-wrap;' +
      'font-size:12px">' + esc(String((err && err.message) || err)) + '</pre></div>';
    console.error('[programme-print]', err);
  });

  function afterRender(){
    if (/[?&](print|auto)=1/.test(location.search)) {
      window.addEventListener('load', function(){ setTimeout(function(){ window.print(); }, 900); });
      setTimeout(function(){ window.print(); }, 1400);
    }
  }

  function render(d, crests, sponsors, fixtures, table, club) {
    club = club || { committee:[], officials:{}, emails:[], players:[] };
    var opp = d.opponent || 'TBC';
    var crestRow = crests.filter(function(c){ return c.name && opp && c.name.toLowerCase()===opp.toLowerCase(); })[0];
    var oppCrest = d.oppCrest || (crestRow && crestRow.file) || initialsBadge(opp);
    var comp = d.competition || 'Combined Counties Premier Division North';

      'black-yellow': { bg:'#0d0d0d', ink:'#fff', accent:'#FFD100', accentInk:'#0d0d0d', soft:'rgba(255,255,255,.72)' },

      'green-black':  { bg:'#14532d', ink:'#fff', accent:'#0d0d0d', accentInk:'#FFD100', soft:'rgba(255,255,255,.8)' },
      'yellow-green': { bg:'#FFD100', ink:'#14532d', accent:'#14532d', accentInk:'#FFD100', soft:'rgba(20,83,45,.78)' },
      'green-yellow': { bg:'#14532d', ink:'#FFD100', accent:'#FFD100', accentInk:'#14532d', soft:'rgba(255,209,0,.85)' },
      'festive':      { bg:'#0b2a1a', ink:'#fff', accent:'#FFD100', accentInk:'#0d0d0d', soft:'rgba(255,255,255,.8)' },
      'remembrance':  { bg:'#0d0d0d', ink:'#fff', accent:'#C8102E', accentInk:'#fff', soft:'rgba(255,255,255,.72)' }
    };
    var TH = COVER_THEMES[d.coverTheme] || COVER_THEMES['black-yellow'];
    var DEF = {
      admission:'General £9 · Concessions £6 · Under 16s £2 · Under 10s free · Cash or card',
      rules:'No smoking or vaping in the stand · Respect all officials · Supporters welcome behind the barriers',
      firstaid:'First aid is available at the clubhouse — ask any committee member.',
      respect:"Rayners Lane FC proudly supports The FA's Respect programme. We ask every player, coach, supporter and official to back positive, respectful football — win, lose or draw.",

    };
    var CTAS = [

    ];
    var pn=0;

    var P=[];

    /* 1 — COVER (themed) */
    P.push('<div class="page cover" style="background:'+TH.bg+';color:'+TH.ink+'">'+
      (d.matchSponsor?'<div class="cover-sponsor" style="background:'+TH.accent+';color:'+TH.accentInk+';display:flex;align-items:center;justify-content:center;gap:10px">'+(d.matchSponsorLogo?'<img src="'+esc(d.matchSponsorLogo)+'" alt="'+esc(d.matchSponsor)+'" style="height:30px;max-width:120px;object-fit:contain;background:#fff;padding:3px 6px">':'')+'<span>This match is proudly sponsored by <b>'+esc(d.matchSponsor)+'</b></span></div>':'')+
      '<div class="cover-top" style="position:relative">'+
        '<div style="position:absolute;right:-120px;bottom:-110px;width:520px;height:520px;background:url(img/badge.png) center/contain no-repeat;opacity:.05;pointer-events:none"></div>'+
        '<img class="cover-badge" src="img/badge.png" alt="RLFC">'+
        '<div class="cover-kicker" style="color:'+TH.accent+'">Official Matchday Programme</div>'+
        '<div class="cover-title" style="color:'+TH.ink+'">RAYNERS LANE FC</div>'+
        '<div class="cover-comp" style="color:'+TH.soft+'">'+esc(comp)+'</div>'+
        '<div class="vs" style="position:relative;z-index:1">'+
          '<div class="side"><img class="crest" src="img/badge.png"><div class="tn" style="color:'+TH.ink+'">Rayners Lane</div></div>'+
          '<div class="vstxt" style="color:'+TH.accent+'">VS</div>'+
          '<div class="side"><img class="crest" src="'+esc(oppCrest)+'"><div class="tn" style="color:'+TH.ink+'">'+esc(opp)+'</div></div>'+
        '</div>'+
        '<div class="cover-meta" style="position:relative;z-index:1">'+
          '<div class="m"><div class="l" style="color:'+TH.accent+'">Date</div><div class="v" style="color:'+TH.ink+'">'+esc(shortDate(d.date)||'2026-27')+'</div></div>'+
          '<div class="m"><div class="l" style="color:'+TH.accent+'">Kick-off</div><div class="v" style="color:'+TH.ink+'">'+esc(to12(d.kickoff))+'</div></div>'+
          '<div class="m"><div class="l" style="color:'+TH.accent+'">Venue</div><div class="v" style="font-size:19px;color:'+TH.ink+'">'+esc(venue)+'</div></div>'+
        '</div>'+
      '</div>'+
      '<div class="cover-bottom" style="background:'+TH.accent+';color:'+TH.accentInk+'"><span>The Lane · Yellow Army · Est. 1933</span><span>raynerslanefc.co.uk</span></div>'+
    '</div>');

    // Editorial page — renders only if the editor wrote something (never half-filled).
    function edPage(kick,title,text,extra){ if(!lines(text).length) return; P.push('<div class="page">'+banner(kick,title)+(extra||'')+'<div class="body">'+notes(text)+'</div>'+foot()+'</div>'); }

    /* CLUB INFORMATION */
    var OFF = club.officials||{};
    P.push('<div class="page page--edit">'+ banner('The Club','Rayners Lane FC')+
      '<div class="tiles" style="grid-template-columns:repeat(4,1fr);margin-bottom:14px"><div class="tile"><div class="n">1933</div><div class="l">Founded</div></div><div class="tile"><div class="n">5</div><div class="l">Our Step</div></div><div class="tile"><div class="n">Harrow</div><div class="l">Middlesex</div></div><div class="tile"><div class="n">3G</div><div class="l">Yellow Army</div></div></div>'+
      (lines(d.clubInfo).length ? '<div class="body">'+notes(d.clubInfo)+'</div>' : '<div class="body"><p>Rayners Lane FC has been at the heart of Harrow since 1933. Operated by Rayners Lane Football Club Limited (Company No. 17110511) and playing at Tithe Farm, the club plays in yellow and green and is proudly known as “The Lane.” We are an FA Charter Standard Community Club, affiliated to Middlesex County FA, competing in the Combined Counties Premier Division North at Step 5 of the National League System.</p></div>')+
      '<div class="grid2" style="margin-top:6px">'+
        '<div class="card g"><div class="k">Our Ground</div><div class="t">'+esc(venue)+'<br>'+esc(d.address||'151 Rayners Lane, Harrow HA2 0XH')+'</div></div>'+
        '<div class="card y"><div class="k">Online</div><div class="t">raynerslanefc.co.uk<br>@RaynersLaneFC &middot; @raynerslanefc</div></div>'+
        '<div class="card g"><div class="k">Contact</div><div class="t">info@raynerslanefc.co.uk</div></div>'+
        '<div class="card y"><div class="k">Safeguarding &amp; Welfare</div><div class="t">Club Welfare Officer: <b>'+esc(OFF.welfareOfficer||'see Club Directory')+'</b><br>Concerns: info@raynerslanefc.co.uk &middot; NSPCC 0808 800 5000 &middot; Emergency 999</div></div>'+
      '</div>'+ foot()+'</div>');

    /* 2 — WELCOME & MANAGER'S NOTES */
    if (lines(d.welcomeNotes).length || lines(d.managerNotes).length || lines(d.lookingForward).length) {
      P.push('<div class="page page--edit">'+ banner('From The Lane','Welcome to Tithe Farm')+
        '<div class="lead">'+esc(niceDate(d.date))+' &middot; Kick-off '+esc(to12(d.kickoff))+' &middot; '+esc(venue)+'</div>'+
        (lines(d.welcomeNotes).length?'<div class="body">'+notes(d.welcomeNotes)+'</div>':'')+
        (lines(d.managerNotes).length?'<div class="divider"><span class="lbl">From the Dugout</span></div><div class="body">'+notes(d.managerNotes)+'</div>':'')+
        (lines(d.lookingForward).length?'<div class="divider"><span class="lbl">Looking Forward</span></div><div class="body">'+notes(d.lookingForward)+'</div>':'')+
        foot()+'</div>');
    }

    /* 3 — TODAY'S VISITORS */
    if (lines(d.oppSummary).length || lines(d.headToHead).length) {
      P.push('<div class="page page--edit">'+ banner('Today’s Visitors', opp)+
        '<div style="display:flex;align-items:center;gap:16px;margin-bottom:14px"><img src="'+esc(oppCrest)+'" style="width:88px;height:88px;object-fit:contain">'+
          '<div><div class="eyebrow">Rayners Lane FC vs</div><div style="font-family:var(--fd);font-size:34px;letter-spacing:.5px;color:var(--ink);line-height:.95">'+esc(opp)+'</div><div class="muted body">'+esc(comp)+'</div></div></div>'+
        (lines(d.oppSummary).length?'<div class="body">'+notes(d.oppSummary)+'</div>':'')+
        (lines(d.headToHead).length?'<div class="divider"><span class="lbl">Head to Head</span></div><div class="body">'+notes(d.headToHead)+'</div>':'')+
        foot()+'</div>');
    }

    /* OPPOSITION FOCUS (scouting) */
    var oppFacts=[ d.oppFounded?['Founded',d.oppFounded]:null, d.oppGround?['Ground',d.oppGround]:null, d.oppManager?['Manager',d.oppManager]:null ].filter(Boolean);
    if (oppFacts.length || lines(d.oppOnesToWatch).length) {
      P.push('<div class="page page--edit">'+ banner('Scouting Report', opp)+
        (oppFacts.length?'<div class="grid2" style="grid-template-columns:repeat('+Math.min(oppFacts.length,3)+',1fr);margin-bottom:14px">'+oppFacts.map(function(f){return '<div class="card g"><div class="k">'+f[0]+'</div><div class="t">'+esc(f[1])+'</div></div>';}).join('')+'</div>':'')+
        (lines(d.oppOnesToWatch).length?'<div class="divider"><span class="lbl">Ones to Watch</span></div><div class="body">'+notes(d.oppOnesToWatch)+'</div>':'')+

    }
    /* MATCH PREVIEW (storylines + key players) */
    if (lines(d.storylines).length || lines(d.keyPlayers).length) {
      P.push('<div class="page page--edit">'+ banner('Today’s Match','The Preview')+
        (lines(d.storylines).length?'<div class="body">'+notes(d.storylines)+'</div>':'')+
        (lines(d.keyPlayers).length?'<div class="divider"><span class="lbl">Lane Players to Watch</span></div><div class="body">'+notes(d.keyPlayers)+'</div>':'')+
        foot()+'</div>');
    }

    /* 4 — TEAM SHEETS */
    function tsList(text){ var L=lines(text); if(!L.length) return ''; return '<div class="ts-list">'+L.map(function(l){ var m=l.match(/^\s*(\d+)[\.\)]?\s+(.*)$/); return '<div class="ts-row">'+(m?'<span class="n">'+m[1]+'</span><span>'+esc(m[2])+'</span>':'<span>'+esc(l)+'</span>')+'</div>'; }).join('')+'</div>'; }
    /* ALWAYS RENDERED. This page carries the three things the League's published
       minimum asks a matchday programme to contain — both sides' players, the
       colours they will play in, and the match officials. It used to appear
       only if somebody had typed a line-up into the form, which meant the
       entire required set could silently vanish from an edition that was
       otherwise finished. An empty section that says "confirmed at kick-off" is
       honest; a missing page is not. */
    {
      /* THE COLOURS THE TEAMS WILL PLAY IN.
         The League's published minimum for a matchday programme is the players
         of both sides with their playing numbers, the colours the teams will
         play in, and the match officials. Two of those three were here. The
         colours were absent from the programme entirely — found by auditing the
         document against the rule rather than against our own assumptions.

         Ours come from data/config.json, stored once, because nobody should
         retype their own club's kit every fortnight. The opposition's are
         confirmed per edition. Unknown prints "To be confirmed" — never a
         guess, because turning up in the wrong colours is a real problem for a
         real referee. */
      function kitStrip(label, k){
        var parts = k ? [['Shirt',k.shirt],['Shorts',k.shorts],['Socks',k.socks]] : [];
        var cells = parts.map(function(p){
          var v=p[1]||null, nm=(v&&(v.name||v))||'';

          return '<span class="kit-i">'+(hex?'<i style="background:'+esc(hex)+'"></i>':'')+
                 '<b>'+esc(p[0])+'</b> '+esc(nm)+'</span>';
        }).filter(Boolean);
        // An unrecorded colour is unknown, not a blank. Saying so is the whole
        // point — the goalkeeper's colours were briefly invented as green here,
        // which is precisely the plausible detail that reaches print unchallenged.
        var gkName = k && k.goalkeeper && (k.goalkeeper.name || k.goalkeeper);
        cells.push('<span class="kit-i"><b>GK</b> ' +
          (gkName ? esc(gkName) : '<em class="kit-tbc">To be confirmed</em>') + '</span>');
        if(!parts.filter(function(p){ return p[1] && (p[1].name||p[1]); }).length){
          return '<div class="kit-row"><span class="kit-l">'+esc(label)+'</span>'+
                 '<span class="kit-tbc">To be confirmed</span></div>';
        }
        return '<div class="kit-row"><span class="kit-l">'+esc(label)+'</span>'+cells.join('')+'</div>';
      }
      var ourKit = (d.isHome===false) ? (cfgKit && cfgKit.away) : (cfgKit && cfgKit.home);
      var oppKit = d.oppKit || null;

      /* The officials, on the page the rule expects them on rather than buried
         in matchday information. Entered once by the Secretary against the
         fixture; never invented here. */
      var offRows = [['Referee', d.referee], ['Assistant', d.assistant1],
                     ['Assistant', d.assistant2], ['Fourth Official', d.fourthOfficial]]
        .filter(function(r){ return (r[1]||'').trim(); });

      P.push('<div class="page page--roster">'+ banner('Today’s Teams','Team Sheets')+
        '<div class="grid2">'+
          '<div><div class="ts-team">Rayners Lane</div>'+(tsList(d.homeXI)||'<div class="ts-list"><div class="ts-row muted">Confirmed at kick-off.</div></div>')+
            (lines(d.homeSubs).length?'<div class="divider"><span class="lbl">Substitutes</span></div>'+tsList(d.homeSubs):'')+
            ((d.staff||'').trim()?'<div class="card g" style="margin-top:12px"><div class="k">Management</div><div class="t">'+esc(d.staff)+'</div></div>':'')+'</div>'+
          '<div><div class="ts-team away">'+esc(opp)+'</div>'+(tsList(d.awayLineup)||'<div class="ts-list"><div class="ts-row muted">Confirmed at kick-off.</div></div>')+'</div>'+
        '</div>'+

        '<div class="kit-block">'+ kitStrip('Rayners Lane', ourKit) + kitStrip(opp, oppKit) +'</div>'+
        '<div class="divider"><span class="lbl">Match Officials</span></div>'+
        (offRows.length
          ? '<div class="off-block">'+offRows.map(function(r){
              return '<span class="off-i"><b>'+esc(r[0])+'</b> '+esc(r[1])+'</span>'; }).join('')+'</div>'
          : '<div class="off-block"><span class="off-tbc">Appointments to be confirmed</span></div>')+
        foot()+'</div>');
    }

    /* Each player's season figures, keyed by the club's own player id.
       Declared HERE, at the top of render, for two reasons that both bit.

       It must not be called `seasonStats`. That is the function above which
       computes the club's season summary. A local var of the same name shadows
       it for the whole of render — `var` is function-scoped, not block-scoped —
       so the Season So Far page called an object and threw. With no catch on
       the render chain, the page sat on "Building…" for ever and every printed
       programme silently lost that page.

       And it must not live inside the `if (club.players...)` block below. The
       Statistics Centre further down reads it unconditionally, so on a squad
       with no players the hoisted var was undefined and Object.keys() threw. */
    var playerSeason = (d.playerStats && d.playerStats.players) || {};

    /* SQUAD PROFILES (player cards) */
    if (club.players && club.players.length) {
      /* ═══ THE FIRST TEAM — ONE PAGE, ONE DIRECTORY ═════════════════════════
         Two decisions the club made, and both simplify this a great deal.

         NO INDIVIDUAL STATISTICS. Appearances, goals, minutes and clean sheets
         are gone from the squad entirely — not replaced with zeros, removed.
         Nineteen of twenty-six players had no confirmed Full-Time identity, so
         the honest render was a page of em dashes, and a page of em dashes is
         worse than no column at all. Team figures survive on Season So Far,
         where they are complete and verified. The statistics service itself is
         untouched and still serves Match Centre.

         THE WHOLE SQUAD ON ONE SHEET. Profile cards at three across needed five
         pages for twenty-six players. A squad is not twenty-six advertisements;
         it is a roster, and a roster belongs on one page where you can see the
         team. Five across, compact head-and-shoulders crop, number, name,
         position. Nothing else fits and nothing else is needed. */
      var pc = club.players.map(function(p){
        var no=p.number||p.no||'', ph=p.photo||p.image||'';
        // A player without a photograph gets a designed identity graphic in
        // exactly the same footprint, so a real headshot drops straight in.
        var phInner = ph
          ? '<img src="'+esc(ph)+'">'
          : '<span class="crestcrop"></span><span class="ini">'+esc(initials(p.name))+'</span>'+
            '<span class="soon">Photo<br>to follow</span>';
        return '<div class="sq"><div class="sq-ph'+(ph?'':' sq-ph--none')+'">'+phInner+'</div>'+
          (no ? '<span class="sq-no">'+esc(no)+'</span>' : '')+
          '<div class="sq-nm">'+esc(p.name||'')+'</div>'+
          '<div class="sq-po">'+esc(p.position||p.pos||'')+'</div></div>';
      });

      /* ONE PAGE. squadPages() is still used, but with the capacity of the
         compact directory grid rather than the old profile cards — 30 to a
         sheet at five across. A roster only spills onto a second page if the
         club genuinely carries more than thirty players, and if it ever does,
         the balancing still applies rather than orphaning the remainder. */
      var pages = squadPages(pc.length, 30);
      var at = 0;
      pages.forEach(function (n, idx) {
        var chunk = pc.slice(at, at + n); at += n;
        P.push('<div class="page page--roster">' +
          banner('First Team', idx === 0 ? 'The Squad' : 'The Squad continued') +
          '<div class="sq-grid">' + chunk.join('') + '</div>' + foot() + '</div>');
      });
    }
    /* CAPTAIN'S NOTES */

        '<div class="card y"><div class="k">Spectator Conduct</div><div class="t">Zero tolerance to abuse and discrimination. Support your team positively and respect players, officials and visiting supporters.</div></div>'+
        '<div class="card g"><div class="k">Data Protection</div><div class="t">'+esc(d.dataProtection||'Personal data the club collects (e.g. memberships) is used only to run those services and never sold. See our Policies page at raynerslanefc.co.uk.')+'</div></div>'+
        '<div class="card y"><div class="k">Programme</div><div class="t">Produced by Rayners Lane FC. © Rayners Lane FC. Line-ups subject to late change. Images © the club &amp; contributors.</div></div>'+
      '</div>'+ foot()+'</div>');

    /* 13 — BACK PAGE: fixtures + statements + QR */
    function dt(f){ return new Date(f.date+'T'+(f.kickoff||'15:00')+':00').getTime(); }
    var upcoming = fixtures.slice().filter(function(f){ return f.us==null||f.them==null; }).sort(function(a,b){return dt(a)-dt(b);}).slice(0,6);
    var fixHTML = upcoming.length
      ? '<div class="ts-list">'+upcoming.map(function(f){ return '<div class="ts-row"><span style="flex:1">'+esc(shortDate(f.date))+' &middot; Rayners Lane '+(f.isHome===false?'@ ':'v ')+esc(f.opponent||'TBC')+'</span><span class="n" style="min-width:auto;color:var(--ink)">'+esc(f.kickoff||'15:00')+'</span></div>'; }).join('')+'</div>'
      : '<div class="card g"><div class="t">Fixtures are released soon.</div></div>';
    P.push('<div class="page page--data">'+ banner('Coming Up','Fixtures & The Club')+ fixHTML +
      '<div class="divider"><span class="lbl">The Club Stands For</span></div>'+
      '<div class="stmt"><b>Respect &amp; Fair Play</b>'+esc(d.respect||DEF.respect)+'</div>'+
      '<div class="stmt"><b>Safeguarding</b>'+esc(d.safeguarding||DEF.safe)+'</div>'+
      '<div class="stmt"><b>Equality &amp; Inclusion</b>'+esc(d.equality||DEF.equality)+'</div>'+
      '<div class="stmt"><b>Affiliation</b>'+esc(d.affiliation||DEF.affil)+'</div>'+
      '<div class="backqr"><div class="qr">'+qr(SITE+'/programme.html')+'</div>'+
        '<div class="body"><div class="eyebrow">Read it on your phone</div><p>Scan for the live digital programme — line-ups, table &amp; live score updates.</p>'+
        '<p><b>@RaynersLaneFC</b> on X &middot; <b>@raynerslanefc</b> on Instagram</p></div></div>'+
      foot()+'</div>');

    /* NEXT MATCH ADVERT (inside back cover) */
    /* ── NEXT MATCH, AND NEXT AT THE LANE — two different things ─────────
       THE BUG THIS REPLACES. The old code took every fixture without a score,
       filtered to home games, sorted, and printed the first one as "Next at
       The Lane". Three faults, and the first is the worst:

       1. It never excluded the edition's OWN fixture, so the Hilltop programme
          advertised Hilltop as the next game at the ground people were stood in.
       2. There was no NEXT MATCH concept at all — only next HOME match. An away
          trip was silently skipped in favour of the next prettier home page.
       3. "No score yet" was treated as "still to be played", so a postponed or
          abandoned fixture would be promoted as upcoming.

       NEXT MATCH follows the calendar. Home or away is just the state of that
       fixture, read from the canonical `isHome` field — never inferred from a
       display string. NEXT AT THE LANE is the next HOME fixture, and only earns
       its own block when it is not already the next match. */
    function fxKey(f){ return String(f.date||'').slice(0,10) + 'T' + String(f.kickoff||'00:00'); }
    function fxIsHome(f){ return f.isHome !== false; }
    function upcomingAfter(list, afterDate){
      var cut = String(afterDate||'').slice(0,10);
      return (list||[]).filter(function(f){
        if (f.us != null && f.them != null) return false;              // played
        if (/postpon|cancel|abandon|void|off/i.test(String(f.status||''))) return false;
        var d = String(f.date||'').slice(0,10);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return false;
        return cut ? d > cut : true;                                    // strictly after this edition
      }).sort(function(a,b){ return fxKey(a).localeCompare(fxKey(b)); });
    }

    /* Frozen for a published edition, live for a draft — the same rule the
       player figures and the league table follow. An edition printed in August
       must still say what August's next fixture was, even if it was later
       postponed. The website carries the correction; the programme is history. */
    var upcoming2 = upcomingAfter(fixtures, d.date);
    var nextMatch = d.published ? (d.nextFixture || null)     : (upcoming2[0] || null);
    var nextHome  = d.published ? (d.nextHomeFixture || null) : (upcoming2.filter(fxIsHome)[0] || null);

    if (nextMatch) {
      var away = !fxIsHome(nextMatch);
      var nmVenue = away ? (nextMatch.venue || '') : (nextMatch.venue || venue);
      P.push('<div class="page' + (away ? ' nx-away' : '') + '">' +
        banner(away ? 'On The Road' : 'Don’t Miss It', 'Next Match') +
        '<div class="nx">' +
          '<div class="nx-state">' + (away ? 'Away' : 'Home') + ' &middot; ' +
            esc(nextMatch.competition || '') + '</div>' +
          '<div class="nx-fix"><span class="nx-us">Rayners Lane</span>' +
            '<span class="nx-vs">' + (away ? '@' : 'v') + '</span>' +
            '<span class="nx-them">' + esc(nextMatch.opponent || 'TBC') + '</span></div>' +
          '<div class="nx-meta">' + esc(shortDate(nextMatch.date)) + ' &middot; ' +
            esc(to12(nextMatch.kickoff)) +
            (nmVenue ? ' &middot; ' + esc(nmVenue) : ' &middot; Venue to be confirmed') + '</div>' +
          (away
            ? '<div class="nx-note">Rayners Lane are away from home. Follow the score on our channels.</div>'
            : '<div class="nx-cta">PAY ON THE GATE &middot; BAR OPEN &middot; ALL WELCOME</div>') +
        '</div>' +
        /* Only when the next home game is NOT the next game — otherwise this
           would print the same fixture twice under two headings. */
        (nextHome && nextHome.id !== nextMatch.id
          ? '<div class="divider"><span class="lbl">Next at The Lane</span></div>' +
            '<div class="nx-second"><b>Rayners Lane v ' + esc(nextHome.opponent || 'TBC') + '</b>' +
            '<span>' + esc(shortDate(nextHome.date)) + ' &middot; ' + esc(to12(nextHome.kickoff)) +
            ' &middot; ' + esc(nextHome.venue || venue) + '</span></div>'
          : '') +
        '<div class="cta-card" style="margin-top:16px"><div class="cta-qr">' + qr(SITE+'/fixtures.html') +
          '</div><div><div class="cta-h">Never miss a game</div><div class="body">Scan to add the whole season to your phone calendar. #UpTheLane</div></div></div>' +
        foot() + '</div>');
    }

    /* BACK COVER */
    P.push('<div class="page cover" style="background:linear-gradient(160deg,#14532d,#0b2a1a)">'+
      '<div class="cover-top" style="justify-content:center;align-items:center">'+
        '<img class="cover-badge" src="img/badge.png">'+
        '<div class="cover-kicker">Join the Yellow Army</div>'+
        '<div class="cover-title" style="font-size:52px">BE PART OF<br>THE LANE</div>'+
        '<div class="body" style="color:rgba(255,255,255,.85);max-width:380px;margin:14px auto 0;text-align:center">Free Lane membership, yellow hearts every game and rewards all season. Scan to join in a minute.</div>'+
        '<div style="margin:18px auto 0;background:#fff;padding:11px;width:150px;height:150px">'+qr(SITE+'/fan-zone.html')+'</div>'+
      '</div>'+
      '<div class="cover-bottom"><span>raynerslanefc.co.uk</span><span>@RaynersLaneFC · #UpTheLane</span></div>'+
    '</div>');

    document.getElementById('pages').innerHTML = P.join('');
    // Auto-fit safety net: a page is a fixed A4 sheet (297mm). If a long
    // manager's note / welcome / scouting write-up makes a page taller than one
    // sheet, its free-text (.body/.lead) is shrunk a touch until the page fits —
    // so nothing gets silently cut at the print boundary. Data pages (tables,
    // squad, tiles) are left alone; only free-text bodies flex. Runs once fonts
    // are ready so the measurement matches the printed output.
    (document.fonts && document.fonts.ready ? document.fonts.ready : Promise.resolve()).then(fitPages);
  }
  function fitPages() {
    var MAXH = 297 / 25.4 * 96 + 2; // one A4 sheet in px @96dpi (+2 tolerance)
    var pages = document.querySelectorAll('.page');
    for (var i = 0; i < pages.length; i++) {
      var pg = pages[i];
      var flex = pg.querySelectorAll('.body, .lead');
      if (!flex.length) continue;              // nothing free-text to shrink
      var pct = 100, guard = 0;
      while (pg.offsetHeight > MAXH && pct > 68 && guard < 60) {
        pct -= 2; guard++;
        for (var j = 0; j < flex.length; j++) flex[j].style.fontSize = pct + '%';
      }
    }
  }
})();
</script>
</body>
</html>
