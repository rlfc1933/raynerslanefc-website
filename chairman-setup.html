<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set up the Chairman account | Rayners Lane FC</title>
<meta name="robots" content="noindex,nofollow,noarchive">
<link rel="icon" type="image/png" href="img/badge.png">
<link rel="preload" href="fonts/manrope-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/bebas-neue-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/fonts.css">
<!--
  THE FIRST CHAIRMAN, WITHOUT A TOKEN CHANGING HANDS.

  The previous first-Chairman route minted an invitation token that somebody had
  to copy out of a terminal and carry to Pete — a live credential in transit,
  seen by whoever ran the command.

  Here Pete types his own password straight into this page. Nothing is copied,
  nothing is handed over, and nobody else ever sees it. The password is sent
  once, hashed on the server, and never logged.

  Every gate lives on the server (netlify/functions/staff-chairman-setup.js).
  This page is a form; it decides nothing.
-->
<style>
  :root{ --y:#FFD100; --bg:#080808; --c:#141414; --br:#242424; --w:#F5F3ED;
         --gr:#8F8F8F; --su:#22C55E; --re:#EF4444;
         --fd:var(--font-display); --fc:var(--font-body); }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--w);font-family:var(--fc);min-height:100vh;
       display:flex;align-items:center;justify-content:center;padding:24px;line-height:1.6}
  .card{width:100%;max-width:440px;background:var(--c);border:1px solid var(--br);
        border-radius:16px;padding:28px}
  .badge{display:block;width:66px;height:66px;margin:0 auto 16px;border-radius:50%}
  h1{font-family:var(--fd);font-size:29px;letter-spacing:.6px;font-weight:400;
     text-align:center;line-height:1.1;margin-bottom:6px}
  .sub{text-align:center;color:var(--gr);font-size:14px;margin-bottom:20px}
  .who{text-align:center;border:1px solid rgba(255,209,0,.35);background:rgba(255,209,0,.06);
       border-radius:11px;padding:12px;margin-bottom:18px}
  .who b{display:block;font-size:17px;color:var(--w)}
  .who span{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--y)}
  label{display:block;font-size:11px;font-weight:800;letter-spacing:.11em;
        text-transform:uppercase;color:var(--gr);margin:14px 0 5px}
  input{width:100%;background:var(--bg);border:1px solid var(--br);border-radius:9px;
        color:var(--w);font-family:var(--fc);font-size:16px;padding:13px}
  input:focus{outline:none;border-color:var(--y)}
  .hint{font-size:12px;color:var(--gr);margin-top:5px}
  button{width:100%;background:var(--y);color:#0d0d0d;border:none;border-radius:10px;
         font-family:var(--fc);font-size:16px;font-weight:800;padding:15px;
         cursor:pointer;margin-top:20px}
  button:disabled{opacity:.5;cursor:not-allowed}
  .msg{margin-top:14px;font-size:14px;border-radius:10px;padding:13px;display:none}
  .msg.err{display:block;color:#FFB4B4;border:1px solid rgba(239,68,68,.4);background:rgba(239,68,68,.08)}
  .msg.ok{display:block;color:#B6F0CB;border:1px solid rgba(34,197,94,.4);background:rgba(34,197,94,.08)}
  .closed{text-align:center;color:var(--gr);font-size:14px}
  .timer{text-align:center;font-size:12px;color:var(--gr);margin-top:14px}
</style>
</head>
<body>

<div class="card">
  <img class="badge" src="img/badge.png" alt="Rayners Lane FC">
  <h1>Set up the Chairman account</h1>
  <p class="sub">You choose your own password. Nobody at the club will ever see it &mdash; not the committee, and not whoever set this up for you.</p>
  <div id="body"><p class="closed">Checking&hellip;</p></div>
</div>

<script>
(function () {
  'use strict';
  var FN = '/.netlify/functions/staff-chairman-setup';
  var box = document.getElementById('body');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function closed(msg) {
    box.innerHTML = '<p class="closed">' + esc(msg ||
      'Chairman setup is closed. Accounts are created in the portal under Staff Access.') + '</p>';
  }

  function form(info) {
    box.innerHTML =
      '<div class="who"><span>Setting up</span><b>' + esc(info.name || 'Pete Singh') + '</b>' +
        esc(info.title || 'Chairman') + '</div>' +
      '<label for="pin">Club access code</label>' +
      '<input id="pin" type="password" inputmode="numeric" autocomplete="off" placeholder="The code you use to open the portal">' +
      '<label for="pw">Choose your password</label>' +
      '<input id="pw" type="password" autocomplete="new-password" placeholder="At least 10 characters">' +
      '<p class="hint">Make it long rather than complicated. Three unrelated words is stronger than one word with symbols in it.</p>' +
      '<label for="pw2">Type it again</label>' +
      '<input id="pw2" type="password" autocomplete="new-password">' +
      '<button id="go" type="button">Create my account</button>' +
      '<div class="msg" id="msg"></div>' +
      '<p class="timer" id="timer"></p>';

    var msg = document.getElementById('msg');
    var go = document.getElementById('go');

    function show(kind, text) { msg.className = 'msg ' + kind; msg.textContent = text; }

    go.addEventListener('click', function () {
      var pin = document.getElementById('pin').value;
      var pw = document.getElementById('pw').value;
      var pw2 = document.getElementById('pw2').value;
      if (!pin) { show('err', 'Enter the club access code.'); return; }
      if (pw.length < 10) { show('err', 'Please choose a password of at least 10 characters.'); return; }
      if (pw !== pw2) { show('err', 'Those two passwords do not match.'); return; }

      go.disabled = true; show('ok', 'Saving…');
      fetch(FN, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pin, username: 'pete', password: pw, confirm: pw2 })
      }).then(function (r) { return r.json(); }).then(function (j) {
        if (j && j.ok) {
          box.innerHTML = '<div class="msg ok" style="display:block">' +
            '<b>Your account is ready.</b><br>Open the portal, enter the club code, ' +
            'choose <b>Pete Singh</b> and sign in with the password you just chose.' +
            '</div><button type="button" onclick="location.href=\'admin.html\'">Go to the portal</button>';
        } else {
          go.disabled = false;
          show('err', (j && j.error) || 'That could not be saved. Please try again.');
        }
      }).catch(function () {
        go.disabled = false;
        show('err', 'No connection. Check your signal and try again.');
      });
    });

    // Count the window down so nobody is surprised by it closing mid-typing.
    if (info.expiresInMs > 0) {
      var ends = Date.now() + info.expiresInMs;
      var t = document.getElementById('timer');
      (function tick() {
        var left = Math.max(0, ends - Date.now());
        var m = Math.floor(left / 60000), s = Math.floor((left % 60000) / 1000);
        t.textContent = left > 0
          ? 'This page stays open for another ' + m + 'm ' + (s < 10 ? '0' : '') + s + 's.'
          : 'This window has closed. Ask for it to be opened again.';
        if (left > 0) setTimeout(tick, 1000);
      }());
    }
  }

  fetch(FN, { cache: 'no-store' })
    .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
    .then(function (res) {
      if (res.s === 200 && res.j && res.j.ok) form(res.j);
      else closed(res.j && res.j.error);
    })
    .catch(function () { closed('This page could not be reached. Try again shortly.'); });
}());
</script>
</body>
</html>
