  <style>
    /* ── MAGAZINE STYLES ── */
    :root { --prog-yellow:#FFD100; --prog-green:#1A5C32; }

    /* Cover - full viewport magazine cover */
    .prog-cover-wrap {
      min-height:100svh; background:var(--black);
      display:flex; flex-direction:column;
      position:relative; overflow:hidden;
    }
    .prog-cover-bg {
      position:absolute; inset:0;
      background:linear-gradient(160deg,#060E08 0%,#0A0A0A 40%,#0A1A10 100%);
    }
    .prog-cover-pitch {
      position:absolute; inset:0; opacity:0.07;
      background-image:
        linear-gradient(rgba(255,255,255,.6) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.6) 1px, transparent 1px);
      background-size:80px 80px;
    }
    .prog-cover-glow {
      position:absolute; top:-20%; left:50%; transform:translateX(-50%);
      width:800px; height:600px;
      background:radial-gradient(ellipse,rgba(255,209,0,.12) 0%,transparent 70%);
    }
    .prog-cover-content {
      position:relative; z-index:2; flex:1;
      display:flex; flex-direction:column;
    }
    /* Cover top bar */
    .prog-cover-topbar {
      background:var(--yellow); padding:10px 40px;
      display:flex; align-items:center; justify-content:space-between;
    }
    .prog-cover-topbar-left {
      font-family:var(--font-d); font-size:14px; letter-spacing:.12em; color:var(--black);
    }
    .prog-cover-topbar-right {
      font-family:var(--font-c); font-size:11px; font-weight:700;
      letter-spacing:.14em; text-transform:uppercase; color:rgba(0,0,0,.6);
    }
    /* Cover main area */
    .prog-cover-main {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      padding:40px 40px 20px; gap:0;
    }
    /* Competition label */
    .prog-comp-label {
      font-family:var(--font-c); font-size:12px; font-weight:700;
      letter-spacing:.2em; text-transform:uppercase;
      color:var(--muted); margin-bottom:32px;
    }
    /* VS block */
    .prog-vs-block {
      display:grid; grid-template-columns:1fr auto 1fr;
      align-items:center; gap:32px; width:100%; max-width:900px;
    }
    .prog-team-block { display:flex; flex-direction:column; align-items:center; gap:16px; }
    .prog-team-badge {
      width:140px; height:140px; object-fit:contain;
      filter:drop-shadow(0 8px 32px rgba(0,0,0,.6));
    }
    .prog-team-name {
      font-family:var(--font-d); font-size:clamp(18px,2.5vw,28px);
      letter-spacing:.06em; color:var(--white); text-align:center;
      line-height:1.1;
    }
    .prog-vs-center {
      text-align:center;
    }
    .prog-vs-text {
      font-family:var(--font-d); font-size:clamp(80px,12vw,160px);
      letter-spacing:-.02em; color:var(--yellow); line-height:1;
    }
    .prog-vs-divider {
      width:2px; height:100px; background:rgba(255,209,0,.2);
      margin:0 auto 8px;
    }
    /* Cover date bar */
    .prog-cover-datebar {
      background:rgba(255,255,255,.04); border-top:1px solid rgba(255,255,255,.08);
      border-bottom:1px solid rgba(255,255,255,.08);
      padding:16px 40px;
      display:flex; align-items:center; justify-content:center; gap:32px;
      flex-wrap:wrap;
    }
    .prog-cover-detail {
      display:flex; flex-direction:column; align-items:center; gap:3px;
    }
    .prog-cover-detail-label {
      font-family:var(--font-c); font-size:9px; font-weight:700;
      letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
    }
    .prog-cover-detail-val {
      font-family:var(--font-c); font-size:15px; font-weight:700;
      letter-spacing:.06em; color:var(--white);
    }
    /* Cover bottom bar */
    .prog-cover-bottom {
      background:var(--green); padding:14px 40px;
      display:flex; align-items:center; justify-content:space-between;
      border-top:3px solid var(--yellow);
    }
    .prog-cover-bottom-brand {
      display:flex; align-items:center; gap:12px;
    }
    .prog-cover-bottom-badge {
      width:36px; height:36px; object-fit:contain;
    }
    .prog-cover-bottom-name {
      font-family:var(--font-d); font-size:20px;
      letter-spacing:.06em; color:white;
    }
    .prog-cover-bottom-social {
      font-family:var(--font-c); font-size:11px; font-weight:700;
      letter-spacing:.12em; text-transform:uppercase; color:rgba(255,255,255,.82);
    }
    /* Scroll indicator */
    .prog-scroll-hint {
      position:absolute; bottom:80px; left:50%; transform:translateX(-50%);
      z-index:3; display:flex; flex-direction:column; align-items:center; gap:6px;
      animation:bounce 2s infinite;
    }
    @keyframes bounce { 0%,100%{transform:translateX(-50%) translateY(0)} 50%{transform:translateX(-50%) translateY(6px)} }
    .prog-scroll-hint span {
      font-family:var(--font-c); font-size:10px; font-weight:700;
      letter-spacing:.16em; text-transform:uppercase; color:var(--muted);
    }

    /* ── MAGAZINE BODY ── */
    .prog-magazine { background:var(--black); }

    /* Section header - magazine style */
    .mag-section {
      padding:64px 0; border-bottom:1px solid var(--border);
    }
    .mag-section:last-child { border-bottom:none; }
    .mag-section-inner { max-width:1340px; margin:0 auto; padding:0 40px; }

    .mag-label {
      font-family:var(--font-c); font-size:10px; font-weight:700;
      letter-spacing:.22em; text-transform:uppercase; color:var(--yellow);
      display:block; margin-bottom:8px;
    }
    .mag-title {
      font-family:var(--font-d); font-size:clamp(40px,5vw,72px);
      letter-spacing:.03em; color:var(--white); line-height:.95;
      margin-bottom:8px;
    }
    .mag-title span { color:var(--yellow); }
    .mag-rule { width:48px; height:4px; background:var(--yellow); margin:16px 0 28px; }
    .prog-body-text {
      font-family:var(--font-b); font-size:17px; color:var(--lgrey);
      line-height:1.9; margin-bottom:18px; max-width:720px;
    }
    .prog-placeholder {
      font-family:var(--font-b); font-size:16px; color:var(--grey);
      font-style:italic; line-height:1.8;
    }

    /* Manager Notes - magazine pull quote */
    .mag-manager-layout {
      display:grid; grid-template-columns:260px 1fr; gap:40px; align-items:start;
    }
    .mag-manager-card {
      background:linear-gradient(160deg,var(--green),#060E06);
      padding:28px; border-top:4px solid var(--yellow);
    }
    .mag-manager-name {
      font-family:var(--font-d); font-size:36px; letter-spacing:.04em;
      color:var(--white); margin-bottom:6px;
    }
    .mag-manager-role {
      font-family:var(--font-c); font-size:11px; font-weight:700;
      letter-spacing:.14em; text-transform:uppercase; color:var(--yellow);
    }
    .mag-manager-img {
      width:100%; aspect-ratio:3/4; object-fit:cover;
      margin-bottom:16px; filter:grayscale(0.3);
    }
    .mag-pull-quote {
      font-family:var(--font-d); font-size:clamp(24px,3vw,40px);
      letter-spacing:.02em; color:var(--white); line-height:1.2;
      border-left:5px solid var(--yellow); padding-left:24px;
      margin-bottom:28px;
    }

    /* Welcome section - split layout */
    .mag-welcome-layout {
      display:grid; grid-template-columns:1fr 1fr; gap:2px;
    }
    .mag-welcome-left {
      background:var(--card); padding:48px 40px;
    }
    .mag-welcome-right {
      background:var(--green); padding:48px 40px;
      display:flex; flex-direction:column; align-items:center;
      justify-content:center; text-align:center; gap:20px;
    }
    .mag-opp-logo {
      width:120px; height:120px; object-fit:contain;
      filter:drop-shadow(0 8px 24px rgba(0,0,0,.5));
    }
    .mag-opp-name {
      font-family:var(--font-d); font-size:36px; letter-spacing:.04em;
      color:var(--white); line-height:1.1;
    }

    /* Squad - magazine grid */
    .squad-pos-block { margin-bottom:32px; }
    .squad-pos-label {
      font-family:var(--font-c); font-size:10px; font-weight:700;
      letter-spacing:.2em; text-transform:uppercase; color:var(--yellow);
      border-bottom:1px solid var(--border); padding-bottom:8px; margin-bottom:10px;
    }
    .squad-player-row {
      display:flex; align-items:center; gap:14px;
      padding:8px 14px; margin-bottom:2px;
      background:rgba(255,255,255,.02); transition:background .15s;
    }
    .squad-player-row:hover { background:rgba(255,255,255,.05); }
    .squad-player-num {
      font-family:var(--font-d); font-size:28px; color:var(--yellow-dim);
      width:36px; text-align:right; flex-shrink:0; line-height:1;
    }
    .squad-player-name {
      font-family:var(--font-c); font-size:16px; font-weight:800;
      letter-spacing:.04em; color:var(--white); flex:1;
    }
    .squad-player-pos {
      font-family:var(--font-c); font-size:10px; font-weight:600;
      letter-spacing:.12em; text-transform:uppercase; color:var(--grey);
    }
    .mag-squad-layout {
      display:grid; grid-template-columns:1fr 1fr; gap:32px;
    }

    /* Sponsors - double page style */
    .mag-sponsors-grid {
      display:grid; grid-template-columns:repeat(auto-fill,minmax(min(240px,100%),1fr));
      gap:2px; margin-bottom:24px;
    }
    .mag-sponsor-card {
      background:var(--card); padding:40px 32px; text-align:center;
      border-top:4px solid var(--border); transition:background .2s;
    }
    .mag-sponsor-card:hover { background:var(--card2); }
    .mag-sponsor-card.featured { border-top-color:var(--yellow); }
    .mag-sponsor-logo {
      font-family:var(--font-d); font-size:28px; letter-spacing:.04em;
      color:var(--white); margin-bottom:8px;
    }
    .mag-sponsor-role {
      font-family:var(--font-c); font-size:11px; font-weight:700;
      letter-spacing:.14em; text-transform:uppercase; color:var(--yellow);
      margin-bottom:8px;
    }
    .mag-sponsor-note {
      font-family:var(--font-b); font-size:13px; color:var(--grey); line-height:1.5;
    }
    .mag-sponsor-cta {
      background:linear-gradient(135deg,var(--green),#060E06);
      padding:40px; text-align:center; border-top:3px solid var(--yellow);
    }

    /* FWP embed magazine wrapper */
    .mag-fwp-wrap {
      background:var(--card); border:1px solid var(--border);
      overflow:hidden;
    }
    .mag-fwp-header {
      background:var(--card2); border-bottom:1px solid var(--border);
      padding:14px 20px;
      font-family:var(--font-c); font-size:11px; font-weight:700;
      letter-spacing:.14em; text-transform:uppercase; color:var(--grey);
      display:flex; align-items:center; justify-content:space-between;
    }

    /* Live data (league table + fixtures) — rendered from our own feed */
    .mag-live { padding:6px 0; }
    .mag-live-soon {
      padding:40px 24px; text-align:center;
      font-family:var(--font-c); font-size:13px; letter-spacing:.04em;
      color:var(--grey); line-height:1.6;
    }
    .mag-live table { width:100%; border-collapse:collapse; }
    .mag-live th {
      font-family:var(--font-c); font-size:9px; font-weight:700;
      letter-spacing:.12em; text-transform:uppercase; color:var(--grey);
      text-align:right; padding:10px 8px; border-bottom:1px solid var(--border);
    }
    .mag-live th:nth-child(2) { text-align:left; }
    .mag-live td {
      font-family:var(--font-c); font-size:13px; color:var(--white);
      text-align:right; padding:9px 8px; border-bottom:1px solid var(--border);
    }
    .mag-live td:nth-child(2) { text-align:left; font-weight:600; }
    .mag-live tr.me td { background:rgba(255,209,0,.1); color:var(--yellow); }
    .mag-live tr.me td:nth-child(2) { color:var(--yellow); font-weight:800; }
    .mag-live .mag-res {
      display:flex; align-items:center; justify-content:space-between;
      padding:13px 16px; border-bottom:1px solid var(--border);
      font-family:var(--font-c); font-size:13px; color:var(--white); letter-spacing:.02em;
    }
    .mag-live .mag-res:last-child { border-bottom:none; }
    .mag-live .mag-res b { font-family:var(--font-d); font-size:18px; letter-spacing:.06em; }

    /* Chairman block */
    .mag-chairman {
      background:var(--dark); border:1px solid var(--border);
      border-left:6px solid var(--yellow); padding:40px 48px;
    }
    .mag-chairman-quote {
      font-family:var(--font-d); font-size:clamp(24px,3vw,42px);
      letter-spacing:.02em; color:var(--white); line-height:1.15;
      margin-bottom:20px;
    }
    .mag-chairman-quote em { color:var(--yellow); font-style:normal; }

    @media(max-width:768px) {
      .prog-vs-block { grid-template-columns:1fr; gap:20px; }
      .prog-vs-center { order:-1; }
      .prog-vs-text { font-size:80px; }
      .prog-team-badge { width:100px; height:100px; }
      .mag-manager-layout { grid-template-columns:1fr; }
      .mag-welcome-layout { grid-template-columns:1fr; }
      .mag-squad-layout { grid-template-columns:1fr; }
      .mag-section-inner { padding:0 20px; }
      .prog-cover-topbar, .prog-cover-datebar,
      .prog-cover-bottom, .prog-cover-main { padding-left:20px; padding-right:20px; }
    }
  </style>
