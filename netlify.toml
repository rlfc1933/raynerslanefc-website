[build]
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# ── SERVER-SIDE SOURCE IS NOT A PUBLIC PAGE ─────────────────────────────────
# Netlify publishes the repository ROOT, because the site is plain HTML with no
# build step. That is what makes the club's editing model work — and it also
# meant every server-side file was downloadable as if it were a page:
#
#     https://raynerslanefc.co.uk/netlify/functions/lib/authz.js   → 200
#     https://raynerslanefc.co.uk/netlify/functions/lib/invitations.js → 200
#     https://raynerslanefc.co.uk/supabase/rls-check.sh            → 200
#
# No credential was ever in those files — every secret is read from the
# environment — so nothing was leaked. But the invitation and password PEPPER
# is a literal in lib/invitations.js, and a pepper that anybody can read adds
# nothing against an offline attack. The row-level-security scripts and the
# test suite also describe the shape of the club's data more helpfully than
# they should to a stranger.
#
# WHY A REDIRECT RATHER THAN MOVING THE PUBLISH DIRECTORY
# ------------------------------------------------------
# Moving the site into a subdirectory would mean relocating every HTML file,
# every asset path and the admin's own save paths (PATH_OK in save-data.js) in
# one change, with no build step to catch a mistake. A rule that returns 404
# for a handful of prefixes is a hundredth of the risk and is exactly as
# effective for the thing being fixed.
#
# THE LEADING DOT MATTERS
# -----------------------
# Functions are INVOKED at /.netlify/functions/<name> — with a dot. These
# rules match /netlify/... — without one. They are different paths, so
# blocking the source cannot break a single function call. There is a test
# that asserts exactly this, because getting it wrong would take the whole
# site's back end down.
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/tests/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

# The dependency manifest and lockfile describe the build, not the club.
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Guarantee the Sponsor Radar baked business snapshots are bundled with the
# radar-discover function (it require()s them, but this makes it bulletproof).
# These ship INSIDE the function bundle — not publicly served.
[functions."radar-discover"]
  included_files = ["netlify/functions/radar-data/**"]

# Serve the DYNAMIC sitemap (netlify/functions/sitemap.js) at /sitemap.xml.
# force=true so it wins over any static file; status 200 so it's a rewrite (the
# URL stays /sitemap.xml for crawlers).
# The club's own news feed. Pitchero used to provide one; when the club deleted
# that account the feed died with it. This is ours, at a proper URL.
[[redirects]]
  from = "/rss.xml"
  to = "/.netlify/functions/rss"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# ── LIVE MATCH SYNC (Football Web Pages) ────────────────────────────────────
# Pulls the live score, clock and match events server-side so no supporter's
# browser ever calls the data provider, and so a goal never triggers a build.
#
# CADENCE: the provider's own page refreshes every 30s (their refresh.min.js
# sets CHECKFORREFRESHEVERYSECS = 30). Netlify's scheduler cannot go below one
# minute, so this runs every minute — deliberately LIGHTER than the provider's
# own client, which is the defensible side to err on. A goal reaches the site
# within 60s worst case, and an unchanged poll costs a 204 with no body.
#
# The function refuses to call the provider at all unless FWP_SYNC_ENABLED is
# "true". That flag stays unset until Football Web Pages confirm the club may
# poll its own match embed. Scheduling it now is harmless: every run returns
# immediately with {enabled:false}.
[functions."fwp-sync"]
  schedule = "* * * * *"

# The football registry: season list, league table, line-ups and the player
# records built from them. Every 20 minutes rather than every minute — none of
# these change during a match, and the live scoreboard is a separate, faster
# path that this must never compete with.
#
# ⛔ SCHEDULED. Netlify returns 403 to direct HTTP. The button lives in
# football-registry-sync-now.js. tests/scheduled-functions.test.js enforces it.
[functions."football-registry-sync"]
  schedule = "*/20 * * * *"

# Programme drafts and matchday publication.
#
# WAS hourly, on the reasoning that a draft is assembled days ahead. That was
# wrong about the moment that matters. On matchday the engine is waiting for the
# official team sheets, and an hourly timer means up to 59 minutes between the
# teams being confirmed and the programme appearing — for a 3pm kick-off with
# teams out at 2pm, that is the difference between a pre-match programme and
# none at all. The same gap delays every recovery by up to an hour.
#
# Every ten minutes costs the provider nothing: this function never calls them.
# It reads the club's own registry and the club's own data files.
#
# ⛔ SCHEDULED. The button lives in programme-sync-now.js.
[functions."programme-sync"]
  schedule = "*/10 * * * *"

# Pin a stable Node LTS so the cloud install is deterministic. Cloud builds
# started failing (exit 2 in "building site") after edf8e44 while local builds
# passed — classic floating-toolchain drift. A committed package-lock.json
# (→ npm ci) plus this pin make the build reproducible.
[build.environment]
  NODE_VERSION = "20"

# The governance documents (THE-LANE.md, VISION.md, ROADMAP.md) and docs/ are
# tracked ON PURPOSE — a constitution that lives on one laptop is a private
# opinion, and standards nobody can read aren't standards. Netlify publishes the
# repo root, so they are also SERVED at the domain.
#
# They must not be INDEXED. They contain candid internal assessment — which tools
# nobody uses, where the club depends on one person, what a claim was before it
# was corrected. Meanwhile llms.txt deliberately invites sixteen AI crawlers to
# read this site and cite it as authoritative about the club. An indexed roadmap
# is a sentence like "the Boardroom has never been used" quoted back as a fact
# about Rayners Lane FC.
#
# Nothing links to them and they are not in the sitemap, so discovery is already
# unlikely — this makes it impossible, at no cost. Readable by a human who is
# handed the URL; invisible to search and answer engines.
[[headers]]
  for = "/*.md"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/docs/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# HTML must always revalidate so staff/fans see updates immediately
# (no more "I saved it but still see the old version").
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"

# JS/CSS aren't content-hashed (no build step), so we can't use immutable/1-year
# caching without risking stale-asset bugs. stale-while-revalidate is the safe
# win: returning visitors get the cached file INSTANTLY (no blocking round-trip),
# the browser revalidates in the background, and a deploy is picked up on the
# next load.
#
# max-age MUST stay 0. It was 3600, which does NOT do the above: the browser
# served JS from cache for an hour without ever asking, so a deploy took up to
# an hour to reach anyone — and worse, the service worker's install-time
# addAll() was handed that stale copy out of the HTTP cache and then froze it
# into the SW cache, where it survived until the next CACHE bump. That is the
# "I published it but nothing changed" complaint, for code instead of data.
# max-age=0 + stale-while-revalidate still serves instantly from cache; it just
# also revalidates, which is the whole point.
[[headers]]
  for = "/js/*"
  [headers.values]
    # no-cache = the browser must revalidate every load (cheap 304 when unchanged).
    # NOT stale-while-revalidate: that served up to a day-old copy, so live-match
    # scoreboard fixes never reached phones during a game. Correctness > a 304.
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# Fonts / static images are safe to cache hard — their content is stable and
# Netlify Image CDN URLs already carry their own long cache.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"

# The club's new-member notifications.
#
# Joining nudges the outbox directly, so the normal case is that info@ hears
# within seconds. This schedule is for the abnormal one — provider down, key
# expired, sender domain not yet verified — where the supporter still joined
# and the club still needs to be told. Also tidies expired signup intents.
#
# ⛔ SCHEDULED. Netlify returns 403 to direct HTTP. The portal's Retry button
# goes through fan-admin.js, which is PIN-gated.
[functions."fan-notify"]
  schedule = "*/5 * * * *"
