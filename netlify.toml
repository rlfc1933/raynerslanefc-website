[build]
  functions = "netlify/functions"
  edge_functions = "netlify/edge-functions"

# Guarantee the Sponsor Radar baked business snapshots are bundled with the
# radar-discover function (it require()s them, but this makes it bulletproof).
# These ship INSIDE the function bundle — not publicly served.
[functions."radar-discover"]
  included_files = ["netlify/functions/radar-data/**"]

# Serve the DYNAMIC sitemap (netlify/functions/sitemap.js) at /sitemap.xml.
# force=true so it wins over any static file; status 200 so it's a rewrite (the
# URL stays /sitemap.xml for crawlers).
# The club's own news feed. Pitchero used to provide one; when the club deleted
# that account the feed died with it. This is ours, at a proper URL.
[[redirects]]
  from = "/rss.xml"
  to = "/.netlify/functions/rss"
  status = 200
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "/.netlify/functions/sitemap"
  status = 200
  force = true

# Pin a stable Node LTS so the cloud install is deterministic. Cloud builds
# started failing (exit 2 in "building site") after edf8e44 while local builds
# passed — classic floating-toolchain drift. A committed package-lock.json
# (→ npm ci) plus this pin make the build reproducible.
[build.environment]
  NODE_VERSION = "20"

# The governance documents (THE-LANE.md, VISION.md, ROADMAP.md) and docs/ are
# tracked ON PURPOSE — a constitution that lives on one laptop is a private
# opinion, and standards nobody can read aren't standards. Netlify publishes the
# repo root, so they are also SERVED at the domain.
#
# They must not be INDEXED. They contain candid internal assessment — which tools
# nobody uses, where the club depends on one person, what a claim was before it
# was corrected. Meanwhile llms.txt deliberately invites sixteen AI crawlers to
# read this site and cite it as authoritative about the club. An indexed roadmap
# is a sentence like "the Boardroom has never been used" quoted back as a fact
# about Rayners Lane FC.
#
# Nothing links to them and they are not in the sitemap, so discovery is already
# unlikely — this makes it impossible, at no cost. Readable by a human who is
# handed the URL; invisible to search and answer engines.
[[headers]]
  for = "/*.md"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/docs/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# HTML must always revalidate so staff/fans see updates immediately
# (no more "I saved it but still see the old version").
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "no-cache"
    Access-Control-Allow-Origin = "*"

# JS/CSS aren't content-hashed (no build step), so we can't use immutable/1-year
# caching without risking stale-asset bugs. stale-while-revalidate is the safe
# win: returning visitors get the cached file INSTANTLY (no blocking round-trip),
# the browser revalidates in the background, and a deploy is picked up on the
# next load.
#
# max-age MUST stay 0. It was 3600, which does NOT do the above: the browser
# served JS from cache for an hour without ever asking, so a deploy took up to
# an hour to reach anyone — and worse, the service worker's install-time
# addAll() was handed that stale copy out of the HTTP cache and then froze it
# into the SW cache, where it survived until the next CACHE bump. That is the
# "I published it but nothing changed" complaint, for code instead of data.
# max-age=0 + stale-while-revalidate still serves instantly from cache; it just
# also revalidates, which is the whole point.
[[headers]]
  for = "/js/*"
  [headers.values]
    # no-cache = the browser must revalidate every load (cheap 304 when unchanged).
    # NOT stale-while-revalidate: that served up to a day-old copy, so live-match
    # scoreboard fixes never reached phones during a game. Correctness > a 304.
    Cache-Control = "no-cache"

[[headers]]
  for = "/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, stale-while-revalidate=86400"

# Fonts / static images are safe to cache hard — their content is stable and
# Netlify Image CDN URLs already carry their own long cache.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=604800"
